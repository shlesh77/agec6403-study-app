<style>
/* Layout: phone-first app shell (max 680px column), sticky top bar, fixed bottom tab bar; lessons use an in-page segmented control. */
:root {
  --paper: #F3F4EF;
  --card: #FFFFFF;
  --sunk: #E7E9E0;
  --ink: #1B2318;
  --muted: #5C6556;
  --line: #D6DACB;
  --accent: #2E6A3C;      /* field green */
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEBDD;
  --wheat: #A86F12;       /* wheat gold, used for highlights and tool badges */
  --wheat-soft: #F5E7C8;
  --sky: #2F5D8A;         /* clarifying boxes */
  --sky-soft: #DDE8F3;
  --good: #23784A; --good-soft: #DDF1E5;
  --bad: #B03838; --bad-soft: #F7DEDE;
  --c1: #2E6A3C; --c2: #2F5D8A; --c3: #A86F12; --c4: #7A4FA0; --c5: #A23E5C; --c6: #3F7F7A; --c7: #8A5A2B; --c8: #5A6B2F; --c9: #4A5A78; --c10: #6B6B6B;
  --shadow: 0 1px 2px rgba(27,35,24,.06), 0 4px 14px rgba(27,35,24,.06);
  --f-display: "Archivo", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10140F; --card: #181E16; --sunk: #20281D; --ink: #E6EADF; --muted: #9BA592; --line: #2C3628;
    --accent: #6FBF7E; --accent-ink: #0B1A0E; --accent-soft: #1D3322;
    --wheat: #E3B252; --wheat-soft: #3A2D12; --sky: #8DB6E2; --sky-soft: #172636;
    --good: #5CC98A; --good-soft: #143222; --bad: #F07A7A; --bad-soft: #3A1B1B;
    --c1: #6FBF7E; --c2: #8DB6E2; --c3: #E3B252; --c4: #B08AD6; --c5: #E07A98; --c6: #6FC4BC; --c7: #D79C63; --c8: #A9BF6A; --c9: #97A8CC; --c10: #A8A8A8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10140F; --card: #181E16; --sunk: #20281D; --ink: #E6EADF; --muted: #9BA592; --line: #2C3628;
  --accent: #6FBF7E; --accent-ink: #0B1A0E; --accent-soft: #1D3322;
  --wheat: #E3B252; --wheat-soft: #3A2D12; --sky: #8DB6E2; --sky-soft: #172636;
  --good: #5CC98A; --good-soft: #143222; --bad: #F07A7A; --bad-soft: #3A1B1B;
  --c1: #6FBF7E; --c2: #8DB6E2; --c3: #E3B252; --c4: #B08AD6; --c5: #E07A98; --c6: #6FC4BC; --c7: #D79C63; --c8: #A9BF6A; --c9: #97A8CC; --c10: #A8A8A8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { font-family: var(--f-body); font-size: 16.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.shell { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; border-bottom: 1px solid transparent; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar h1 { font-family: var(--f-display); font-size: 18px; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }

/* Bottom nav */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar nav { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--accent); }

/* Type */
h2.display { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 7vw, 34px); line-height: 1.08; letter-spacing: -.015em; margin: 6px 0 6px; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 19px; margin: 24px 0 8px; text-wrap: balance; }
h4 { font-size: 16px; margin: 16px 0 6px; font-weight: 700; }
p { margin: 8px 0; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
ul.pts, ol.pts { padding-left: 22px; margin: 8px 0; }
ul.pts li, ol.pts li { margin: 5px 0; }
code, pre { font-family: var(--f-mono); font-size: 13.5px; }
pre.code { background: var(--sunk); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 10px 0; }

/* Content boxes */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.formula { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 14px; margin: 12px 0; overflow-x: auto; }
.formula .lbl, .clarify .lbl, .prof .lbl, .exam .lbl, .warn .lbl { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.formula .lbl { color: var(--accent); }
.clarify { background: var(--sky-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.clarify .lbl { color: var(--sky); }
.prof { background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.prof .lbl { color: var(--muted); }
.exam { background: var(--wheat-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.exam .lbl { color: var(--wheat); }
.warn { background: var(--bad-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.warn .lbl { color: var(--bad); }
.tip { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.scrollx { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 8px 0; font-size: 14.5px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: center; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t thead th { border-bottom: 1.5px solid var(--ink); border-top: 1.5px solid var(--ink); font-weight: 700; vertical-align: bottom; }
table.t tbody tr:last-child td { border-bottom: 1.5px solid var(--ink); }
mjx-container { max-width: 100%; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 2px 0; margin: 8px 0 !important; }

/* Home */
.continue { display: flex; gap: 14px; align-items: center; text-decoration: none; background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 14px 16px; margin: 14px 0 6px; }
.continue .eyebrow { color: inherit; opacity: .8; }
.continue strong { display: block; font-family: var(--f-display); font-size: 18px; line-height: 1.2; }
.continue svg { width: 28px; height: 28px; flex: none; margin-left: auto; }
.meter { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.overall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.part { margin: 26px 0 4px; }
.part .eyebrow { color: var(--wheat); }
.part h3 { margin: 2px 0 0; font-size: 17px; }
.chapter { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin: 12px 0; overflow: hidden; box-shadow: var(--shadow); }
.chapter > header { padding: 14px 16px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; cursor: pointer; }
.chnum { grid-row: span 2; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 19px; color: var(--card); background: var(--chc); }
.chapter h3 { margin: 0; font-size: 17px; }
.chapter .src { font-size: 13px; color: var(--muted); }
.chapter .meter { margin: 0 16px 10px; }
.chapter .meter i { background: var(--chc); }
.lessons { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lessons a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--line); }
.lessons li:last-child a { border-bottom: 0; }
.lessons a:hover { background: var(--sunk); }
.ldot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.ldot.done { background: var(--chc); border-color: var(--chc); }
.ldot.done::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--card); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.ldot.rev { border-style: dashed; border-color: var(--chc); }
.lt { flex: 1; min-width: 0; }
.lt b { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.lt span { font-size: 12.5px; color: var(--muted); }
.qbadge { font-size: 11.5px; font-weight: 700; font-family: var(--f-mono); padding: 2px 7px; border-radius: 99px; background: var(--good-soft); color: var(--good); white-space: nowrap; }
.preview { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--wheat-soft); color: var(--wheat); white-space: nowrap; }

/* Lesson */
.lhead { padding: 4px 0 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: var(--card); background: var(--chc); text-decoration: none; }
.seg { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 15; display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px; margin: 10px 0 14px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; font-size: 14px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.seg button .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-left: 3px; }
.pane { min-height: 40vh; }
.pane > section > h3:first-child { margin-top: 4px; }
details.sol { border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin: 10px 0; }
details.sol > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: flex-start; }
details.sol > summary::-webkit-details-marker { display: none; }
details.sol > summary::before { content: "+"; font-family: var(--f-mono); font-weight: 700; color: var(--accent); width: 14px; flex: none; }
details.sol[open] > summary::before { content: "−"; }
details.sol > .body { padding: 10px 14px 14px 38px; border-top: 1px dashed var(--line); }
.ans { display: inline-block; margin-top: 6px; font-weight: 700; background: var(--good-soft); color: var(--good); padding: 2px 8px; border-radius: 6px; }
.vid { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 10px 0; }
.vid:hover { border-color: var(--accent); }
.vid .play { width: 64px; height: 46px; border-radius: 10px; background: #C4302B; display: grid; place-items: center; }
.vid .play svg { width: 22px; height: 22px; fill: #FFFFFF; }
.vid b { display: block; line-height: 1.3; font-size: 15px; }
.vid small { color: var(--muted); font-size: 12.5px; }
.vid .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.vid > div { min-width: 0; }
.ytsearch { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); text-decoration: none; color: var(--ink); }

/* Quiz */
.q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
.q .qn { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.q .stem { margin: 6px 0 10px; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.opt .k { font-family: var(--f-mono); font-weight: 700; font-size: 13px; color: var(--muted); width: 16px; flex: none; padding-top: 1px; }
.opt .v { min-width: 0; overflow-x: auto; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sunk); font-size: 15px; }
.why b { color: var(--good); }
.why.no b { color: var(--bad); }
.scorebar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin: 12px 0; flex-wrap: wrap; }
.scorebar b { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }

/* One-line review */
.ol { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 8px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 10px 12px; align-items: start; }
.ol .no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 3px; min-width: 22px; }
.ol .oq { font-weight: 600; min-width: 0; }
.ol .oa { grid-column: 2 / 4; display: none; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; min-width: 0; overflow-x: auto; }
.ol.open .oa { display: block; }
.ol .show { border: 1.5px solid var(--line); background: var(--paper); border-radius: 8px; font-size: 12.5px; font-weight: 700; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.ol.got { border-color: var(--good); }
.ol .gotit { grid-column: 2 / 4; display: none; gap: 8px; }
.ol.open .gotit { display: flex; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--line); background: var(--card); padding: 10px 16px; border-radius: 11px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); border-color: var(--good); color: var(--card); }
.btn.sm { padding: 6px 11px; font-size: 13.5px; border-radius: 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lessonfoot { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin: 26px 0 8px; align-items: center; }
.lessonfoot .btn { padding: 10px; }
.lessonfoot > :last-child { justify-self: end; }
.reviewcta { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; border: 1.5px dashed var(--chc); border-radius: 12px; padding: 12px 14px; margin: 16px 0; }
.reviewcta b { display: block; }

/* Flashcards */
.flash { perspective: 1200px; margin: 12px 0; }
.flash .inner { position: relative; min-height: 250px; transition: transform .45s ease; transform-style: preserve-3d; cursor: pointer; }
.flash.flipped .inner { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 18px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: var(--shadow); overflow: auto; }
.flash .back { transform: rotateY(180deg); background: var(--accent-soft); }
.flash .face .eyebrow { position: absolute; top: 12px; left: 16px; right: 16px; text-align: left; }
.flash .face .content { font-size: 17.5px; max-width: 100%; }
.flash .hint { position: absolute; bottom: 10px; font-size: 12.5px; color: var(--muted); }
.mini-flash { display: grid; gap: 10px; }
.mini-flash .fc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.mini-flash .fc button { width: 100%; text-align: left; border: 0; background: transparent; padding: 12px 14px; cursor: pointer; font-weight: 600; display: flex; gap: 10px; }
.mini-flash .fc button::before { content: "?"; font-family: var(--f-mono); color: var(--accent); }
.mini-flash .fc .bk { padding: 0 14px 12px 34px; display: none; }
.mini-flash .fc.open .bk { display: block; }
.filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filter::-webkit-scrollbar { display: none; }
.filter button { flex: none; border: 1.5px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.filter button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Forms */
.field { display: grid; gap: 4px; margin: 8px 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field input, .field textarea, .field select, textarea.notes { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 11px; }
textarea.notes { min-height: 180px; resize: vertical; line-height: 1.5; }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 11px; padding: 10px 12px; margin: 8px 0 12px; }

/* Tools */
.tool { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 14px 0; box-shadow: var(--shadow); }
.tool > .th { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.tool > .th b { font-family: var(--f-display); font-size: 16.5px; }

<template data-lesson="c0l1" data-ch="0" data-title="What this course is about" data-src="Syllabus Fall 2026 · Aug 31 and Sep 2 lectures" data-yt="production economics research agricultural economics">
<section data-s="learn">
<h3>The course in one sentence</h3>
<p>AGEC 6403 (Advanced Production, Dr. B. Wade Brorsen) teaches the research techniques needed to solve applied production problems, using the <b>primal approach</b> (estimate the production function directly from experiments) rather than the dual approach, with heavy emphasis on <b>decision making under risk</b>.</p>

<h3>The four course objectives</h3>
<p>After the course you should be able to:</p>
<ol class="pts">
<li>Estimate production functions from data from an agronomy experiment.</li>
<li>Mathematically specify a data generating process (DGP).</li>
<li>Mathematically specify a producer's objective function for a real-world situation.</li>
<li>Determine the optimal quantities of inputs and outputs with and without risk aversion.</li>
</ol>

<h3>The research chain used in every assignment</h3>
<div class="formula"><span class="lbl">Theory → empirical model → decision</span>
<b>DGP</b> (how the data arise) → <b>estimation</b> (PROC MIXED, PROC NLMIXED, RStan) → <b>optimization</b> (expected profit or expected utility) → recommendation.</div>
<div class="prof"><span class="lbl">In class (Aug 31)</span>"One of the things we're trying to teach is the way you do research ... you have a theoretical model that sort of sets up your hypothesis. And then you have an empirical model." A reviewed paper jumped from Mexican weather straight to Canadian vegetable consumption and skipped the chain weather → yield → prices → trade → retail prices → consumption. "We're not gonna do that."</div>

<h3>Syllabus outline</h3>
<div class="scrollx"><table class="t"><thead><tr><th>Part</th><th>Topics</th><th>In this app</th></tr></thead><tbody>
<tr><td>I. The primal approach</td><td>ANOVA models, expected-profit maximization, specifying objective functions, random effects, stochastic plateau functions. <b>Exam 1</b> (Sep 23)</td><td>Chapters 1–4</td></tr>
<tr><td>II. Decision making under risk</td><td>Theory of risk, mean–variance, stochastic dominance, direct expected-utility maximization, numerical integration. <b>Exam 2</b></td><td>Chapters 6–8</td></tr>
<tr><td>III. Other production function methods</td><td>Bayesian estimation, spatial models, prelim-style questions</td><td>Chapter 5 (Bayesian, taught Sep 21–30) and Chapter 10</td></tr>
<tr><td>IV. Special topics</td><td>Frontier functions, duality, estimation in R, copulas, credit risk, machine learning</td><td>Chapter 10 (preview)</td></tr>
<tr><td>V. Presentations</td><td>Student term papers</td><td>Chapter 9</td></tr>
</tbody></table></div>

<h3>Grading and logistics</h3>
<ul class="pts">
<li>Exams 50%, homework and quizzes 30%, term paper 20%. A 85–100, B 70–85, C 50–70.</li>
<li>Exams are closed book, long and challenging; make-ups are harder. <b>Final exam: Wednesday, December 9, 8:00–9:50 am.</b></li>
<li>Weekly homework (mostly with Claude Code) with program statements and output; a 20-point in-class quiz is part of each homework. Late homework loses 10 points.</li>
<li>Term paper: journal-style, empirical, about 20–30 pages, following "Observations on the Journal Publication Process."</li>
</ul>

<h3>Using AI as a learning tool</h3>
<div class="prof"><span class="lbl">In class (Sep 2)</span>"I've got to ask it what it did and why. I've got to ask it to recheck it. I've got to ask it to explain this part to me." Useful prompts: "What did my professor want me to learn from this assignment?" and "What are some likely quiz questions?"</div>
<div class="clarify"><span class="lbl">Clarifying</span>The quizzes test whether <i>you</i> understand the homework. Running Claude Code without reading what it did is the most common reason for low quiz scores. After every assignment, use this app's one-line review for the matching chapter.</div>
</section>

<template data-lesson="c0l2" data-ch="0" data-title="Which method do I use? The decision flowchart" data-src="Lecture Oct 2 · notebook IMG_2656–2657" data-yt="decision analysis under risk agricultural economics">
<section data-s="learn">
<h3>The big picture</h3>
<p>On October 2 the professor drew a flowchart so you could see where every method in the course fits. "I'm a big picture person." Learn it early; each chapter of this app is one box.</p>
<div class="scrollx"><table class="t"><thead><tr><th>Step</th><th>Question</th><th>Answer → tool</th></tr></thead><tbody>
<tr><td>1</td><td>Are data available?</td><td>No → subjective elicitation, expert opinion (Delphi), surveys. Yes → step 2.</td></tr>
<tr><td>2</td><td>Observational or experimental data?</td><td>Observational → duality (profit and cost functions). Experimental → primal production functions: ANOVA, regression, logit, probit, Tobit, spatial models.</td></tr>
<tr><td>3</td><td>Does risk matter?</td><td>No → expected profit: budgeting (discrete), calculus (analytical), linear/nonlinear optimization. Yes → step 4.</td></tr>
<tr><td>4</td><td>Are the choices discrete?</td><td>Yes → step 5. No (continuous) → step 7.</td></tr>
<tr><td>5</td><td>First-degree stochastic dominance?</td><td>Yes → stop. No → second-degree SD or mean–variance.</td></tr>
<tr><td>6</td><td>SSD or E-V decides it?</td><td>Yes → stop. No → SDRF or SERF.</td></tr>
<tr><td>7</td><td>Normality?</td><td>Yes → quadratic programming. No → direct expected-utility maximization (also MOTAD / Target MOTAD).</td></tr>
</tbody></table></div>
<div class="exam"><span class="lbl">Scope</span>"Direct expected utility maximization is part of the class; quadratic programming is not." MOTAD and Target MOTAD belong to advanced math programming and are not covered.</div>

<h3>Why each branch</h3>
<ul class="pts">
<li><b>No data:</b> MBA courses teach decisions without data; agricultural economists are usually the analysts with data. When probabilities are missing, write down your own guesses and ask an expert to correct them: "people are really a lot better to tell you when you're wrong." A formal <b>Delphi</b> process asks several experts and iterates to a group opinion.</li>
<li><b>Observational data → duality.</b> Kansas State (KFMA farm records) leans on duality. The professor distrusts estimated profit functions: little price variation, highly correlated prices, unbelievable answers. Cost functions sometimes work.</li>
<li><b>FSD</b> applies to everyone who prefers more to less: "you really can't beat that." <b>SSD</b> and E-V apply to risk-averse people. If those fail, add assumptions: <b>SDRF</b> (Jack Meyer) bounds risk aversion; <b>SERF</b> (James Richardson) picks a utility form.</li>
</ul>
<div class="prof"><span class="lbl">In class</span>"I dislike it so much when people say ... people apply extra nitrogen on their fields because of risk aversion ... They do that because it's the expected profit maximizing solution under uncertainty when you have this asymmetric response." (You will see why in Chapter 3.)</div>
</section>

<section data-s="examples">
<details class="sol"><summary>A farmer picks one of three cotton varieties using a table of incomes by weather state. Which branch?</summary><div class="body"><p>Data exist, risk matters, and the choice is <b>discrete</b>, so start with FSD, then SSD / E-V, then SDRF/SERF if needed (Chapter 7).</p></div></details>
<details class="sol"><summary>A producer chooses a nitrogen rate with a nonnormal yield distribution and a CARA utility function. Which branch?</summary><div class="body"><p>Continuous choice, risk matters, not normal → <span class="ans">direct expected-utility maximization</span> with numerical integration (Chapter 8).</p></div></details>
<details class="sol"><summary>You have farm-record data on prices paid and received but no experiments. Which branch?</summary><div class="body"><p>Observational data → <b>duality</b> (profit or cost functions).</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Decision theory" data-by="Linda Williams" href="https://www.youtube.com/watch?v=FhJe97kllHU">Decision Theory: Expected Value of Perfect Information or EVPI</a>
<a class="vid" data-tag="Risk basics" data-by="BurkeyAcademy" href="https://www.youtube.com/watch?v=Hr0K6K16PQs">Risk Aversion and Expected Utility Basics</a>
</section>

<section data-s="quiz">
<div class="q" data-a="3"><div class="stem">Choices are continuous, risk matters and outcomes are not normal. Which method?</div><ol><li>First-degree stochastic dominance</li><li>Quadratic programming</li><li>Partial budgeting</li><li>Direct expected-utility maximization</li></ol><div class="why">Step 7: no normality → direct expected-utility maximization.</div></div>

<!-- ===================== CHAPTER 1 ===================== -->
<template data-chapter="1" data-part="I. The primal approach" data-title="Writing the data generating process" data-dates="Weeks 1–2 · Sep 4 · Sep 14 · Sep 18 · Assignments 1–3" data-color="1"></template>

<template data-lesson="c1l1" data-ch="1" data-title="ANOVA, dummy variables and matrix form" data-src="Assignments 1 and 3 · Sep 4 lecture · Sep 14 quiz review" data-yt="ANOVA model dummy variable regression matrix form">
<section data-s="learn">
<h3>What a DGP is</h3>
<p>A <b>data generating process</b> states how each observation arises: the mean function, every index, every random component, its distribution, and how the random parts relate (usually independent). An <b>empirical model</b> estimates it; a <b>decision model</b> uses the estimate.</p>
<div class="prof"><span class="lbl">In class (Sep 2)</span>"Very important to me ... that you know how to write a data generating process." Exam 1: a DGP question "you can just count on that."</div>

<h3>Three ways to write the same model</h3>
<p>Assignment 3 asked for the DGP three ways. Example: treatment \(i=1,\dots,I\), year \(t=1,\dots,T\), replication \(r\).</p>
<div class="formula"><span class="lbl">1. ANOVA (effects) format</span>
\[y_{itr}=\mu+\alpha_i+u_t+b_{r(t)}+\varepsilon_{itr},\]
\(u_t\sim N(0,\sigma_u^2)\), \(b_{r(t)}\sim N(0,\sigma_b^2)\), \(\varepsilon_{itr}\sim N(0,\sigma_e^2)\), all mutually independent, with \(\sum_i\alpha_i=0\) or one \(\alpha_i\) set to zero.</div>
<div class="formula"><span class="lbl">2. Regression with dummy variables</span>
\[y_{itr}=\beta_0+\sum_{k=2}^{I}\beta_k D_{ik}+u_t+b_{r(t)}+\varepsilon_{itr},\qquad D_{ik}=1(i=k).\]</div>
<div class="formula"><span class="lbl">3. Matrix notation</span>
\[\mathbf y=\mathbf X\boldsymbol\beta+\mathbf Z\mathbf u+\boldsymbol\varepsilon,\qquad \operatorname{var}(\mathbf y)=\mathbf V=\mathbf Z\mathbf G\mathbf Z'+\mathbf R.\]
Vectors and matrices in bold; variables italic.</div>
<div class="clarify"><span class="lbl">Clarifying: what \(\alpha_i\) is</span>"\(\gamma_n\) is not the nitrogen level. It is a fixed effect for the nitrogen level ... equivalent to the dummy variable ... that number is the coefficient." You never plug 0, 20, 40 lb into an ANOVA effect; you would in a regression on \(N\).</div>

<h3>The panel (dummy-variable) model from weeks 1–2</h3>
<div class="formula"><span class="lbl">Individual intercepts</span>
\[y_{it}=\bar\beta_1+\mu_i+\sum_{k=2}^{K}\beta_k X_{kit}+e_{it},\quad E(e_{it})=0,\ E(\mathbf e\mathbf e')=\sigma^2\mathbf I_{NT}.\]
Matrix form: \(\mathbf Y=[\mathbf I_N\otimes \mathbf j_T\ \vdots\ \mathbf X_s][\boldsymbol\beta_1'\ \boldsymbol\beta_s']'+\mathbf e\), where \(\mathbf j_T\) is a \(T\times1\) vector of ones and \(\otimes\) is the Kronecker product. Parameters: \(N+K-1\) betas and one \(\sigma^2\).</div>
<div class="clarify"><span class="lbl">Clarifying: matrices are just stacked equations</span>"The memorizers find it harder than the learners." Decide how to stack observations (all \(t\) for individual 1 first, or all individuals for year 1 first), then build the right side so each row reproduces one scalar equation. Kronecker products, vectors of ones and identity matrices appear only to do that bookkeeping.</div>

<h3>Counting parameters and the dummy trap</h3>
<ul class="pts">
<li>With an intercept and \(I\) treatments you need \(I-1\) dummies (SAS sets the last level to zero).</li>
<li>"I think it's goofy to leave out \(\beta_1\), but it's not wrong" (laying-hens example). Without an intercept you can keep all \(I\) dummies.</li>
<li>Quiz 1: two treatments, no replication, an intercept plus two effects → <b>singular</b>: as many parameters as observations, so the residual variance cannot be estimated.</li>
<li>Regression is the word for observational data; ANOVA for designed experiments.</li>
</ul>

<h3>Adding replications and covariates</h3>
<ul class="pts">
<li>Replication adds an \(r\) subscript; blocking factors are usually random effects.</li>
<li>A continuous covariate (average initial weight) enters like a regression coefficient. It is still a fixed effect, just not a CLASS variable.</li>
<li>Averaging over blocks first: "There's no theoretical advantage to disaggregate data in this case, because we have no explanatory variable at the block level" (exception: modeling heteroskedasticity across reps).</li>
</ul>
</section>

<section data-s="examples">
<h3>Worked DGPs from class</h3>
<details class="sol"><summary>Assignment 1: wheat varieties (10) across 26 site-years. Write the DGP the professor wrote.</summary><div class="body"><p>\(y_{it}=\delta_i+\varepsilon_{it}\), \(\varepsilon_{it}\sim N(0,\sigma^2)\), where \(y_{it}\) is yield of variety \(i\) in site-year \(t\) and \(\delta_i\) is the mean of variety \(i\). Estimated with variety dummies and no intercept. Adding site-year as a fixed effect gives \(y_{it}=\delta_i+\gamma_t+\varepsilon_{it}\).</p></div></details>
<details class="sol"><summary>Six nitrogen levels and 44 years. (a) ANOVA with random years. (b) Quadratic. (c) Optimization.</summary><div class="body">
<p>(a) \(y_{nt}=\mu+\gamma_n+\alpha_t+\varepsilon_{nt}\), \(\alpha_t\sim N(0,\sigma_\alpha^2)\), \(\varepsilon_{nt}\sim N(0,\sigma_\varepsilon^2)\), \(\operatorname{cov}(\alpha_t,\varepsilon_{nt})=0\). N level fixed, year random.</p>
<p>(b) \(y_{nt}=\beta_0+\beta_1N_n+\beta_2N_n^2+\alpha_t+\varepsilon_{nt}\) with the same random terms. Nitrogen varies across plots within a year, so \(N\) needs its own subscript \(n\), not \(t\).</p>
<p>(c) \(\max_{N\ge0}\ pE(y)-rN\) with \(E(y)=\beta_0+\beta_1N+\beta_2N^2\) → \(N^*=(r/p-\beta_1)/(2\beta_2)\) when \(\beta_2&lt;0\).</p></div></details>
<details class="sol"><summary>Laying hens: 1–5 hens per cage, total eggs per cage over 45 days. Write the dummy-variable DGP.</summary><div class="body"><p>\(y_a=\beta_0+\sum_{i=2}^{5}\beta_iD_{ai}+\varepsilon_a\), \(D_{ak}=1\) if cage \(a\) has \(k\) hens and 0 otherwise, \(\varepsilon_a\sim N(0,\sigma^2)\). The dummy must carry the cage subscript \(a\). In SAS: <code>dummy1 = (hens = 1);</code></p></div></details>
<details class="sol"><summary>Assignment 3: 16 cover-crop systems, RCBD with 4 blocks, 4 crop years. Write the ANOVA DGP.</summary><div class="body"><p>\(y_{sbt}=\mu+\tau_s+\beta_b+\gamma_t+\varepsilon_{sbt}\) where \(\tau_s\) is the fixed effect of system \(s=1,\dots,16\), \(\beta_b\sim N(0,\sigma_\beta^2)\) the block effect, \(\gamma_t\sim N(0,\sigma_\gamma^2)\) the crop-year effect, \(\varepsilon_{sbt}\sim N(0,\sigma^2)\), all independent. The quiz comment "you need another subscript; is r rep?" is about forgetting the block index.</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">In \(y_{nt}=\mu+\gamma_n+\alpha_t+\varepsilon_{nt}\), what is \(\gamma_n\)?</div><ol><li>The nitrogen rate in lb/acre</li><li>The fixed effect (coefficient) of nitrogen level \(n\)</li><li>A random year effect</li><li>The error term</li></ol><div class="why">It plays the role of a dummy coefficient; the rate itself is not plugged in.</div></div>
<div class="q" data-a="2"><div class="stem">A model with two treatments, one observation each, an intercept and two treatment effects is …</div><ol><li>Overidentified</li><li>Heteroskedastic</li><li>Singular</li><li>Nested</li></ol><div class="why">More parameters than can be identified from the cells; residual variance has zero degrees of freedom.</div></div>
<div class="q" data-a="0"><div class="stem">With an intercept and 5 treatments, how many treatment dummies?</div><ol><li>4</li><li>5</li><li>6</li><li>1</li></ol><div class="why">\(I-1\) dummies avoid the dummy-variable trap.</div></div>
<div class="q" data-a="3"><div class="stem">Which SAS statement tells PROC MIXED which variables are discrete?</div><ol><li>MODEL</li><li>RANDOM</li><li>PARMS</li><li>CLASS</li></ol><div class="why">Assignment 1 quiz: <code>class variety environment;</code></div></div>

<template data-lesson="c1l2" data-ch="1" data-title="Fixed vs random effects, error components and BLUPs" data-src="Weeks 1–2 notebook · Assignment 2 · Sep 2 and Sep 18 lectures" data-yt="fixed effects vs random effects BLUP shrinkage mixed model">
<section data-s="learn">
<h3>Same equation, different assumptions</h3>
<p>Fixed vs random is a change in <b>assumptions</b>, not in the model equation. In the error-components model the individual effects get a distribution:</p>
<div class="formula"><span class="lbl">Error-components model</span>
\[E(\mu_i)=0,\quad E(\mu_i^2)=\sigma_\mu^2,\quad E(\mu_i\mu_j)=0\ (i\ne j),\]
\[\boldsymbol\Phi_i=\sigma_\mu^2\mathbf j_T\mathbf j_T'+\sigma_e^2\mathbf I_T,\qquad \boldsymbol\Phi=\mathbf I_N\otimes\boldsymbol\Phi_i,\]
\[\hat{\boldsymbol\beta}_{GLS}=(\mathbf X'\boldsymbol\Phi^{-1}\mathbf X)^{-1}\mathbf X'\boldsymbol\Phi^{-1}\mathbf Y.\]
\(\boldsymbol\Phi_i\) has \(\sigma_e^2+\sigma_\mu^2\) on the diagonal and \(\sigma_\mu^2\) off the diagonal: observations that share an effect are correlated.</div>
<p>PROC MIXED estimates variance components by <b>REML</b> (restricted maximum likelihood), which corrects the downward small-sample bias of ML variance estimates (a degrees-of-freedom correction).</p>

<h3>Why is year usually random? (old exam question)</h3>
<ol class="pts">
<li><b>Not controlled by the researcher.</b> "The one I'm really looking for is that it's not controlled by the researcher. And therefore, it's random." Nobody controls the weather.</li>
<li>You want statements about <b>all years</b> (the distribution of years), not just the years observed.</li>
<li>Higher power and smaller standard errors (more efficient).</li>
</ol>
<div class="warn"><span class="lbl">Pitfall</span>A perennial like switchgrass takes 3–4 years to reach potential, so age is confounded with year. Treating year as random there gives standard errors that are falsely small.</div>

<h3>Why random effects for variety, which the researcher <i>does</i> control?</h3>
<div class="prof"><span class="lbl">In class (Sep 2)</span>"Nobody got that right on the quiz." It <b>depends on the goal</b>: Assignment 1 wanted paired comparisons of one variety with another → fixed effects. Assignment 2 wanted the top five varieties when varieties had very different numbers of site-years → random variety effects (BLUPs, the Bayesian shrinkage estimator). If the expected yield goes into an optimization model, "you really ought to be using the Bayesian shrinkage adjustment."</div>
<div class="formula"><span class="lbl">Shrinkage (BLUP intuition)</span>
\[\hat u_i^{BLUP}=\frac{\sigma_u^2}{\sigma_u^2+\sigma_e^2/n_i}\,(\bar y_i-\bar y).\]
A variety seen in few site-years (\(n_i\) small) is pulled strongly toward the grand mean; one seen often keeps most of its raw difference.</div>
<div class="clarify"><span class="lbl">Clarifying: the Assignment 2 ranking flip</span>Breck had 11 site-years with an unadjusted mean of 65.45 bu; Showdown had 46 site-years and 58.61 bu. Breck's high raw mean rests on few observations, so its BLUP shrinks much more. Rankings by raw means and by BLUPs differ because of unequal numbers of observations.</div>

<h3>Reading PROC MIXED output (handout)</h3>
<ul class="pts">
<li><b>Covariance structure "Diagonal"</b>: no off-diagonal covariance, no heteroskedasticity.</li>
<li><b>Estimation method REML</b>; <b>"Profile"</b>: the residual variance is profiled out of the likelihood.</li>
<li><b>Columns in X</b> = levels + intercept (last level set to zero).</li>
<li><b>−2 Res Log Likelihood</b>: what you need for a likelihood-ratio test. <b>AIC, AICC, BIC</b>: smaller is better.</li>
<li>Intercept = LS mean of the reference level; other estimates are differences from it. Type 3 test: F test that all treatment means are equal.</li>
</ul>
<div class="warn"><span class="lbl">Common mistake</span>REML likelihoods are comparable only between models with the <b>same fixed effects</b>. Compare different fixed-effect specifications with ML.</div>

<h3>A variance on the boundary (Assignment 2, Q3)</h3>
<p>With only four crop years, a variance component can be estimated at exactly 0: the estimate is on the <b>boundary</b> of the parameter space. "How much can be learned about a variance from four observations?" Very little. Report it honestly to a referee: the crop-year variance is poorly identified.</p>
</section>

<section data-s="examples">
<details class="sol"><summary>Write the Assignment 2 model with variety random too (three variance components).</summary><div class="body"><p>\(y_{vst}=\mu+a_v+s_{s}+\varepsilon_{vst}\), \(a_v\sim N(0,\sigma_a^2)\) random variety effect, \(s_s\sim N(0,\sigma_s^2)\) random site-year effect, \(\varepsilon\sim N(0,\sigma_e^2)\), all independent. (If crop year is also random, add \(c_t\sim N(0,\sigma_c^2)\).)</p></div></details>
<details class="sol"><summary>Which should you use to estimate expected profit of the top variety: unadjusted means or BLUPs? Why?</summary><div class="body"><p>BLUPs. The top raw mean is biased upward (winner's curse) especially when based on few site-years; shrinkage corrects it, giving a better expected-yield input to the profit calculation.</p></div></details>
<details class="sol"><summary>Give three reasons year is random. Which one does the professor most want?</summary><div class="body"><p>Not controlled by the researcher (the main one); inference about all years; higher power / lower standard errors.</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="0"><div class="stem">The main reason the professor wants for treating year as random:</div><ol><li>It is not controlled by the researcher</li><li>It makes the model nonlinear</li><li>SAS requires it</li><li>It always lowers AIC</li></ol><div class="why">Weather is not controlled. Inference to all years and efficiency are secondary reasons.</div></div>
<div class="q" data-a="2"><div class="stem">Why use random variety effects in Assignment 2?</div><ol><li>Varieties are not controlled by the researcher</li><li>Fixed effects cannot be estimated</li><li>Unequal numbers of site-years make shrinkage (BLUP) better for picking the top varieties</li><li>To avoid the CLASS statement</li></ol><div class="why">It depends on the goal; ranking with unbalanced data favors BLUPs.</div></div>
<div class="q" data-a="1"><div class="stem">Off-diagonal elements of \(\boldsymbol\Phi_i=\sigma_\mu^2\mathbf j\mathbf j'+\sigma_e^2\mathbf I\) equal:</div><ol><li>0</li><li>\(\sigma_\mu^2\)</li><li>\(\sigma_e^2\)</li><li>\(\sigma_\mu^2+\sigma_e^2\)</li></ol><div class="why">Two observations of the same individual share \(\mu_i\), so their covariance is \(\sigma_\mu^2\).</div></div>
<div class="q" data-a="3"><div class="stem">In PROC MIXED output, which line do you use for a likelihood-ratio test?</div><ol><li>Columns in X</li><li>Type 3 F test</li><li>AICC</li><li>−2 Res Log Likelihood</li></ol><div class="why">LR = difference in −2 log likelihoods (same fixed effects under REML).</div></div>
<div class="q" data-a="1"><div class="stem">A variety observed in only 3 site-years has a raw mean far above average. Its BLUP will be:</div><ol><li>Exactly its raw mean</li><li>Pulled strongly toward the grand mean</li><li>Pushed further from the mean</li><li>Undefined</li></ol><div class="why">Shrinkage weight \(\sigma_u^2/(\sigma_u^2+\sigma_e^2/n_i)\) is small when \(n_i\) is small.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Fixed vs random: what changes?</div><div class="b">The assumptions (a distribution for the effects), not the equation.</div></div>
<div class="fc"><div class="f">Three reasons year is random</div><div class="b">Not controlled by researcher; inference to all years; more power / lower SEs.</div></div>
<div class="fc"><div class="f">REML</div><div class="b">Restricted ML: corrects small-sample downward bias of variance estimates; compare only models with the same fixed effects.</div></div>
<div class="fc"><div class="f">BLUP shrinkage weight</div><div class="b">\(\sigma_u^2/(\sigma_u^2+\sigma_e^2/n_i)\)</div></div>
<div class="fc"><div class="f">Random vs fixed for variety?</div><div class="b">"Depends on goal": paired comparisons → fixed; ranking with unbalanced data → random (BLUP).</div></div>
</section>

<template data-lesson="c1l3" data-ch="1" data-title="Notation rules and finding equation errors" data-src="Sep 4 · Sep 14 · Sep 18 lectures · practice handouts" data-yt="how to write equations in a research paper notation">
<section data-s="learn">
<h3>The rules the professor grades on</h3>
<ol class="pts">
<li><b>One symbol, one definition.</b> "That is a really big mistake. It's also a very common mistake." Using \(k\) as both a location index and a summation index, or \(i\) as both observation and summation index, collapses the sum. "Considered a major blunder."</li>
<li>Define every symbol, including every subscript and its range.</li>
<li>Symbols in the definitions must match the equation exactly (\(SR_{it}\) vs \(SR_{itk}\); \(\varepsilon\) vs \(v\)).</li>
<li>State the distribution of every random term, and state that random terms are independent. Prefer "\(\sim N(0,\sigma^2)\)" (it takes less space).</li>
<li>Variables and subscripts in italics; vectors and matrices in bold; numbers never italic; function names (cos, sin, ln, min) roman.</li>
<li>The equation is part of a sentence: no colon before it, normal punctuation, a period at the end. A comma after an equation is fine.</li>
<li>Equation numbers on the right.</li>
<li>Write definitions as sentences in text format, not bullet lists ("I want a text format").</li>
<li>Multi-letter names like \(NR\) can be read as \(N\times R\); single symbols are safer (\(\pi\) for net return). Word names (ADG, System) are acceptable in applied journals.</li>
</ol>
<div class="prof"><span class="lbl">In class</span>"It's a lot easier to find errors than it is to write something correctly." One notation-error question appears on every old exam.</div>

<h3>Exam pattern: "Find five errors"</h3>
<p>Sentence from the practice sheet (cattle weight gain): "...where \(ADG_{ijkb}\) is the average daily gain for the \(i\)th animal under the \(j\)th treatment and \(k\)th hormone in the \(B\)th pasture block, \(\alpha_1,\alpha_2\) and \(\beta_j\) are parameters, \(T_{ijb}\) is a dummy..., \(B\) is the block random effect, \(B=1\) to 5, and \(\varepsilon_{ijkB}\) is a random error with \(\nu_{ijkb}\sim N(0,\sigma_\varepsilon^2)\)."</p>
<p>Errors found in class: colon before the equation; italic numbers; \(j\) used for two items; \(\alpha_2\) defined but absent from the equation; subscripts do not match (\(ijkb\) vs \(ijb\)); \(\varepsilon\) vs \(\nu\); block random effect has no distribution; Color needs a consistent subscript; \(B\) used both as the effect and as the index.</p>
</section>

<section data-s="examples">
<details class="sol"><summary>Solar radiation model: \(SR_{itk}=\beta_{0k}+\sum_{k=1}^{4}\beta_{1ik}\cos(2\pi kt/365)+\beta_{2ik}\sin(2\pi kt/365)+\gamma_{tk}+\varepsilon_{itk}\). Find at least five errors.</summary><div class="body"><ul class="pts">
<li>\(k\) has two definitions (location and summation index): the biggest error.</li>
<li>The definitions use \(SR_{itj}\), the equation \(SR_{itk}\).</li>
<li>\(t\) is not explained; \(\gamma_{tk}\) is not explained or given a distribution.</li>
<li>The ellipsis "1,2, ...,24" is written with two dots in places; "where is normally distributed" is ungrammatical; two "and"s.</li>
<li>\(\beta_0\) should carry \(i\) (hour) like the other betas.</li>
<li>cos and sin should be roman, not italic.</li>
<li>Random effects' correlation unspecified; equation number should be on the right; "as follows," should not end in a comma before a display.</li>
<li>Deeper: one cycle should be within the day and one seasonal, but 365 alone gives only a seasonal cycle.</li></ul></div></details>
<details class="sol"><summary>Grazing model on an old exam used "System\(_t\)". What did the professor say?</summary><div class="body"><p>"System\(_t\)" is not the grazing system itself; it is the fixed (or random) <i>effect</i> of grazing system \(t\). Word names are fine, but say what they are. Also: period at the end, matching subscripts on both sides, no double specification, say the random terms are mutually independent.</p></div></details>
</section>

<section data-s="watch">
<p class="muted">No single video matches the course's notation rules; the rules above come straight from class. Use the search link for general guidance on typesetting equations.</p>
</section>

<section data-s="quiz">
<div class="q" data-a="2"><div class="stem">Which is the "major blunder" in writing a DGP?</div><ol><li>Using Greek letters</li><li>Putting the equation number on the right</li><li>Giving one symbol two definitions</li><li>Writing \(\sim N(0,\sigma^2)\)</li></ol><div class="why">Reusing an index (e.g., \(i\) for both observation and summation) changes the meaning of the equation.</div></div>
<div class="q" data-a="0"><div class="stem">How should "cos" appear in a typeset equation?</div><ol><li>Roman (upright), because it is a function name</li><li>Italic, like variables</li><li>Bold, like a vector</li><li>In quotation marks</li></ol><div class="why">Function names are roman; variables are italic.</div></div>
<div class="q" data-a="3"><div class="stem">What punctuation goes right before a displayed equation that continues the sentence "The model is"?</div><ol><li>A colon</li><li>A semicolon</li><li>"as follows:"</li><li>None; punctuate as normal text</li></ol><div class="why">"No colon before an equation." The equation is part of the sentence.</div></div>
<div class="q" data-a="1"><div class="stem">Where do equation numbers go in our journals?</div><ol><li>Left</li><li>Right</li><li>Above the equation</li><li>In the footnote</li></ol><div class="why">Word puts them on the left by default; most agricultural economics journals want them on the right.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Italic vs roman in math</div><div class="b">Variables and subscripts italic; numbers and function names (cos, ln, min) roman; vectors/matrices bold.</div></div>
<div class="fc"><div class="f">Colon before an equation?</div><div class="b">No. Punctuate it as part of the sentence and end with a period.</div></div>
<div class="fc"><div class="f">Every random term needs …</div><div class="b">A distribution, and a statement that the random terms are independent.</div></div>
<div class="fc"><div class="f">Definitions format</div><div class="b">Sentences in text format, not a bullet list.</div></div>
</section>
</template>

<template data-lesson="c2l1" data-ch="2" data-title="The optimization template and discrete choices" data-src="Sep 4, Sep 9, Sep 11 worksheet, Sep 21 notebook · Assignment 1" data-yt="constrained optimization economics choice variable objective function">
<section data-s="learn">
<h3>The template</h3>
<div class="formula"><span class="lbl">Every optimization answer (Sep 21 notebook)</span>
\[\max_{\text{choice variable}}\ \text{objective}(\text{choice variable})\quad\text{s.t.}\quad\text{choice space and constraints}\]</div>
<p>Circle the four pieces on every exam answer:</p>
<ol class="pts">
<li><b>Choice variable</b> (what the decision maker picks).</li>
<li><b>Choice space</b>: real numbers \(\mathbb R_+\), integers \(\mathbb Z^+\), \(\{0,1\}\), a list of varieties … "A lot of people struggle by leaving this part off."</li>
<li><b>Objective function</b> written as a function of the choice variable (somewhere, possibly through constraints).</li>
<li><b>Constraints</b> (land, capacity, budget, sum of shares = 1).</li>
</ol>
<div class="prof"><span class="lbl">In class (Sep 21)</span>"I find over time that I'm very successful at teaching how to do a data generating process. And not so much on the optimization problem." Faculty "down the hall" can all do it, "which tells me it's probably pretty important." He prefers the choice space after "subject to"; writing "\(\in\) space" under max is acceptable.</div>
<div class="tip"><b>argmax vs max.</b> \(T^*=\arg\max_T\pi(T)\) is the <i>choice</i> that maximizes; \(\max_T\pi(T)\) is the resulting <i>value</i>.</div>

<h3>Two ways to impose a constraint</h3>
<p>"Mathematically, there's two ways. One of them is <b>substitution</b> [put the constraint into the objective] ... and the other is the <b>Lagrangian</b> approach [keep it as a restriction]. Either way is okay."</p>

<h3>Discrete choices</h3>
<div class="formula"><span class="lbl">Pick one variety (TA worksheet, Problem 1: cotton)</span>
\[\max_{x_1,\dots,x_n}\ \sum_{i=1}^{n}x_i\,E\!\left(P_cY_{ci}+P_sY_{si}-C_i\right)\quad\text{s.t.}\quad\sum_{i=1}^{n}x_i=1,\ x_i\in\{0,1\}.\]
\(P_c,Y_{ci}\): lint price and yield; \(P_s,Y_{si}\): cottonseed price and yield; \(C_i\): cost including seed for variety \(i\).</div>
<p>Simplest form (pigeon problem, Sep 9): choose location \(i\in\{1,2,3\}\) to maximize food\(_i\); a variant maximizes food\(_i-d_i\) (travel distance). No "food ≥ 0" constraint is needed because food at each location is given.</p>
<div class="clarify"><span class="lbl">Clarifying: Assignment 1 with feral rye</span>One way to write it: \(\max_{i\in\{1,\dots,10\}}E(\pi_i)=p\,E(y_i)\,(1-L\,s\,\mathbb 1[\text{no herbicide}_i])-c_i-h_i\), where \(L=0.25\) is the rye yield loss, \(s\) the infestation share, \(c_i\) seed cost ($24 conventional, $33 Clearfield, $37 CoAXium) and \(h_i\) herbicide cost ($16 or $22). The break-even infestation is where two traits give equal expected profit. This is an illustration, not the answer key.</div>
<div class="prof"><span class="lbl">In class</span>"There's more than one way of answering these." "If you're ever gonna get an answer down, you're gonna have to write more." Pick a choice variable and go.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Tea at a restaurant: green or black. Write the problem.</summary><div class="body"><p>\(\max_{x_G,x_B}\ x_GU_G+x_BU_B\) s.t. \(x_G+x_B=1\), \(x_G,x_B\in\{0,1\}\). No market price needed; maximize utility.</p></div></details>
<details class="sol"><summary>Broiler house: growth falls and death rises with density. Write the expected-profit problem.</summary><div class="body"><p>Choose \(x\in\{0,1,\dots,\bar x\}\) (birds placed, up to capacity \(\bar x\)) to maximize \(E(\pi)=p\,x\,s(x)\,w(x)-c(x)\), where \(s(x)\) is survival and \(w(x)\) market weight, both decreasing in density, and \(c(x)\) cost.</p></div></details>
<details class="sol"><summary>Meat goats vs cattle: budgets show higher per-acre goat returns. Write the acreage problem for a risk-neutral producer.</summary><div class="body"><p>\(\max_{A_g,A_c}\ E(R_g)A_g+E(R_c)A_c\) s.t. \(A_g+A_c\le\bar A\), labor, fencing, capital constraints, \(A_g,A_c\ge0\). The point of the question: per-acre budget returns ignore constraints (and risk), so the higher per-acre number alone does not justify an extension program.</p></div></details>
<details class="sol"><summary>Apple thinning (Sep 2–4): set up the problem.</summary><div class="body"><p>Let \(A\in\mathbb Z^+\) be apples left per tree. Size \(=f(A,\text{tree size})\), price \(=p(\text{size})\), total weight \(=A\times\text{size}\). \(\max_A\ E\big[p(\text{size}(A))\cdot A\cdot\text{size}(A)\big]-c(A)\). Thinning moves price and quantity in opposite directions; at an early stage total weight changes little and size changes a lot. Students' AI answers missed the expectation, the cost and the choice space.</p></div></details>
</section>

<a class="vid" data-tag="Lagrangian intuition" data-by="MATLAB" href="https://www.youtube.com/watch?v=GR4ff0dTLTw">Constrained Optimization: Intuition behind the Lagrangian</a>
<a class="vid" data-tag="Worked example" data-by="Dr. Trefor Bazett" href="https://www.youtube.com/watch?v=8mjcnxGMwFo">Lagrange Multipliers: Geometric Meaning and Full Example</a>

<div class="q" data-a="1"><div class="stem">Which part of an optimization answer do students most often leave off?</div><ol><li>The max operator</li><li>The choice space</li><li>The word "profit"</li><li>The equation number</li></ol><div class="why">"A lot of people struggle by leaving this part off."</div></div>
<div class="q" data-a="3"><div class="stem">What does \(\arg\max_T\pi(T)\) return?</div><ol><li>The maximum profit</li><li>The gradient</li><li>The Lagrange multiplier</li><li>The value of \(T\) that maximizes profit</li></ol><div class="why">argmax gives the argument; max gives the value.</div></div>
<div class="q" data-a="0"><div class="stem">"Pick exactly one variety" is written as:</div><ol><li>\(\sum_i x_i=1,\ x_i\in\{0,1\}\)</li><li>\(x_i\ge0\)</li><li>\(\sum_i x_i\le 1,\ x_i\in\mathbb R\)</li><li>\(x_i=1\) for all \(i\)</li></ol><div class="why">Binary indicators that sum to one.</div></div>

</section>

<template data-lesson="c2l2" data-ch="2" data-title="Expectations: price × yield, stationarity and covariance" data-src="Handout on moments of products · Sep 18, Sep 21, Sep 25 lectures · Exam 1 study guide" data-yt="expected value of product of random variables covariance">
<section data-s="learn">
<h3>When do you need \(E(\cdot)\)?</h3>
<p>Use an expectation for anything unknown at decision time: output price and yield. Input prices (fertilizer) are usually known when the input is applied, so cost needs no expectation unless prices are contracted later. Writing yield without an expectation "is probably sloppiness." "You should use it when it makes sense."</p>

<h3>Expected revenue is not always \(E(P)E(Y)\)</h3>
<div class="formula"><span class="lbl">Moments of products (Bohrnstedt and Goldberger 1969 handout)</span>
\[E(PY)=E(P)E(Y)+\operatorname{cov}(P,Y).\]
Zero covariance is enough to write \(E(PY)=E(P)E(Y)\); independence is stronger.</div>
<div class="formula"><span class="lbl">Variance of a product, independent case</span>
\[\operatorname{var}(PY)=E^2(P)\operatorname{var}(Y)+E^2(Y)\operatorname{var}(P)+\operatorname{var}(P)\operatorname{var}(Y).\]
Bivariate normal: add \(2E(P)E(Y)\operatorname{cov}+\operatorname{cov}^2\).</div>
<div class="exam"><span class="lbl">Exam 1 study guide</span>"State the assumptions needed to express expected revenue as E(price)E(quantity)." Answer: price and quantity are uncorrelated (cov = 0), which holds, for example, for a price-taking farm whose local yield does not move the market price. "Covariance of price and yield ... you really ought to know this one."</div>
<div class="clarify"><span class="lbl">Clarifying: why price and yield can be unconnected</span>A single farm is a price taker: its own yield shock is too small to move the national price, so local yield and price can be treated as uncorrelated. At the national or regional level a big crop lowers price (negative covariance, a natural hedge).</div>

<h3>Stationary yields, Markov prices</h3>
<div class="prof"><span class="lbl">Exam 1 feedback (Sep 25)</span>"I want you to think about expectations, and that your expectation process for yield is different than your expectation process for prices." He was unhappy that students applied 1990 prices to 1990 yields. "Expect to see that question again on the final exam."</div>
<ul class="pts">
<li><b>Yield</b> is (approximately) <b>stationary</b>: a constant mean over time after any trend adjustment, so the whole history informs \(E(Y)\).</li>
<li><b>Prices</b> follow a Markov-type process: "all that really matters is ... right now." Use current futures plus expected basis (e.g., Kansas City July futures with a −$0.50 basis in Assignment 2).</li>
<li>Season-average price is an average across time; remove storage costs to get an expected harvest price. Naive expectations (last year's price) are "considered kind of valid ... not exactly wrong," but closer to rational expectations is preferred.</li>
<li>Exception: building a rule for many years may use average prices, but every price series must cover the same period (feeder cattle prices depend on corn prices).</li>
</ul>

<h3>Mean–variance objective (handout)</h3>
<div class="formula"><span class="lbl">Profit variance and the input FOC</span>
\[\max_X\ E(PQ)-\sum_j\gamma_jX_j-\lambda\operatorname{var}(PQ),\qquad \frac{\partial\operatorname{var}(PQ)}{\partial X_j}=2\operatorname{cov}(PQ,\,PF_j).\]
"The covariance between total revenue and value of the marginal product determines what happens marginally to the variance of profit."</div>
<div class="formula"><span class="lbl">Portfolio variance</span>\(\operatorname{var}(aR_1+bR_2)=a^2\sigma_1^2+b^2\sigma_2^2+2ab\operatorname{cov}(R_1,R_2)\). Ignoring covariance can erase or invent diversification.</div>
<div data-tool="revenue"></div>
</section>

<section data-s="examples">
<details class="sol"><summary>E(P) = $6, E(Y) = 45 bu, SD(P) = 1, SD(Y) = 10, ρ = −0.3. Find E(PY).</summary><div class="body"><p>cov = −0.3(1)(10) = −3. \(E(PY)=6\times45-3=\)<span class="ans">$267</span>, not $270.</p></div></details>
<details class="sol"><summary>Why is it wrong to pair 1990 prices with 1990 yields to form an expected profit for 2027?</summary><div class="body"><p>Yields are stationary, so all years inform expected yield; but price expectations should come from current information (futures + basis). Mixing old prices with old yields builds in historic price levels and the historic yield–price covariance that are irrelevant now.</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Intuition" data-by="In Case of Econ Struggles" href="https://www.youtube.com/watch?v=fJzrPkZzytw">Learn the Intuition Behind Jensen's Inequality in 3 Minutes</a>
</section>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">\(E(PY)=E(P)E(Y)\) requires:</div><ol><li>Both normal</li><li>\(\operatorname{cov}(P,Y)=0\)</li><li>Equal variances</li><li>Stationary prices</li></ol><div class="why">\(E(PY)=E(P)E(Y)+\operatorname{cov}(P,Y)\).</div></div>
<div class="q" data-a="0"><div class="stem">Which is typically treated as stationary?</div><ol><li>Detrended yields</li><li>Cash prices</li><li>Futures prices</li><li>Land values</li></ol><div class="why">Yields have a stable mean (after trend); prices are closer to a Markov process.</div></div>
<div class="q" data-a="2"><div class="stem">Best expected harvest price for next year's decision:</div><ol><li>The average price from 1990–2025</li><li>Last year's season-average price, no adjustment</li><li>Current futures for harvest delivery plus expected basis</li><li>The price in the year with the highest yield</li></ol><div class="why">Price expectations should use current market information.</div></div>
<div class="q" data-a="3"><div class="stem">Is fertilizer price usually written with an expectation in the objective?</div><ol><li>Always</li><li>Only when yields are normal</li><li>Only with random effects</li><li>No, it is usually known when N is applied</li></ol><div class="why">Use expectations only for what is unknown at decision time.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">E(PY)</div><div class="b">\(E(P)E(Y)+\operatorname{cov}(P,Y)\)</div></div>
<div class="fc"><div class="f">var(PY) with independence</div><div class="b">\(E^2(P)\operatorname{var}(Y)+E^2(Y)\operatorname{var}(P)+\operatorname{var}(P)\operatorname{var}(Y)\)</div></div>
<div class="fc"><div class="f">Yield vs price expectation process</div><div class="b">Yield: stationary, use the whole history. Price: Markov, use current information (futures + basis).</div></div>
<div class="fc"><div class="f">Marginal effect of input on profit variance</div><div class="b">\(\partial\operatorname{var}(PQ)/\partial X_j=2\operatorname{cov}(PQ,PF_j)\)</div></div>
</section>
</template>

<template data-lesson="c2l3" data-ch="2" data-title="Continuous choices: calculus optimum for a quadratic" data-src="Sep 4 lecture (nitrogen × 44 years) · Exam 1 study guide item 8" data-yt="quadratic production function optimal fertilizer rate economics">
<section data-s="learn">
<h3>From discrete to continuous</h3>
<p>"We've been doing discrete choices, and next we're gonna move to continuous choices." A nitrogen experiment can be analyzed as a discrete choice (choose among the tested rates using ANOVA means and budgets) or as a continuous one (estimate a response function and use calculus).</p>
<div class="formula"><span class="lbl">Quadratic response, known prices</span>
\[\max_{N\ge0}\ pE(y)-rN,\qquad E(y)=\beta_0+\beta_1N+\beta_2N^2,\ \beta_2&lt;0.\]
FOC: \(p(\beta_1+2\beta_2N)=r\) ⇒ \[N^*=\frac{r/p-\beta_1}{2\beta_2}.\]
SOC: \(2p\beta_2&lt;0\) holds when \(\beta_2&lt;0\). Clip to 0 if negative.</div>
<p>The economic principle is <b>expected marginal revenue = marginal cost</b> (VMP = input price). The profit-maximizing rate is always below the yield-maximizing rate \(-\beta_1/(2\beta_2)\) when \(r&gt;0\).</p>
<div data-tool="quadopt"></div>
<div class="clarify"><span class="lbl">Clarifying: discrete choice with ANOVA means</span>With ANOVA means for each tested rate, compute expected profit \(p\bar y_n-rN_n-\text{other costs}\) for each rate and pick the highest. That is "item 8" on the Exam 1 study guide: "with an ANOVA and budgets, choose the alternative with the higher expected profit."</div>
<div class="warn"><span class="lbl">Check boundaries</span>Always compare the interior solution with the feasible bounds (0, the maximum rate) and with every discrete alternative.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>β₀ = 20, β₁ = 0.6, β₂ = −0.003, p = $6/bu, r = $0.70/lb. Find N* and the yield-maximizing N.</summary><div class="body"><p>\(r/p=0.1167\). \(N^*=(0.1167-0.6)/(2\times-0.003)=\)<span class="ans">80.6 lb N/acre</span>. Yield max: \(-0.6/(-0.006)=100\) lb.</p></div></details>
<details class="sol"><summary>Wheat at $6.90/bu, ANOVA means 40 bu at 0 N and 52 bu at 60 lb N, N at $0.60/lb. Which rate?</summary><div class="body"><p>0 N: \(6.90\times40=276\). 60 N: \(6.90\times52-0.60\times60=358.8-36=322.8\). <span class="ans">Apply 60 lb N</span> (higher expected profit by $46.80/acre).</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Optimization" data-by="Dr. Trefor Bazett" href="https://www.youtube.com/watch?v=8mjcnxGMwFo">Lagrange Multipliers: Geometric Meaning and Full Example</a>
</section>

<section data-s="quiz">
<div class="q" data-a="2"><div class="stem">For \(y=\beta_0+\beta_1N+\beta_2N^2\), the profit-maximizing N is:</div><ol><li>\(-\beta_1/(2\beta_2)\)</li><li>\(r/(p\beta_1)\)</li><li>\((r/p-\beta_1)/(2\beta_2)\)</li><li>\(\beta_1/\beta_2\)</li></ol><div class="why">Set \(p(\beta_1+2\beta_2N)=r\).</div></div>
<div class="q" data-a="0"><div class="stem">When N price rises, the optimal N from a quadratic:</div><ol><li>Falls</li><li>Rises</li><li>Does not change</li><li>Goes to the yield maximum</li></ol><div class="why">\(r/p\) rises; with \(\beta_2&lt;0\) the numerator grows less negative, so \(N^*\) falls.</div></div>
<div class="q" data-a="1"><div class="stem">The second-order condition for a maximum requires:</div><ol><li>\(\beta_1&gt;0\)</li><li>\(\beta_2&lt;0\)</li><li>\(p&gt;r\)</li><li>\(\beta_0&gt;0\)</li></ol><div class="why">The objective must be concave in N.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Quadratic N*</div><div class="b">\(N^*=(r/p-\beta_1)/(2\beta_2)\)</div></div>
<div class="fc"><div class="f">Economic rule for an interior optimum</div><div class="b">Expected marginal revenue = marginal cost (VMP = input price)</div></div>
<div class="fc"><div class="f">Discrete version of the N decision</div><div class="b">Compute expected profit at each tested rate from ANOVA means; pick the highest.</div></div>
</section>

<template data-lesson="c3l1" data-ch="3" data-title="The linear plateau and PROC NLMIXED" data-src="Sep 9 lecture · Sep 18 old-exam review · Sep 21 · Assignment 4" data-yt="linear plateau model nitrogen response piecewise regression">
<section data-s="learn">
<h3>The model</h3>
<div class="formula"><span class="lbl">Linear response plateau (two equivalent parameterizations)</span>
\[y=\min(\beta_0+\beta_1N,\ P)\qquad\text{or}\qquad y=\beta_0+\beta_1\min(N,\bar T),\]
continuity restriction \(\beta_0+\beta_1\bar T=P\). Four symbols, three free parameters.</div>
<p>"It makes absolutely no difference mathematically. You get the same answers. Statistics are the same." The professor estimates the plateau \(P\); Claude's code often estimates the threshold \(\bar T\).</p>

<h3>Why agronomists like it</h3>
<ul class="pts">
<li>Liebig's law of the minimum: in dryland agriculture water is usually most limiting. The crop uses N only as far as water allows, so yield rises linearly with N and then goes flat.</li>
<li>Earl Heady used quadratics; agronomists moved to plateaus.</li>
<li>It is a "broken stick" spline with a continuity restriction but no differentiability restriction, so it is not twice differentiable and you cannot set a derivative to zero.</li>
</ul>
<div class="formula"><span class="lbl">Optimum of a deterministic linear plateau</span>
On the rising part VMP \(=p\beta_1\) and MC \(=r\) are both constant. If \(p\beta_1&gt;r\), apply up to the knot \(N=(P-\beta_0)/\beta_1\); if \(p\beta_1&lt;r\), apply 0. "There's no fancy optimization."</div>
<p>That is why agronomists' rules ignore prices (Oklahoma wheat: 2 lb N per bushel of yield goal; cotton: 50 lb per bale). "If this is the right production function, that is the right answer." But the plateau moves with rainfall from year to year, and pooling many site-years into one deterministic plateau is misspecified, which is why a quadratic can fit pooled data better.</p>

<div class="warn"><span class="lbl">The min is not an optimization</span>"This is not an optimization problem. This is just a mathematical function." min(·) describes yield; you maximize expected profit.</div>

<h3>Quadratic plateau</h3>
<p>Quadratic up to a join point, flat after. Impose continuity and differentiability at the join: five parameters minus two restrictions = three free parameters. The optimum is always on the curved part, found from the FOC.</p>

<h3>PROC NLMIXED and convergence</h3>
<ul class="pts">
<li>PROC MIXED: linear models. PROC NLMIXED: nonlinear models, one RANDOM statement only (no REPEATED, no nested random effects), non-normal likelihoods allowed. A quadratic is linear in parameters, so PROC MIXED can fit it.</li>
<li><b>PARMS</b> supplies starting values. Two classic failure causes: <b>poor starting values</b> and <b>poor scaling</b> (a dependent variable near 10 with a regressor near 100,000; the quasi-Newton method inverts the Hessian, and mixing very large and small numbers causes numerical trouble).</li>
<li>Convergence means the <b>gradients</b> (first-order conditions) are near zero, about \(10^{-3}\). "You shouldn't necessarily trust Claude in terms of convergence." Poor scaling can make the routine stop early and report a false optimum.</li>
<li>Kinked likelihoods can have local optima: rerun with different starting values and keep the run with the larger log likelihood. Smoothing the corner also helps (Claude "rounded off" the corner in Assignment 5).</li>
<li>Scaling inside SAS (e.g., <code>s2u_actual = s2u*100</code>) must be reversed when reporting.</li>
</ul>
<div class="clarify"><span class="lbl">Clarifying: yield skewness</span>Alabama (it almost always rains, an occasional bad year) → negatively skewed yields. Western Oklahoma (rarely rains, an occasional good year) → positively skewed. Production functions may need non-normal errors.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Old exam: intercept 25, plateau 40, slope 0.5. What N maximizes profit?</summary><div class="body"><p>Knot \(=(40-25)/0.5=\)<span class="ans">30 lb N</span> if \(p\times0.5&gt;r\); otherwise 0. Nothing in between can be optimal.</p></div></details>
<details class="sol"><summary>Why might a quadratic fit pooled multi-state data better than a linear plateau?</summary><div class="body"><p>The true plateau differs by site-year (rainfall). One fixed plateau fitted to pooled data is misspecified; averaging many kinked lines with different plateaus produces a smooth, curved average response that a quadratic approximates.</p></div></details>
<details class="sol"><summary>Assignment 4 data traps: what did you have to decide before estimating?</summary><div class="body"><ul class="pts"><li>16 treatments are not 16 rates: some reach the same total N with different timing.</li><li>Previous crop is in another file; keep corn after soybean.</li><li>Missing yields read in as text.</li><li>Documented problem site-years (hail, ponding, an extra 45 kg N applied by mistake).</li></ul></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Piecewise models" data-by="Let's Learn, Nemo!" href="https://www.youtube.com/watch?v=Yh_ggohqxuA">Piecewise Linear and Spline Regression</a>
<a class="vid" data-tag="Likelihood" data-by="StatQuest with Josh Starmer" href="https://www.youtube.com/watch?v=XepXtl9YKwc">Maximum Likelihood, clearly explained</a>

<section data-s="quiz">
<div class="q" data-a="3"><div class="stem">For a deterministic linear plateau with \(p\beta_1&gt;r\), optimal N is:</div><ol><li>Where the derivative equals zero</li><li>Zero</li><li>Halfway to the knot</li><li>The knot \((P-\beta_0)/\beta_1\)</li></ol><div class="why">VMP exceeds MC all the way to the knot, then the marginal product is zero.</div></div>
<div class="q" data-a="1"><div class="stem">How many free parameters in \(y=\min(\beta_0+\beta_1N,P)\)?</div><ol><li>2</li><li>3</li><li>4</li><li>5</li></ol><div class="why">Intercept, slope, plateau; the knot follows from continuity.</div></div>
<div class="q" data-a="0"><div class="stem">PROC NLMIXED reports convergence. What should you check?</div><ol><li>The gradient column is near zero (about 10⁻³)</li><li>The R² is above 0.9</li><li>AIC is negative</li><li>The number of iterations is small</li></ol><div class="why">Convergence = first-order conditions near zero; poor scaling can fake convergence.</div></div>
<div class="q" data-a="2"><div class="stem">Two runs with different starting values give different estimates. Which do you keep?</div><ol><li>The first run</li><li>The one with fewer iterations</li><li>The one with the larger log likelihood</li><li>Average them</li></ol><div class="why">Local optima: choose the higher likelihood.</div></div>
<div class="q" data-a="1"><div class="stem">Why do agronomists' N recommendations ignore prices?</div><ol><li>They assume risk neutrality</li><li>With a linear plateau the optimum is the knot whenever \(p\beta_1&gt;r\)</li><li>Prices are stationary</li><li>Fertilizer is free</li></ol><div class="why">The knot does not depend on prices as long as the input pays on the rising segment.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Linear plateau, two forms</div><div class="b">\(\min(\beta_0+\beta_1N,P)\) or \(\beta_0+\beta_1\min(N,\bar T)\), with \(\beta_0+\beta_1\bar T=P\)</div></div>
<div class="fc"><div class="f">Deterministic plateau optimum</div><div class="b">Knot if \(p\beta_1&gt;r\), zero if \(p\beta_1&lt;r\)</div></div>
<div class="fc"><div class="f">Two causes of nonconvergence</div><div class="b">Poor starting values and poor scaling</div></div>
<div class="fc"><div class="f">Convergence criterion</div><div class="b">Gradients near zero (≈ 10⁻³)</div></div>
<div class="fc"><div class="f">Quadratic plateau free parameters</div><div class="b">Five minus two (continuity, differentiability) = three</div></div>
</section>
