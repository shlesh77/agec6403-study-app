<template data-lesson="c10l1" data-ch="10" data-title="Preview: spatial models, frontier functions and duality" data-src="Syllabus parts III–IV · standard textbook material, not yet from lectures" data-yt="stochastic frontier analysis spatial econometrics Hotelling lemma">
<section data-s="learn">
<div class="exam"><span class="lbl">Read this first</span>The class record available when this app was built ends on October 30. These syllabus topics had not appeared in lecture yet, so this lesson gives standard background only. Replace or extend it with your own notes once they are taught (see "How to add content" under More).</div>
<h3>Spatial models (Part III)</h3>
<p>Field and yield-monitor data are spatially correlated: nearby plots share soil and water. Ignoring it gives standard errors that are too small and can bias estimates of the N response.</p>
<div class="formula"><span class="lbl">Two common forms</span>Spatial lag: \(\mathbf y=\rho\mathbf W\mathbf y+\mathbf X\boldsymbol\beta+\boldsymbol\varepsilon\). Spatial error: \(\mathbf y=\mathbf X\boldsymbol\beta+\mathbf u,\ \mathbf u=\lambda\mathbf W\mathbf u+\boldsymbol\varepsilon\). \(\mathbf W\) is a neighbor (weights) matrix. Moran's I tests for spatial autocorrelation.</div>
<p>Links to class: the posterior predictive distribution can fill deleted yield-monitor points; R-hat guidelines are hard to meet with many spatial parameters (Sep 30).</p>
<h3>Frontier functions (Part IV)</h3>
<div class="formula"><span class="lbl">Stochastic production frontier</span>\(\ln y_i=f(\mathbf x_i;\boldsymbol\beta)+v_i-u_i\), \(v_i\sim N(0,\sigma_v^2)\) noise, \(u_i\ge0\) inefficiency (half-normal or exponential). Technical efficiency \(TE_i=e^{-u_i}\).</div>
<p>The composed error separates bad luck (\(v\)) from inefficiency (\(u\)). A test of \(\sigma_u^2=0\) is a boundary test, like Chapter 4.</p>
<h3>Duality (Part IV)</h3>
<div class="formula"><span class="lbl">Profit function and Hotelling's lemma</span>\(\pi(p,\mathbf w)=\max_{\mathbf x}\ p f(\mathbf x)-\mathbf w'\mathbf x\). Then \(\partial\pi/\partial p=y^*(p,\mathbf w)\) (supply) and \(\partial\pi/\partial w_j=-x_j^*(p,\mathbf w)\) (input demand). Cost function: Shephard's lemma \(\partial C/\partial w_j=x_j^*\).</div>
<p>From Oct 2: duality fits observational data (e.g., KFMA farm records); the professor distrusts estimated profit functions (little price variation, correlated prices), while cost functions sometimes work.</p>
<h3>Other special topics</h3>
<ul class="pts"><li><b>Estimation in R</b>: <code>lme4</code>/<code>nlme</code> (mixed models), <code>nls</code> (plateaus), <code>rstan</code> (Bayesian).</li><li><b>Copulas</b> (Chapter 8), <b>credit risk</b>, <b>machine learning</b> (prediction vs parameters, Oct 12).</li><li><b>Prelim-style questions</b>: combine a DGP, an optimization problem and a decision rule for a new situation; practice with the Exam prep checklist.</li></ul>
</section>

<section data-s="watch">
<a class="vid" data-tag="Spatial" data-by="GeoDa Software (Luc Anselin)" href="https://www.youtube.com/watch?v=WnMgdwpNSeo">Spatial Autocorrelation</a>
<a class="vid" data-tag="Frontier" data-by="Sholih Nugroho Hadi" href="https://www.youtube.com/watch?v=qGVeb0PlBVk">Introduction to Stochastic Frontier Analysis (SFA)</a>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">In a stochastic frontier, \(u_i\ge0\) represents:</div><ol><li>Measurement noise</li><li>Technical inefficiency</li><li>The spatial lag</li><li>The price of output</li></ol><div class="why">\(v_i\) is noise; \(u_i\) pushes output below the frontier.</div></div>

</section>

<template data-page="glossary" data-title="Glossary">
<h2 class="display">Glossary</h2>
<p class="muted">Terms as they were used in AGEC 6403.</p>
<dl class="gloss">
<dt>ANOVA</dt><dd>Analysis of variance; the model for designed experiments (regression is the word for observational data).</dd>
<dt>argmax</dt><dd>The value of the choice variable that maximizes the objective; max is the resulting value.</dd>
<dt>Arrow–Pratt absolute risk aversion</dt><dd>\(r(w)=-u''(w)/u'(w)\); positive for a risk-averse person; depends on units.</dd>
<dt>Blocking factor</dt><dd>A grouping of similar experimental units (block/replication), usually modeled as a random effect.</dd>
<dt>BLUP</dt><dd>Best linear unbiased predictor of a random effect; shrinks noisy estimates toward the mean (Bayesian shrinkage).</dd>
<dt>Burn-in (warm-up)</dt><dd>Initial MCMC draws that are discarded.</dd>
<dt>CARA</dt><dd>Constant absolute risk aversion; negative exponential utility \(1-e^{-rw}\).</dd>
<dt>Certainty equivalent (CE)</dt><dd>The sure amount with the same utility as the gamble: \(u(CE)=E\,u(W)\).</dd>
<dt>Choice space</dt><dd>The set the choice variable can take (\(\mathbb R_+\), \(\mathbb Z^+\), {0,1}, a list).</dd>
<dt>Convergence (ML)</dt><dd>Iterations stop at a point where gradients are near zero (≈10⁻³).</dd>
<dt>Convergence (MCMC)</dt><dd>Chains reach and mix over the same posterior distribution; checked with R-hat.</dd>
<dt>Convex-set stochastic dominance</dt><dd>Dominance by a feasible mixture of other alternatives.</dd>
<dt>Copula</dt><dd>A function linking marginal CDFs into a joint distribution: \(H(x,y)=C(F_X(x),F_Y(y))\).</dd>
<dt>Credible interval</dt><dd>Bayesian interval with a stated posterior probability of containing the parameter.</dd>
<dt>CRRA</dt><dd>Constant relative risk aversion; power utility \(w^{1-\rho}/(1-\rho)\).</dd>
<dt>Data generating process (DGP)</dt><dd>A full statement of how the data arise: mean function, indices, random terms, distributions, independence.</dd>
<dt>Delphi approach</dt><dd>Iteratively collecting and revising expert opinions when data are unavailable.</dd>
<dt>Duality</dt><dd>Recovering technology from profit or cost functions of prices (observational data).</dd>
<dt>Efficient set</dt><dd>Alternatives not dominated under a criterion (E-V, FSD, SSD, SDRF, SERF).</dd>
<dt>Empirical Bayes</dt><dd>Priors centered on estimates from the same data (e.g., ML estimates with wide variances).</dd>
<dt>Error components model</dt><dd>Random-effects panel model; the error is \(\mu_i+e_{it}\).</dd>
<dt>E-V (mean–variance) efficiency</dt><dd>Dominance by higher mean and lower variance; needs risk aversion plus normality or quadratic utility.</dd>
<dt>Expected utility</dt><dd>\(\sum_ip_iu(w_i)\) or \(\int u(w)f(w)\,dw\): average utility, not utility of the average.</dd>
<dt>First-degree stochastic dominance (FSD)</dt><dd>\(F(\pi)\le G(\pi)\) for all π; needs only \(u'&gt;0\).</dd>
<dt>Gaussian quadrature</dt><dd>Numerical integration with chosen nodes and weights matching moments through degree 2K − 1.</dd>
<dt>Hausman test</dt><dd>Tests random vs fixed effects (whether effects are uncorrelated with regressors).</dd>
<dt>Heteroskedasticity</dt><dd>Error variance that is a (deterministic) function of known variables Z.</dd>
<dt>Hierarchical model</dt><dd>A model with layers: priors, latent random effects, data given the effects.</dd>
<dt>Iteration</dt><dd>One update step of a numerical optimizer (not an experimental replication).</dd>
<dt>Latent variable</dt><dd>An unobserved variable, such as the yearly threshold \(T_j\) or year random effects.</dd>
<dt>Likelihood function</dt><dd>The joint pdf of the data viewed as a function of the parameters.</dd>
<dt>Likelihood-ratio test</dt><dd>\(-2(\ln L_R-\ln L_U)\sim\chi^2_q\); boundary case uses the 10% value (2.71) for a 5% test.</dd>
<dt>Linear plateau</dt><dd>\(y=\min(\beta_0+\beta_1N,P)\); Liebig-type limiting factor response.</dd>
<dt>MCMC</dt><dd>Markov chain Monte Carlo; generates dependent draws from the posterior.</dd>
<dt>n_eff</dt><dd>Effective sample size of MCMC draws after autocorrelation.</dd>
<dt>Newsvendor problem</dt><dd>Choose quantity before random demand; \(F(q^*)=1-c/p\).</dd>
<dt>Non-nested hypotheses</dt><dd>Neither model is a restriction of the other (quadratic vs linear plateau).</dd>
<dt>Posterior predictive distribution</dt><dd>Distribution of a new observation (e.g., threshold at a new site) averaged over the posterior.</dd>
<dt>Primal approach</dt><dd>Estimate the production function directly, then optimize.</dd>
<dt>Prior (informative, weakly informative, diffuse)</dt><dd>Parameter distribution before the data; strength set by its variance; diffuse = flat/improper.</dd>
<dt>Procedure</dt><dd>The required name of the methods section of the term paper (not "Methodology").</dd>
<dt>R-hat</dt><dd>MCMC convergence diagnostic; values above about 1.01 are a problem.</dd>
<dt>Random effect</dt><dd>An effect drawn from a distribution; used when not controlled by the researcher, for inference to all levels, and for efficiency.</dd>
<dt>REML</dt><dd>Restricted maximum likelihood; corrects small-sample bias in variance estimates.</dd>
<dt>Replication</dt><dd>The same treatment applied to more than one experimental unit.</dd>
<dt>Risk premium</dt><dd>\(E(W)-CE\).</dd>
<dt>Safety-first</dt><dd>Treating risk as a chance of loss, e.g., a bankruptcy-probability constraint.</dd>
<dt>Second-degree stochastic dominance (SSD)</dt><dd>Integrated CDFs ordered everywhere; needs \(u'&gt;0\), \(u''&lt;0\).</dd>
<dt>SDRF</dt><dd>Stochastic dominance with respect to a function: bounds on absolute risk aversion, utility form unspecified (Meyer).</dd>
<dt>SERF</dt><dd>Stochastic efficiency with respect to a function: compare CEs across a range of risk aversion for a chosen utility family (Richardson).</dd>
<dt>Stationarity</dt><dd>Distributional features (e.g., mean) that do not change over time; assumed for detrended yields.</dd>
<dt>Stochastic plateau</dt><dd>Plateau \(P_t=\bar P+\delta_t\) with \(\delta_t\) random (rainfall).</dd>
<dt>Value of information</dt><dd>Optimized expected profit with information minus without it.</dd>
</dl>
</template>

<template data-page="howto" data-title="How to add content">
<h2 class="display">How to add content</h2>
<p>The app is one HTML file. Everything you see comes from <code>&lt;template&gt;</code> blocks, so you add material by copying a block and editing its text. No programming is needed.</p>
<div class="tip"><b>Where the files are.</b> <code>AGEC 6403/Study App/</code> holds the finished app (<code>AGEC6403_Study_App.html</code>), the parts in <code>src/</code>, a <code>build.sh</code> script that joins the parts, and <code>HOW_TO_EDIT.md</code> with these same instructions.</div>

<h3>Three ways to update</h3>
<ol class="pts">
<li><b>Easiest: ask Claude.</b> Open Claude Code in the AGEC 6403 folder and say, for example: "Add a lesson to Chapter 10 on stochastic frontiers using my Nov 4 notes, with a quiz, cards and one-line review questions, then rebuild and republish the study app." Claude edits <code>src/</code>, runs <code>build.sh</code> and republishes to the same link.</li>
<li><b>Edit the parts yourself.</b> Open the right file in <code>src/</code> (chapters 0–1 in <code>10_…</code>, 2–3 in <code>20_…</code>, and so on), copy a block, edit it, then run <code>bash build.sh</code> in the Study App folder. Open the built HTML in a browser to check.</li>
<li><b>Edit the built file directly.</b> Every block is also inside <code>AGEC6403_Study_App.html</code>. Edits there are lost if you later run <code>build.sh</code>, so prefer <code>src/</code>.</li>
</ol>

<h3>Add a lesson</h3>
<pre class="code">&lt;template data-lesson="c10l2" data-ch="10" data-title="Stochastic frontiers"
          data-src="Lecture Nov 4" data-yt="stochastic frontier analysis"&gt;
  &lt;section data-s="learn"&gt; &lt;h3&gt;Heading&lt;/h3&gt; &lt;p&gt;Text with math \( \ln y = f(x) + v - u \)&lt;/p&gt; &lt;/section&gt;
  &lt;section data-s="examples"&gt; ... &lt;/section&gt;
  &lt;section data-s="watch"&gt; ... &lt;/section&gt;
  &lt;section data-s="quiz"&gt; ... &lt;/section&gt;
  &lt;section data-s="cards"&gt; ... &lt;/section&gt;
&lt;/template&gt;</pre>
<p>Lesson ids must be unique (<code>c</code> + chapter + <code>l</code> + number). Lessons appear in the order they are written. Leave out any section you do not need.</p>

<h3>Add a YouTube video</h3>
<pre class="code">&lt;a class="vid" data-tag="Start here" data-by="Channel name"
   href="https://www.youtube.com/watch?v=VIDEO_ID"&gt;Video title&lt;/a&gt;</pre>
<p>Every Watch tab also gets a "Search YouTube" link built from the lesson's <code>data-yt</code> words.</p>

<h3>Add a quiz question</h3>
<pre class="code">&lt;div class="q" data-a="1"&gt;   &lt;!-- right answer: 0 = A, 1 = B, 2 = C ... --&gt;
  &lt;div class="stem"&gt;Question?&lt;/div&gt;
  &lt;ol&gt;&lt;li&gt;Option A&lt;/li&gt;&lt;li&gt;Option B&lt;/li&gt;&lt;li&gt;Option C&lt;/li&gt;&lt;/ol&gt;
  &lt;div class="why"&gt;Explanation shown after answering.&lt;/div&gt;
&lt;/div&gt;</pre>
<p>New questions join the Practice tab automatically.</p>

<h3>Add a worked example, flashcard or one-line review question</h3>
<pre class="code">&lt;details class="sol"&gt;&lt;summary&gt;Problem&lt;/summary&gt;&lt;div class="body"&gt;Solution&lt;/div&gt;&lt;/details&gt;
&lt;div class="fc"&gt;&lt;div class="f"&gt;Front&lt;/div&gt;&lt;div class="b"&gt;Back&lt;/div&gt;&lt;/div&gt;
&lt;div class="ol"&gt;&lt;div class="oq"&gt;One-line question&lt;/div&gt;&lt;div class="oa"&gt;Answer&lt;/div&gt;&lt;/div&gt;</pre>
<p>One-line questions go inside the chapter's <code>&lt;template data-review="N"&gt;</code> block.</p>

<h3>Add a chapter</h3>
<pre class="code">&lt;template data-chapter="11" data-part="IV. Special topics" data-title="Duality"
          data-dates="Nov 9 · Nov 11" data-color="4"&gt;&lt;/template&gt;</pre>
<p>Then add lessons with <code>data-ch="11"</code> and a <code>&lt;template data-review="11"&gt;</code>. Colors 1–10 are available. Add <code>data-preview</code> to mark a chapter as not yet taught.</p>

<h3>Boxes you can use in lessons</h3>
<ul class="pts">
<li><code>&lt;div class="formula"&gt;&lt;span class="lbl"&gt;Label&lt;/span&gt;…&lt;/div&gt;</code> key formula</li>
<li><code>class="clarify"</code> blue explanation · <code>class="prof"</code> what the professor said · <code>class="exam"</code> exam alert · <code>class="warn"</code> common mistake · <code>class="tip"</code> tip</li>
<li>Interactive labs: <code>&lt;div data-tool="plateau"&gt;&lt;/div&gt;</code> (also <code>newsvendor</code>, <code>bayes</code>, <code>ce</code>, <code>rank</code>, <code>quad</code>, <code>quadopt</code>, <code>revenue</code>).</li>
</ul>

<h3>Things to know</h3>
<ul class="pts">
<li>Math: inline <code>\( … \)</code>, display <code>\[ … \]</code>. Inside math write <code>&amp;lt;</code> for "less than" and <code>&amp;gt;</code> for "greater than."</li>
<li>Your progress, notes and personal cards live in your browser. Use More → Back up your progress before switching devices.</li>
<li>For quick personal additions without editing files, use a lesson's <b>My notes</b> tab or <b>Cards → Add your own card</b>.</li>
</ul>
</template>

<script>
(function () {
"use strict";
/* ---------- state (saved only in this browser) ---------- */
const KEY = 'agec6403-study-v1';
let S = { done: {}, quiz: {}, notes: {}, cards: [], last: null, got: {}, check: {}, theme: '' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const view = $('#view');

/* ---------- read the content templates ---------- */
const CH = $$('template[data-chapter]').map(t => ({ n: t.dataset.chapter, title: t.dataset.title, blurb: t.dataset.blurb || '', dates: t.dataset.dates || '', part: t.dataset.part || '', color: t.dataset.color || '1', preview: t.hasAttribute('data-preview') }));
const LES = $$('template[data-lesson]').map(t => ({ id: t.dataset.lesson, ch: t.dataset.ch, title: t.dataset.title, src: t.dataset.src || '', yt: t.dataset.yt || '', t }));
const REV = {}; $$('template[data-review]').forEach(t => { REV[t.dataset.review] = t; });
const PAGES = {}; $$('template[data-page]').forEach(t => { PAGES[t.dataset.page] = t; });
const chOf = n => CH.find(c => c.n === n);
const lesOf = n => LES.filter(l => l.ch === n);
const chc = n => 'var(--c' + ((chOf(n) || {}).color || 1) + ')';
const sec = (l, s) => l.t.content.querySelector('section[data-s="' + s + '"]');

/* collect quiz questions and flashcards from every lesson */
const QUIZ = [], CARDS = [];
LES.forEach(l => {
  const q = sec(l, 'quiz');
  if (q) $$('.q', q).forEach((el, i) => QUIZ.push({ lesson: l.id, ch: l.ch, i, a: +el.dataset.a, stem: $('.stem', el).innerHTML, opts: $$('ol > li', el).map(x => x.innerHTML), why: ($('.why', el) || { innerHTML: '' }).innerHTML }));
  const c = sec(l, 'cards');
  if (c) $$('.fc', c).forEach(el => CARDS.push({ lesson: l.id, ch: l.ch, f: $('.f', el).innerHTML, b: $('.b', el).innerHTML }));
});
const revItems = n => REV[n] ? $$('.ol', REV[n].content) : [];

/* ---------- MathJax ---------- */
const pendingTypeset = [];
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else pendingTypeset.push(el);
}
const mjWait = setInterval(() => {
  if (window.MathJax && MathJax.typesetPromise) { clearInterval(mjWait); pendingTypeset.splice(0).forEach(el => { if (el.isConnected) typeset(el); }); }
}, 150);

/* ---------- small helpers ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1700); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function copyText(txt, btn) {
  const done = () => toast('Copied');
  try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it'); } ta.remove(); }
}
function setTop(title, back) { $('#toptitle').textContent = title; $('#backbtn').hidden = !back; }
$('#backbtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#home'; };
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

/* theme: system -> light -> dark */
function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); redrawAll(); }
$('#themebtn').onclick = () => { S.theme = S.theme === '' ? 'light' : S.theme === 'light' ? 'dark' : ''; save(); applyTheme(); toast(S.theme ? (S.theme === 'dark' ? 'Dark theme' : 'Light theme') : 'Theme follows your device'); };

/* ---------- quiz widget ---------- */
function quizCard(q, num, onAnswer) {
  const el = document.createElement('div'); el.className = 'q';
  el.innerHTML = '<div class="qn">Question ' + num + (q.lesson ? ' · ' + esc(lessonTitle(q.lesson)) : '') + '</div><div class="stem">' + q.stem + '</div><div class="opts"></div>';
  const box = $('.opts', el);
  q.opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="k">' + 'ABCDEF'[i] + '</span><span class="v">' + o + '</span>';
    b.onclick = () => {
      $$('.opt', box).forEach((x, j) => { x.disabled = true; if (j === q.a) x.classList.add('right'); });
      const ok = i === q.a; if (!ok) b.classList.add('wrong');
      const w = document.createElement('div'); w.className = 'why' + (ok ? '' : ' no');
      w.innerHTML = '<b>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + 'ABCDEF'[q.a] + '.') + '</b> ' + q.why;
      el.appendChild(w); typeset(w); onAnswer && onAnswer(ok);
    };
    box.appendChild(b);
  });
  return el;
}
const lessonTitle = id => (LES.find(l => l.id === id) || {}).title || '';

/* ---------- pages ---------- */
function home() {
  setTop('AGEC 6403 Study App', false);
  const total = LES.length, done = LES.filter(l => S.done[l.id]).length;
  let qc = 0, qt = 0; Object.values(S.quiz).forEach(v => { qc += v.c; qt += v.t; });
  const allRev = CH.reduce((a, c) => a + revItems(c.n).length, 0);
  const gotRev = Object.values(S.got).filter(v => v === 1).length;
  const last = LES.find(l => l.id === S.last) || LES.find(l => !S.done[l.id]) || LES[0];
  let h = '<div class="hero"><div class="eyebrow">AGEC 6403 · Advanced Production · Fall 2026</div>' +
    '<h2 class="display">From the experiment to the decision.</h2>' +
    '<p class="muted">Every topic from the syllabus and the lectures (Aug 31 to Oct 30): data generating processes, expected-profit maximization, plateau functions, Bayesian estimation, risk, stochastic dominance and numerical integration. Each chapter ends with one-line review questions.</p></div>';
  if (last) h += '<a class="continue" href="#' + last.id + '"><div><div class="eyebrow">' + (S.last ? 'Continue' : 'Start here') + ' · Chapter ' + last.ch + '</div><strong>' + last.title + '</strong></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>';
  h += '<div class="overall"><div class="stat"><b>' + done + '/' + total + '</b><span>lessons done</span></div><div class="stat"><b>' + (qt ? Math.round(100 * qc / qt) + '%' : '–') + '</b><span>quiz accuracy</span></div><div class="stat"><b>' + gotRev + '/' + allRev + '</b><span>one-liners known</span></div></div>';
  let part = '';
  CH.forEach(c => {
    if (c.part && c.part !== part) { part = c.part; h += '<div class="part"><div class="eyebrow">Syllabus part</div><h3>' + c.part + '</h3></div>'; }
    const ls = lesOf(c.n), dn = ls.filter(l => S.done[l.id]).length;
    const ri = revItems(c.n).length, rg = revItems(c.n).filter((_, i) => S.got[c.n + ':' + i] === 1).length;
    h += '<section class="chapter" style="--chc:' + chc(c.n) + '"><header><div class="chnum">' + c.n + '</div><h3>' + c.title + (c.preview ? ' <span class="preview">Preview</span>' : '') + '</h3><div class="src">' + c.dates + '</div></header>' +
      '<div class="meter"><i style="width:' + (ls.length ? 100 * dn / ls.length : 0) + '%"></i></div><ul class="lessons">';
    ls.forEach(l => {
      const qs = S.quiz[l.id];

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0, 0);
  let tab = 'home';
  if (!h || h === 'home') home();

  else if (h === 'cards') { tab = 'cards'; cardsPage(); }
  else if (h === 'tools') { tab = 'tools'; toolsPage(); }
  else if (h.indexOf('tool-') === 0) { tab = 'tools'; toolPage(h.slice(5)); }
  else if (h === 'more') { tab = 'more'; more(); }
  else if (h === 'notes') { tab = 'more'; notesPage(); }
  else if (h.indexOf('page-') === 0) { tab = 'more'; page(h.slice(5)); }
  else if (h.indexOf('review-') === 0) review(h.slice(7));
  else { const l = LES.find(x => x.id === h); if (l) { if (S._lastLesson !== l.id) lessonTab = 'learn'; S._lastLesson = l.id; lesson(l); } else home(); }
  $$('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
}

/* math helpers */
const SQ2PI = Math.sqrt(2 * Math.PI);
function phi(z) { return Math.exp(-z * z / 2) / SQ2PI; }
function Phi(z) { const t = 1 / (1 + 0.2316419 * Math.abs(z)); const d = 0.3989422804014327 * Math.exp(-z * z / 2); const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429)))); return z > 0 ? 1 - p : p; }

/* ---- 1. Stochastic plateau optimizer ---- */
TOOLS.plateau = {
  title: 'Stochastic plateau: optimal nitrogen', ch: '3', ico: 'N', desc: 'Linear response with a random plateau. See why the expected-profit optimum is above the average kink.',
  init(root, preset, uid) {

      ['r', 'N price r ($/lb)', 0.1, 2, 0.01, 0.7, v => '$' + v.toFixed(2)]], () => draw());

      let Ns; if (sd <= 0) Ns = p * b1 > r ? knot : 0; else if (alpha >= 1) Ns = 0; else Ns = Math.max(0, (mu - b0 + sd * invPhi(1 - alpha)) / b1);

/* ---- 6. Gaussian quadrature vs Monte Carlo ---- */
function gaussHermite(K) {
  /* probabilists' Hermite (standard normal weight) via Golub–Welsch with Jacobi eigenvalue iterations */
  const A = Array.from({ length: K }, (_, i) => Array.from({ length: K }, (_, j) => (Math.abs(i - j) === 1 ? Math.sqrt(Math.max(i, j)) : 0)));
  const V = Array.from({ length: K }, (_, i) => Array.from({ length: K }, (_, j) => (i === j ? 1 : 0)));
  for (let sweep = 0; sweep < 100; sweep++) {
    let off = 0; for (let i = 0; i < K; i++) for (let j = i + 1; j < K; j++) off += A[i][j] ** 2;
    if (off < 1e-22) break;
    for (let p = 0; p < K; p++) for (let q = p + 1; q < K; q++) {
      if (Math.abs(A[p][q]) < 1e-300) continue;
      const th = (A[q][q] - A[p][p]) / (2 * A[p][q]); const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)); const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < K; k++) { const akp = A[k][p], akq = A[k][q]; A[k][p] = c * akp - s * akq; A[k][q] = s * akp + c * akq; }
      for (let k = 0; k < K; k++) { const apk = A[p][k], aqk = A[q][k]; A[p][k] = c * apk - s * aqk; A[q][k] = s * apk + c * aqk; }
      for (let k = 0; k < K; k++) { const vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; }
    }
  }
  return Array.from({ length: K }, (_, i) => ({ x: A[i][i], w: V[0][i] ** 2 })).sort((a, b) => a.x - b.x);
}

    note(root, 'E(PY) = E(P)E(Y) + cov(P, Y). For bivariate normal P and Y: var(PY) = E(P)²var(Y) + E(Y)²var(P) + 2E(P)E(Y)cov + var(P)var(Y) + cov². With ρ = 0 the cov terms drop out.');
    draw = () => {
      const { mp, sp, my, sy, rho } = C.get(); const cv = rho * sp * sy;
      const er = mp * my + cv, vr = mp * mp * sy * sy + my * my * sp * sp + 2 * mp * my * cv + sp * sp * sy * sy + cv * cv;
      ro([['E(P)E(Y)', '$' + fmt(mp * my, 2)], ['cov(P, Y)', fmt(cv, 3)], ['E(PY) true expected revenue', '$' + fmt(er, 2), 1], ['Error from E(P)E(Y)', '$' + fmt(mp * my - er, 2)], ['SD of revenue', '$' + fmt(Math.sqrt(vr), 2), 1], ['SD if ρ were 0', '$' + fmt(Math.sqrt(mp * mp * sy * sy + my * my * sp * sp + sp * sp * sy * sy), 2)]]);
    };
    return () => draw();
  }
};

/* ---------- start ---------- */
applyTheme();
route();
})();
</script>
