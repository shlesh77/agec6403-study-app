<template data-lesson="c3l2" data-ch="3" data-title="The stochastic plateau and optimal nitrogen" data-src="Sep 14 · Sep 16 (Tembo et al. eq. 6 and 14) · Sep 21 · Assignment 5" data-yt="stochastic plateau nitrogen response Tembo">
<section data-s="learn">
<h3>Make the plateau random</h3>
<p>"We can make any parameter a function of variables" (Sep 14): \(y\sim N(\mu,\sigma^2)\) → \(y\sim N(\mathbf X\boldsymbol\beta,\sigma^2)\) (regression) → \(y\sim N(\mathbf X\boldsymbol\beta,\mathbf Z\boldsymbol\alpha)\) (heteroskedasticity). The variance equation is deterministic because \(\mathbf Z\) is known; stochastic volatility would need an integral in the likelihood.</p>
<div class="formula"><span class="lbl">Stochastic plateau DGP (class form)</span>
\[y_{itr}=\min(\beta_0+\beta_1N_i,\ P_t)+\gamma_t+\lambda_r+\varepsilon_{itr},\qquad P_t=\bar P+\delta_t,\ \delta_t\sim N(0,\sigma_\delta^2),\]
\(\gamma_t\sim N(0,\sigma_\gamma^2)\) year effect, \(\lambda_r\sim N(0,\sigma_\lambda^2)\) block effect, \(\varepsilon_{itr}\sim N(0,\sigma_\varepsilon^2)\), all independent. The slope \(\beta_1\) is a constant.</div>
<div class="tip"><b>Where the randomness goes.</b> Rainfall is what is random, and it enters through the <b>plateau</b>, inside the min. Errors outside the min only shift the whole curve. (Exam 1's consistently missed question.)</div>
<div class="prof"><span class="lbl">In class (Sep 14)</span>Technology for corn raised yield at high N much more than yield at zero N: the plateau moved. "You need to make the plateau parameter a function of time" rather than the intercept: \(P_t=\bar P+\rho t+\delta_t\).</div>

<h3>Expected yield (Tembo et al., equation 6)</h3>
<p>Let \(a=\beta_0+\beta_1N\), \(z=(a-\bar P)/\sigma\), \(\Phi\) the standard normal CDF and \(\phi\) its density.</p>
<div class="formula"><span class="lbl">The expectation does not pass through the min</span>
\[E(y)=\big(1-\Phi(z)\big)a+\Phi(z)\bar P-\sigma\phi(z).\]
\(\Phi(z)\) = probability the plateau binds. The last term: when you are on the plateau, it is a relatively low plateau ("the plateau mean minus something").</div>
<div class="warn"><span class="lbl">Classic error</span>Never replace \(E[\min(a,P)]\) with \(\min(a,E(P))\). Expected yield is smooth (no kink) even though every year's response has one. The model is like a Tobit (censored normal).</div>

<h3>Optimal nitrogen (Tembo et al., equation 14)</h3>
<div class="formula"><span class="lbl">FOC and solution</span>
\[p\beta_1\big[1-\Phi(z^*)\big]=r\ \Rightarrow\ \alpha\equiv1-\Phi=\frac{r}{p\beta_1},\qquad N^*=\frac{\bar P+\sigma Z_\alpha-\beta_0}{\beta_1}.\]
\(Z_\alpha\) is the upper-\(\alpha\) standard normal quantile (one-tailed: only the top of the plateau distribution matters).</div>
<ul class="pts">
<li>Corn: \(p\beta_1/r\approx10\) ⇒ \(\alpha\approx0.1\), \(Z\approx1.28\). Wheat: \(\approx6\).</li>
<li>So apply N up to where it is needed only about one year in six to ten. Corn's mean switch point is ≈150 lb N, but the recommended rate is ≈180 (up to 200 on good land).</li>
<li>If \(\alpha=0.5\), \(Z=0\): apply to the mean-plateau kink; expected yield there is below \(\bar P\).</li>
</ul>
<div class="exam"><span class="lbl">Exam and philosophy</span>"Risk aversion has to do with utility functions ... We have done nothing of that yet ... it's expected profit maximization that causes us to apply the nitrogen at that level." Never say farmers over-apply N because of risk aversion.</div>
<p>Nitrogen here is a <b>risk-increasing input</b>: \(\partial\operatorname{var}(Y\mid N)/\partial N&gt;0\), because more N exposes yield to plateau uncertainty.</p>
<div data-tool="plateau"></div>
<div class="clarify"><span class="lbl">Clarifying: the Bayesian version used later</span>Assignment 6 writes \(Y_{ij}=\alpha+\beta\min(N_{ij},T_j)+\varepsilon_{ij}\), \(T_j\sim N(\mu_T,\sigma_T^2)\): the random <i>switch point</i> \(T_j\) is a latent variable. A random switch point is a linear transformation of a random plateau, so no Jacobian is needed.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>β₀ = 25, β₁ = 0.35, P̄ = 45, σ = 6, p = $6, r = $0.70. Find α, Z_α and N*.</summary><div class="body"><p>\(\alpha=0.70/(6\times0.35)=0.333\). \(Z_\alpha=\Phi^{-1}(0.667)=0.43\). Kink at mean: \((45-25)/0.35=57.1\). \(N^*=(45+6\times0.43-25)/0.35=\)<span class="ans">64.5 lb N</span>. Load these defaults in the lab to check.</p></div></details>
<details class="sol"><summary>If α = 0.15, what is Z_α?</summary><div class="body"><p>Use the Z table backwards: \(1-0.15=0.85\) ⇒ \(Z\approx\)<span class="ans">1.04</span>. For α = 0.10, 1.28.</p></div></details>
<details class="sol"><summary>Why do farmers apply N in years when it does nothing?</summary><div class="body"><p>Because the response is asymmetric: missing N in a good year costs \(p\beta_1\) per lb (≈10× the price of N for corn), while unused N costs only \(r\). Expected profit maximization balances these, which means applying N that is needed only about 10% of the time.</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Censored normal" data-by="NEDL" href="https://www.youtube.com/watch?v=QS3OAYML2nM">Tobit model explained: censored regression</a>
<a class="vid" data-tag="Expectation of nonlinear functions" data-by="Steve Brunton" href="https://www.youtube.com/watch?v=GWuAGTjfRs8">Jensen's Inequality</a>
</section>

<section data-s="quiz">
<div class="q" data-a="0"><div class="stem">In the stochastic plateau, the random term that represents rainfall belongs …</div><ol><li>Inside the min, on the plateau</li><li>On the slope</li><li>Outside the min as an additive error</li><li>On the price</li></ol><div class="why">Rainfall moves the ceiling; additive errors outside the min only shift the curve.</div></div>
<div class="q" data-a="2"><div class="stem">The FOC for optimal N under a stochastic plateau is:</div><ol><li>\(p\beta_1=r\)</li><li>\(\Phi(z^*)=r/(p\beta_1)\)</li><li>\(p\beta_1[1-\Phi(z^*)]=r\)</li><li>\(E(y)=\bar P\)</li></ol><div class="why">Expected VMP = probability of being on the rising line × \(p\beta_1\).</div></div>
<div class="q" data-a="1"><div class="stem">For corn with \(p\beta_1/r\approx10\), optimal N is where the plateau binds about …</div><ol><li>50% of years</li><li>90% of years (N is needed only ~10% of years)</li><li>Never</li><li>Every year</li></ol><div class="why">\(\alpha=1-\Phi\approx0.1\).</div></div>
<div class="q" data-a="3"><div class="stem">Why is N applied above the mean-plateau kink?</div><ol><li>Risk aversion</li><li>Agronomist rules</li><li>Nitrogen is free</li><li>Expected profit maximization with an asymmetric response</li></ol><div class="why">The professor stresses this is not risk aversion.</div></div>
<div class="q" data-a="0"><div class="stem">Expected yield under a stochastic plateau as a function of N is:</div><ol><li>Smooth, with no kink</li><li>Kinked at the mean plateau</li><li>Linear</li><li>Equal to \(\min(\beta_0+\beta_1N,\bar P)\)</li></ol><div class="why">Averaging kinks at different heights gives a smooth curve.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Stochastic plateau expected yield</div><div class="b">\((1-\Phi(z))a+\Phi(z)\bar P-\sigma\phi(z)\), \(z=(a-\bar P)/\sigma\)</div></div>
<div class="fc"><div class="f">Optimal N (eq. 14)</div><div class="b">\(N^*=(\bar P+\sigma Z_\alpha-\beta_0)/\beta_1\), \(\alpha=r/(p\beta_1)\)</div></div>
<div class="fc"><div class="f">What \(\Phi(z)\) means here</div><div class="b">Probability the plateau binds (you are on the plateau)</div></div>
<div class="fc"><div class="f">Technology change belongs on …</div><div class="b">The plateau (\(P_t=\bar P+\rho t+\delta_t\)), not the intercept</div></div>
<div class="fc"><div class="f">Risk-increasing input</div><div class="b">\(\partial\operatorname{var}(Y\mid N)/\partial N&gt;0\)</div></div>
</section>

<template data-lesson="c3l3" data-ch="3" data-title="The newsvendor problem and the value of information" data-src="Sep 16 lecture · Stochastic plateau worksheet (IMG_2565)" data-yt="newsvendor problem critical ratio value of information">
<section data-s="learn">
<h3>Burritos made in the morning</h3>
<p>A vendor makes all burritos before demand is known; unsold ones are thrown away. Restaurants and grocers with perishables face the same problem. Students made it too complicated: sales are "a minimum of two things."</p>
<div class="formula"><span class="lbl">Newsvendor = stochastic plateau with intercept 0 and slope 1</span>
\[\max_{B\ge0}\ E(\pi)=p\,E\big[\min(B,D)\big]-c\,B,\qquad D\ \text{random}.\]
Interior optimum: \(F_D(B^*)=1-c/p\) (the critical ratio). Integer \(B\) if needed. Add a salvage value if leftovers have one.</div>
<div class="clarify"><span class="lbl">Clarifying: compare with the plateau</span>Plateau: yield = min(response line, random plateau), optimal N where \(1-\Phi=r/(p\beta_1)\). Newsvendor: sales = min(quantity made, random demand), optimal B where \(1-F=c/p\). Same math.</div>

<h3>Value of information</h3>
<div class="formula"><span class="lbl">Definition (worksheet)</span>
\[VOI=E[\pi^*\mid\text{better information}]-E[\pi^*\mid\text{original information}].\]
Perfect information: \(E[\max_x\pi(x,\xi)]-\max_xE[\pi(x,\xi)]\).</div>
<p>You must show <i>where forecast accuracy enters the model</i>, for example demand variance \(\lambda\sigma_D^2\) with \(\lambda&lt;1\) under the better forecast. "If you really read that question, you'll realize it's just giving you everything, and all you have to do is essentially write down in math what the question asked you in words."</p>
<ul class="pts">
<li>With better information the optimal amount changes day to day (a bakery makes more before a holiday).</li>
<li>Same logic values <b>precision agriculture</b>: better prediction of the response at a spot or in a year lets you apply less N and still get higher yield.</li>
<li>Do not subtract profits evaluated at arbitrary, unoptimized choices; compare <i>optimized</i> expected profits.</li>
</ul>
<div data-tool="newsvendor"></div>
</section>

<section data-s="examples">
<details class="sol"><summary>p = $8, c = $3, D ~ N(100, 25²). Find B*.</summary><div class="body"><p>Critical ratio \(1-3/8=0.625\), \(z=0.319\), \(B^*=100+25(0.319)=\)<span class="ans">108 burritos</span>.</p></div></details>
<details class="sol"><summary>Write the value of a forecast that halves the demand SD.</summary><div class="body"><p>\(VOI=\max_B E[\pi(B)\mid D\sim N(\mu,(0.5\sigma)^2)]-\max_B E[\pi(B)\mid D\sim N(\mu,\sigma^2)]\). With normal demand this equals \(p\sigma\phi(z^*)(1-0.5)\).</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Critical ratio" data-by="Piyush Shah" href="https://www.youtube.com/watch?v=8o_7K0vOdUg">Newsvendor Problem 2</a>
<a class="vid" data-tag="Value of information" data-by="MethodsEcolEvol" href="https://www.youtube.com/watch?v=4N0FFzGYfTs">Value of Information: Calculating the Value of Perfect Information</a>
<a class="vid" data-tag="EVPI" data-by="Linda Williams" href="https://www.youtube.com/watch?v=FhJe97kllHU">Decision Theory: Expected Value of Perfect Information</a>
</section>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">Sales in the burrito problem equal:</div><ol><li>Burritos made</li><li>min(burritos made, demand)</li><li>Demand</li><li>max(made, demand)</li></ol><div class="why">You cannot sell more than you made or more than people want.</div></div>
<div class="q" data-a="2"><div class="stem">Optimal quantity satisfies:</div><ol><li>\(F(B^*)=c/p\)</li><li>\(B^*=E(D)\)</li><li>\(F(B^*)=1-c/p\)</li><li>\(B^*=0\)</li></ol><div class="why">Critical ratio: probability demand is below B* equals 1 − c/p.</div></div>
<div class="q" data-a="0"><div class="stem">The value of information is:</div><ol><li>Optimized expected profit with the information minus optimized expected profit without it</li><li>Profit in a good year minus a bad year</li><li>The price of a forecast</li><li>The variance of demand</li></ol><div class="why">Compare optimized expected profits across information sets.</div></div>
</section>

<div class="fc"><div class="f">Newsvendor objective</div><div class="b">\(\max_B\ pE[\min(B,D)]-cB\)</div></div>
<div class="fc"><div class="f">Critical ratio</div><div class="b">\(F(B^*)=1-c/p\)</div></div>

<div class="fc"><div class="f">Newsvendor vs stochastic plateau</div><div class="b">Same structure: min of a choice line and a random ceiling (intercept 0, slope 1).</div></div>

<template data-chapter="4" data-part="I. The primal approach" data-title="Likelihood, hypothesis tests and SAS output" data-dates="Sep 9 · Sep 14 · Sep 18 · Sep 21 · Sep 25 · Assignments 2 and 5" data-color="4"></template>

<template data-lesson="c4l1" data-ch="4" data-title="Likelihood, LR, Wald and LM tests" data-src="Sep 14, Sep 18 and Sep 25 lectures · laying-hens worksheet · Assignment 5" data-yt="likelihood ratio test Wald test Lagrange multiplier test">
<section data-s="learn">
<h3>The likelihood function</h3>
<p>A <b>likelihood function</b> is the multivariate pdf of the data viewed as a function of the parameters. Maximum likelihood picks the parameters that maximize it. Proof of an optimum needs first- and second-order conditions; software usually checks only the first.</p>

<h3>Five parts of a hypothesis test (Assignment 2, Q8)</h3>
<ol class="pts"><li>Null hypothesis in terms of parameters.</li><li>Alternative hypothesis.</li><li>Test statistic.</li><li>p-value or critical value.</li><li>Conclusion in words.</li></ol>

<h3>The three classical tests</h3>
<div class="formula"><span class="lbl">Likelihood ratio (the course's workhorse)</span>
\[LR=-2\big(\ln L(\tilde\theta)-\ln L(\hat\theta)\big)\ \xrightarrow{d}\ \chi^2_q,\]
\(\tilde\theta\) restricted, \(\hat\theta\) unrestricted, \(q\) = number of restrictions. Needs both models.</div>
<ul class="pts">
<li><b>Wald</b>: uses only the unrestricted estimate and its covariance (the printed t-value). Behaves badly for nonlinear hypotheses and for variance parameters.</li>
<li><b>Lagrange multiplier (score)</b>: uses only the restricted fit. Heteroskedasticity version: regress squared residuals on the variance predictors and use \(nR^2\sim\chi^2\).</li>
</ul>
<div class="prof"><span class="lbl">In class (Sep 14)</span>The class has mostly used likelihood-ratio tests, fewer Wald tests and few LM tests; "think about what the tests mean."</div>

<h3>Testing a variance = 0: the boundary problem</h3>
<p>Deterministic vs stochastic plateau: \(H_0:\sigma_\delta^2=0\) vs \(H_A:\sigma_\delta^2&gt;0\). The null value is on the <b>boundary</b> of the parameter space (a variance cannot be negative).</p>
<div class="formula"><span class="lbl">Boundary result</span>Under \(H_0\), \(LR\sim\tfrac12\chi^2_0+\tfrac12\chi^2_1\). For a 5% test use the \(\chi^2_1\) <b>10%</b> critical value, <b>2.71</b>, not 3.84.</div>
<div class="prof"><span class="lbl">In class (Sep 25)</span>If you simulated data with a zero random effect, about half the estimates would be exactly 0 and half positive. "To do the test at the 5% level, you need to use the ... I believe it's the 10% critical value." People often forget this. The Wald t-value for a variance "is not a good test. But it'll still be printed."</div>

<h3>Nested and non-nested hypotheses</h3>
<ul class="pts">
<li><b>Nested</b>: restricting the larger model gives the smaller one (stochastic → deterministic plateau; skew-normal → normal). Use LR.</li>
<li><b>Non-nested</b>: neither is a restriction of the other (quadratic vs linear plateau, both 3 parameters). With the same dependent variable and the same number of parameters, the model with the higher likelihood fits better (AIC just compares likelihoods). Different numbers of parameters: Cox test (complicated) or Vuong test ("a little bit shaky"); a J test is another option.</li>
<li>R² has little meaning outside OLS.</li>
</ul>
<div class="exam"><span class="lbl">Exam 1 study guide item 9</span>Non-nested hypotheses are more likely to appear as a vocabulary term than as a calculation.</div>

<h3>The Hausman test (as presented in class)</h3>
<p>\(y=\min(\beta_0+\beta_1N,P)+\lambda_t\); \(H_0:\lambda_t\sim N(0,\sigma_\lambda^2)\) (random) vs \(H_A\): \(\lambda_t\) fixed. Estimate both (RANDOM statement vs year in CLASS and MODEL). Compare the statistic with its distribution under the null. "That's all the Hausman test is ... just standard hypothesis testing."</p>
<div class="clarify"><span class="lbl">Clarifying: textbook Hausman</span>Hausman (1978) compares coefficient estimates: \(H=(b_{FE}-b_{RE})'[V_{FE}-V_{RE}]^{-1}(b_{FE}-b_{RE})\sim\chi^2\). The null is that the random effects are uncorrelated with the regressors, so RE is consistent and efficient. Rejecting favors fixed effects.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Laying hens: test homoskedasticity against variance varying with hens per cage by Wald, LR and LM.</summary><div class="body">
<p>Model the variance as \(\sigma_a^2=\exp(\alpha_0+\sum_k\alpha_kD_{ak})\). \(H_0:\alpha_2=\dots=\alpha_5=0\).</p>
<ul class="pts"><li><b>Wald</b>: fit the heteroskedastic model only; test \(\hat\alpha=0\) using its covariance matrix.</li><li><b>LR</b>: fit both; \(-2(\ln L_R-\ln L_U)\sim\chi^2_4\).</li><li><b>LM</b>: fit the homoskedastic model only; regress squared residuals on the dummies; \(nR^2\sim\chi^2_4\).</li></ul></div></details>
<details class="sol"><summary>Assignment 5: restricted log L = −612.4, unrestricted = −610.9. Test deterministic vs stochastic plateau at 5%.</summary><div class="body"><p>\(LR=-2(-612.4+610.9)=3.0\). Boundary critical value 2.71 → <span class="ans">reject the deterministic plateau</span>. (With the naive 3.84 you would wrongly fail to reject.) Numbers are illustrative.</p></div></details>
<details class="sol"><summary>Is skew-normal vs normal nested or non-nested?</summary><div class="body"><p>Nested: setting the skewness parameter to zero gives the normal.</p></div></details>
</section>

<template data-lesson="c4l2" data-ch="4" data-title="Reading SAS programs and output" data-src="Sep 18 old-exam review · Sep 25 · Exam 1 study guide" data-yt="SAS PROC NLMIXED tutorial">
<section data-s="learn">
<h3>What the exam asks</h3>
<p>"The objective changed from writing SAS statements to interpreting them." Expect a SAS question on PROC MIXED or PROC NLMIXED statements and output.</p>
<h3>PROC MIXED pieces</h3>
<pre class="code">proc mixed data=trial method=reml;
  class variety year;
  model yield = variety / solution;
  random year;
  lsmeans variety / pdiff;
run;</pre>
<ul class="pts"><li><b>CLASS</b>: discrete variables. <b>MODEL</b>: fixed effects. <b>RANDOM</b>: random effects. <b>LSMEANS</b>: adjusted treatment means.</li><li>Year in CLASS + MODEL = fixed year effects; year in RANDOM = random year effects (that switch is the Hausman comparison).</li></ul>

<h3>PROC NLMIXED pieces</h3>
<pre class="code">proc nlmixed data=lahoma qpoints=20;
  parms b0=25 b1=0.3 pbar=45 s2u=0.2 s2e=30;
  s2u_actual = s2u*100;              /* scaling: estimate s2u in units of 100 */
  plateau = pbar + u;
  mean = min(b0 + b1*n, plateau);
  model yield ~ normal(mean, s2e);   /* NLMIXED normal() takes a VARIANCE */
  random u ~ normal(0, s2u_actual) subject=year;
run;</pre>
<ul class="pts">
<li><b>PARMS</b>: starting values. <b>RANDOM ... subject=year</b>: one random effect per year. A random effect inside min changes the plateau; outside it shifts the curve.</li>
<li><b>QPOINTS</b>: Gaussian quadrature points used to integrate the random effect out of the likelihood (numerical integration; most integrals cannot be solved analytically).</li>
<li><b>Scaling</b> (\(s2u\times100\)) changes the Hessian and makes estimation more stable; estimates must be rescaled when reported. On the exam, pointing with arrows to the scaling line is fine.</li>
<li>Judge convergence from the <b>Gradient</b> column, not from the "converged" message.</li>
<li>SAS macros and global variables loop over procedures (needed for a profile likelihood); data steps and procedures behave like subroutines with local variables.</li>
</ul>
<div class="warn"><span class="lbl">Units trap</span>SAS <code>rand('normal', mean, sd)</code> takes a standard deviation; NLMIXED <code>normal(mean, variance)</code> takes a variance; Stan <code>normal(mean, sd)</code> takes an SD.</div>
<div class="prof"><span class="lbl">In class (Sep 25)</span>"That's a very big deal to us that you always put the import of the data in the program." Never import data by point-and-click; a former student could not reproduce which data he had used.</div>
<div class="clarify"><span class="lbl">Clarifying: Assignment 5 estimation ladder</span>(i) Linear model in PROC MIXED; (ii) nonstochastic plateau in NLMIXED; (iii) stochastic plateau with METHOD=FIRO; (iv) without FIRO and with NOAD; if still stuck, print the Hessian (HESS) to find rescaling; always try alternative starting values. Urea at $650/ton is 46% N, so N costs \(650/(2000\times0.46)=\$0.71\) per lb.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Where in the NLMIXED program above is the plateau random?</summary><div class="body"><p><code>plateau = pbar + u;</code> with <code>random u ~ normal(0, s2u_actual) subject=year;</code> The year effect sits inside the min.</p></div></details>
<details class="sol"><summary>Convert urea at $650/ton to $/lb N.</summary><div class="body"><p>One ton = 2,000 lb urea × 0.46 = 920 lb N. \(650/920=\)<span class="ans">$0.707/lb N</span>.</p></div></details>
</section>

<template data-lesson="c5l1" data-ch="5" data-title="Bayes' rule, priors and credible intervals" data-src="Sep 21, Sep 25 and Sep 28 lectures · notebook 2026-09-27 pages · IMG_2649–2653" data-yt="Bayesian inference prior likelihood posterior normal normal conjugate">
<section data-s="learn">
<h3>Why Bayesian (and why it is capitalized)</h3>
<p>Named after Thomas Bayes (1700s), so "Bayesian" is capitalized. Usual statistics is <b>frequentist</b> (Pearson; Fisher at Rothamsted — much of statistics came out of agronomy). In frequentist statistics the interval is random and the parameter is constant, so you cannot say a parameter has a 95% probability of being in an interval. Bayesian methods let you say exactly that.</p>
<p>Why use it for the stochastic plateau:</p>
<ol class="pts"><li>Better convergence.</li><li>You have prior information (corn switch point ≈150 lb N; higher in Nebraska, lower in Oklahoma). "The principle of econometrics is you have information, you ought to use it."</li><li>Avoids theoretical issues from the non-differentiability.</li><li>A random-effect variance is constrained positive, which complicates frequentist tests (the boundary problem).</li></ol>

<div class="formula"><span class="lbl">Bayes' rule</span>
\[P(\theta\mid y)=\frac{P(y\mid\theta)\,P(\theta)}{P(y)}\ \propto\ P(y\mid\theta)\,P(\theta).\]
Posterior ∝ likelihood × prior. \(P(y)=\int P(y\mid\theta)P(\theta)\,d\theta\) is the normalizing constant (marginal likelihood).</div>
<ul class="pts"><li><b>Posterior</b> \(P(\theta\mid y)\): distribution of the parameter given the data.</li><li><b>Likelihood</b> \(P(y\mid\theta)\): probability of the data given the parameters.</li><li><b>Prior</b> \(P(\theta)\): what you knew before these data.</li></ul>

<h3>Kinds of priors</h3>
<ul class="pts">
<li><b>Informative</b>: \(\mu_T\sim N(150,40^2)\) for the corn threshold. "This is for the plateau threshold, not the optimum level."</li>
<li><b>Weakly informative</b>: same mean, large SD (\(N(150,1000^2)\)); rules out absurd values (−5,000 or a million) but lets the data speak. Imposing positivity "is more of a restriction than you want."</li>
<li><b>Diffuse / uninformative / Jeffreys</b>: improper uniform on \((-\infty,\infty)\). With a fully diffuse prior on OLS "you'll get the exact same model, because the prior is doing absolutely nothing."</li>
<li>Already-used <b>certain</b> prior information: leaving sunspots out of a meat demand equation imposes an exact zero.</li>
</ul>
<div class="prof"><span class="lbl">In class (Sep 28)</span>Corn intercept ≈ 70 (somewhere between 40 and 110): a normal prior with mean 70 and SD 100 or 10,000 is weakly informative; SD 20 is informative ("more exact than I probably even am"). "If weakly informative σ = 1000; if informative σ = 20." Normal priors are common for α, β, μ<sub>T</sub>; gamma (or half-normal) for SDs. A normal prior for an SD "is still not a terrible thing," since sign restrictions increase bias.</div>

<h3>Normal–normal updating</h3>
<div class="formula"><span class="lbl">Prior μ ~ N(μ₀, σ₀²), likelihood of the sample mean ~ N(μ, σ²/n)</span>
\[\mu_b=\frac{\sigma_0^2}{\sigma_0^2+\sigma^2/n}\,\tilde\mu+\frac{\sigma^2/n}{\sigma_0^2+\sigma^2/n}\,\mu_0,\qquad \sigma_b^2=\frac{\sigma_0^2\sigma^2}{n\sigma_0^2+\sigma^2}.\]
Equivalently precisions add: \(1/\sigma_b^2=1/\sigma_0^2+n/\sigma^2\).</div>
<ul class="pts"><li>A weighted average with weights summing to one; each weight is proportional to the <i>other</i> source's variance (more weight on the more precise source).</li><li>\(n\) affects only the likelihood. As \(n\to\infty\), the prior's weight → 0 and you get the likelihood back (consistency).</li></ul>
<div data-tool="bayes"></div>

<h3>Credible vs confidence intervals</h3>
<ul class="pts">
<li><b>Confidence (frequentist)</b>: the interval is random, the parameter fixed; "you can be 95% confident that this interval contains the true value" (95% of such intervals cover it).</li>
<li><b>Credible (Bayesian)</b>: "given this, and this, and this, there's a 95% probability that the parameter lies inside this interval." From 10,000 posterior draws, drop 250 from each tail.</li>
<li>"We're not talking about hypothesis tests anymore when we're in this Bayesian world." Intervals are what we ought to report.</li>
</ul>
<div class="exam"><span class="lbl">Oct 30 exam review</span>Know prior, likelihood, posterior and posterior predictive distribution. Know why Bayesian and classical point estimates can agree: (i) the prior is weak, (ii) informative data dominate the prior, or (iii) the prior is centered on the classical estimate. Agreement of point estimates is not the same as equal uncertainty.</div>
</section>

<section data-s="examples">
<h3>Class worksheet (Sep 28)</h3>
<details class="sol"><summary>Prior variance 10⁴, likelihood mean 5 with variance 2. Posterior?</summary><div class="body"><p>Weight on data \(=10^4/(10^4+2)\approx1\). Posterior mean ≈ 5; variance \(=2\cdot10^4/10002\approx\)<span class="ans">2</span>. You get the likelihood back.</p></div></details>
<details class="sol"><summary>Prior mean 10 variance 2, likelihood mean 5 variance 2. Posterior?</summary><div class="body"><p>Equal precision → equal weights. Mean \(=(10+5)/2=\)<span class="ans">7.5</span>, variance \(=2\cdot2/(2+2)=\)<span class="ans">1</span>.</p></div></details>
<details class="sol"><summary>Very tight prior (variance 0.01) at 10, likelihood mean 5 variance 2.</summary><div class="body"><p>Weight on data \(=0.01/2.01\approx0.005\): posterior ≈ <span class="ans">the prior (≈ 10)</span>.</p></div></details>
<details class="sol"><summary>Prior N(60, 25), sample mean 50 with variance 25. Posterior?</summary><div class="body"><p>Equal precision: mean 55, variance 12.5.</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="0"><div class="stem">The posterior is proportional to:</div><ol><li>Likelihood × prior</li><li>Prior ÷ likelihood</li><li>Likelihood + prior</li><li>The marginal likelihood</li></ol><div class="why">\(P(\theta\mid y)\propto P(y\mid\theta)P(\theta)\).</div></div>
<div class="q" data-a="2"><div class="stem">What happens to the prior's influence as n grows?</div><ol><li>It grows</li><li>It stays constant</li><li>It goes to zero</li><li>It becomes the likelihood</li></ol><div class="why">n enters only the likelihood precision n/σ².</div></div>
<div class="q" data-a="1"><div class="stem">Which statement is a Bayesian credible interval?</div><ol><li>95% of such intervals cover the fixed true value</li><li>Given the data and model, there is a 95% probability the parameter is in the interval</li><li>The parameter is in the interval with certainty</li><li>The p-value is below 0.05</li></ol><div class="why">Bayesian intervals make direct probability statements about parameters.</div></div>
<div class="q" data-a="3"><div class="stem">Equal prior and likelihood variances of 2, means 10 and 5. Posterior variance?</div><ol><li>2</li><li>4</li><li>0.5</li><li>1</li></ol><div class="why">\(2\cdot2/(2+2)=1\).</div></div>
<div class="q" data-a="0"><div class="stem">The informative prior \(N(150,40^2)\) is for the corn …</div><ol><li>Threshold (switch point), not the optimum</li><li>Optimal N rate</li><li>Yield intercept</li><li>Price of N</li></ol><div class="why">The optimum is higher (~180) because N is applied to where it is needed one year in six to ten.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Bayes' rule</div><div class="b">\(P(\theta\mid y)=P(y\mid\theta)P(\theta)/P(y)\)</div></div>
<div class="fc"><div class="f">Informative vs weakly informative prior</div><div class="b">Same mean; small SD (e.g., 20) vs large SD (e.g., 1,000)</div></div>
<div class="fc"><div class="f">Normal–normal posterior variance</div><div class="b">\(\sigma_0^2\sigma^2/(n\sigma_0^2+\sigma^2)\)</div></div>
<div class="fc"><div class="f">Posterior mean weights</div><div class="b">Each source's weight ∝ the other source's variance</div></div>
<div class="fc"><div class="f">When do Bayesian and ML estimates agree?</div><div class="b">Weak prior, data dominate, or prior centered on the classical estimate</div></div>
</section>

<template data-lesson="c5l2" data-ch="5" data-title="MCMC, Stan and reading the output" data-src="Sep 21, Sep 28 and Sep 30 lectures · Assignment 6 · IMG_2650–2655" data-yt="MCMC explained Stan R-hat effective sample size">
<section data-s="learn">
<h3>Why MCMC</h3>
<p>Computing \(P(y)\) needs heavy numerical integration; Bayesian methods were avoided for a long time because of it. <b>Markov chain Monte Carlo</b> gets around the integral ("a very clever way of doing it") and returns many draws from the posterior.</p>
<ul class="pts">
<li><b>Monte Carlo</b> = random number generation. <b>Markov</b> = only the current state matters (like a random walk). "Markov ... it's Russian."</li>
<li>Output: \(\theta^{(1)},\dots,\theta^{(10{,}000)}\), each \(\theta^{(s)}=(\alpha^s,\beta^s,\mu_T^s,\sigma_T^s,\sigma^s)\). Posterior mean = average of draws; median = between the 5,000th and 5,001st sorted draws; 95% credible interval = cut 2.5% from each tail.</li>
<li><b>Warm-up / burn-in</b>: starting values are drawn randomly from the priors; throw away the first ~1,000 draws so retained draws are from the posterior. (Specifying your own starting values is considered bad practice.)</li>
<li><b>Convergence differs from ML.</b> ML parameters converge to a <i>point</i> (gradients → 0). MCMC should converge to a <i>distribution</i>: check R-hat and other diagnostics.</li>
<li>Failure causes: too few iterations, poorly specified models ("funnels"), poor scaling, many tuning parameters.</li>
<li>Algorithms: Metropolis–Hastings and Gibbs (JAGS, BUGS, SAS PROC MCMC); Hamiltonian Monte Carlo (Stan); INLA (R-INLA). MCMC is a rejection method: tighter acceptance is more accurate but slower.</li>
</ul>

<h3>Posterior predictive distribution</h3>
<div class="formula"><span class="lbl">New site or year</span>\(T_{new}^{(s)}\sim N\big(\mu_T^{(s)},[\sigma_T^{(s)}]^2\big)\): one draw of the threshold for each posterior draw. Uses: filling missing values (NASS gaps, deleted yield-monitor points), predicting thresholds where no trial was run.</div>

<h3>Assignment 6 in RStan</h3>
<ul class="pts">
<li>Install <b>Rtools first, then RStan</b>. "It's very important that you do this first and then that." R writes the Stan program, which compiles to C++.</li>
<li>Program blocks: <b>data</b>, <b>parameters</b> (intercept, slope, plateau mean, plateau trend, variances), <b>transformed parameters</b> (year effects, like BLUPs), <b>model</b> (priors and likelihood), <b>generated quantities</b> (e.g., optimal N for each draw).</li>
<li>Stan's <code>normal(mean, sd)</code> uses an SD. Variance parameters had half-normal priors centered on ML estimates with large variances: a form of <b>empirical Bayes</b> ("cheating a bit," acceptable because the variances are wide).</li>
<li>Year effects drawn as standard normals and rescaled (non-centered): equivalent, faster.</li>
<li><b>Hierarchical</b>: the likelihood is conditional on unobserved year effects, a middle layer between the prior and the data; those effects are <b>latent</b>.</li>
<li>"I like this because it's the way I think. I can write the data generating process down. I don't have to write the likelihood down."</li>
</ul>
<div class="formula"><span class="lbl">The stan() call</span>chains = 4 (four random starts; if all end in the same place, evidence of convergence), iter = 4000 per chain, warmup = 2000, seed (repeatable results), adapt_delta = 0.95, max_treedepth = 12. Retained draws: 2,000 × 4 = 8,000. Thinning = 1.</div>

<h3>Reading the output</h3>
<ul class="pts">
<li>25.663 = posterior mean of α; 22.959 to 28.442 = <b>credible</b> interval.</li>
<li><b>n_eff</b> &lt; 8,000 because draws are autocorrelated (the plateau parameter is most autocorrelated).</li>
<li><b>R-hat</b> above about 1.01 signals non-convergence. Divergent transitions = 0 and max-treedepth hits = 0 are good.</li>
<li>Plateau trend: posterior probability positive = 0.9818: statistically marginal, economically large.</li>
<li>If R-hat is bad: model design matters more than starting values. <b>Center the time trend</b> (subtract 2000) and rescale (÷10).</li>
</ul>
<div class="clarify"><span class="lbl">Clarifying: why 2027 optimal N differs from Assignment 5</span>With a plateau trend, the expected plateau in 2027 is higher than the sample average, so \(N^*\) for 2027 is higher than an optimum computed from a trendless plateau. Compute \(N^*\) for each posterior draw to get its posterior distribution.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Why is the Assignment 6 model called hierarchical?</summary><div class="body"><p>Because there are layers: priors on the hyperparameters (\(\mu,\sigma\) of year effects), latent year effects drawn from that distribution, and the data conditional on the year effects.</p></div></details>
<details class="sol"><summary>How do you check convergence in Assignment 6?</summary><div class="body"><p>R-hat &lt; 1.01 for every parameter; adequate n_eff; zero divergent transitions; no max-treedepth hits; trace plots of the four chains overlap.</p></div></details>
<details class="sol"><summary>How do you choose between the plateau with and without trend?</summary><div class="body"><p>Credible interval for the trend (does it exclude 0? posterior probability positive = 0.98) and a criterion such as LOO-CV or WAIC (or DIC).</p></div></details>
</section>

<template data-lesson="c6l1" data-ch="6" data-title="Expected utility, certainty equivalent and risk premium" data-src="Oct 2 lecture · IMG_2657–2659 · Oct 14 TA worksheet · Oct 30 review" data-yt="expected utility certainty equivalent risk premium graph">
<section data-s="learn">
<h3>What is risk?</h3>
<p>The class uses a broad definition. Books separate <b>uncertainty</b> (probabilities unknown) from <b>risk</b> (probabilities known or subjectively assessable); the professor never found it useful: "it's not gonna be on your test." Risk can be described as <b>variability</b> (an SD in a normal world) or as a <b>chance of loss</b>, which leads to <b>safety-first</b> models (e.g., no more than a 5% chance of bankruptcy as a probability constraint).</p>

<h3>Utility</h3>
<div class="formula"><span class="lbl">von Neumann–Morgenstern assumptions</span>
\[u'(\pi)&gt;0\ \ (\text{more preferred to less}),\qquad u''(\pi)&lt;0\ \ (\text{concave: risk averse}).\]
\(u''=0\) risk neutral; \(u''&gt;0\) risk seeking.</div>
<p>In micro theory utility depends on goods; substituting the budget constraint gives utility of wealth, so wealth, consumption or profit can be used. Expected-utility axioms: completeness, transitivity, continuity, independence (a preference axiom, not statistical independence). Positive affine transformations \(a+bU\), \(b&gt;0\), preserve rankings, so a negative utility number means nothing by itself.</p>

<h3>Expected utility</h3>
<div class="formula"><span class="lbl">Discrete and continuous ("right from math stat")</span>
\[E\,u(w)=\sum_{i=1}^{n}u(w_i)\,p_i,\qquad E\,u(w)=\int_{-\infty}^{\infty}u(w)f(w)\,dw.\]
The probabilities go <b>outside each utility evaluation</b>.</div>
<div class="warn"><span class="lbl">The biggest mistake</span>\(u(\bar\pi)\ne E\,u(\pi)\) unless utility is linear, "because the expectation doesn't go through on a nonlinear function." "When I was at Purdue, a girl failed her prelims because she didn't know this ... that is a very big deal." For concave \(u\), Jensen: \(E\,u(\pi)\le u(E\pi)\).</div>

<h3>Certainty equivalent and risk premium</h3>
<div class="formula"><span class="lbl">Definitions</span>
\[u(CE)=E\,u(W),\qquad CE=u^{-1}\big(E\,u(W)\big),\qquad RP=E(W)-CE.\]
CE is a <b>money amount</b>, not utility. Risk averse: \(CE&lt;E(W)\), \(RP&gt;0\).</div>
<div class="exam"><span class="lbl">Exam alert (Oct 2)</span>"There's a pretty good chance that this graph will be on your exam." Draw a concave \(u\); mark \(\pi_1,\pi_2\) and the chord between them. At \(\bar\pi\) the curve gives \(u(\bar\pi)\) and the chord gives \(E\,u(\pi)\). Go horizontally from \(E\,u\) to the curve and drop down: that is CE. The horizontal gap from CE to \(\bar\pi\) is the risk premium. The chord point is at the probability-weighted mean (the midpoint only when \(p=1/2\)).</div>
<div data-tool="ce"></div>
<div class="tip"><b>Unfamiliar utility on the exam (Oct 30)?</b> Start from \(U(CE)=E[U(W)]\), substitute the given function, and solve for CE. Memorizing only the exponential formula is not enough.</div>
<div class="prof"><span class="lbl">In class</span>Direct elicitation of utility functions was popular when he was a graduate student but is rare now: large measurement errors, and elicited risk preferences explain little in regressions. Surveys ask about five related questions and average them. In class (Oct 12) students placed themselves from risk seeking to highly risk averse on an elicitation worksheet.</div>

<h3>Writing a risky choice (Oct 14 TA worksheet)</h3>
<div class="formula"><span class="lbl">Discrete expected-utility choice</span>\[a^*\in\arg\max_{a\in A}\sum_i p_i\,U\big(\pi_i(a)\big).\]
Binary decision: \(a\in\{0,1\}\). Continuous: state the feasible interval. Define revenue and cost before inserting profit into utility.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Wealth 16 or 64 with equal probability, \(U=\sqrt w\). Find E(W), EU, U(EW), CE, RP.</summary><div class="body"><p>\(E(W)=40\); \(EU=(4+8)/2=6\); \(U(40)=6.325\); \(CE=6^2=\)<span class="ans">36</span>; \(RP=40-36=\)<span class="ans">4</span>.</p></div></details>
<details class="sol"><summary>Log utility, wealth 50 or 150 with p = 0.5. Find CE.</summary><div class="body"><p>\(EU=0.5\ln50+0.5\ln150\); \(CE=\exp(EU)=\sqrt{50\times150}=\)<span class="ans">86.6</span>; RP = 100 − 86.6 = 13.4.</p></div></details>
<details class="sol"><summary>Assignment 7: write the discrete-choice expected-utility problem for three cotton varieties.</summary><div class="body"><p>\(\max_{j\in\{A1,A2,A3\}}\ \sum_{s=1}^{4}p_s\,U(\pi_{js})\), where \(s\) = weather state (excellent, good, fair, poor) with \(p_s=0.10,0.30,0.35,0.25\), \(\pi_{js}\) income of variety \(j\) in state \(s\) (in $1,000), and \(U\) the elicited utility function.</p></div></details>
<details class="sol"><summary>Assignment 7: revenue-insurance coverage choice. Write it and say what an actuarially fair premium implies.</summary><div class="body"><p>\(\max_{c\in C}\ E\,U\big(\tilde p\tilde Y-K+I(c)-\text{prem}(c)\big)\), \(I(c)=\max\{0,\ c\,\bar R-\tilde p\tilde Y\}\), with \(C\) the offered coverage levels, \(\bar R\) guaranteed revenue base, \(\tilde p,\tilde Y\) random harvest price and yield, \(K\) costs. With a fair premium (\(\text{prem}=E\,I\)) a risk-averse producer picks the <b>highest</b> coverage offered: it lowers variance without lowering the mean. Producers who decline high subsidized coverage are revealing low risk aversion (or other costs/factors).</p></div></details>
</section>

<template data-lesson="c6l2" data-ch="6" data-title="Arrow–Pratt risk aversion, CARA and CRRA" data-src="Oct 5 · Oct 19 · Oct 21 lectures · IMG_2659–2660, IMG_2801–2804" data-yt="Arrow Pratt absolute risk aversion CARA CRRA">
<section data-s="learn">
<h3>Measuring risk aversion</h3>
<div class="formula"><span class="lbl">Arrow–Pratt coefficients</span>
\[A(w)=r(w)=-\frac{u''(w)}{u'(w)}\ \ (\text{absolute}),\qquad R(w)=w\,A(w)\ \ (\text{relative}).\]
\(r&gt;0\) risk averse. CARA: \(A'(w)=0\); DARA: \(A'(w)&lt;0\); IARA: \(A'(w)&gt;0\).</div>
<div class="warn"><span class="lbl">Units matter</span>\(r(w)\) depends on the units of measurement (dollars vs $1,000; per month vs per year) and often looks tiny (0.0001). In Assignment 9, \(r=0.05\) is per $1,000. State units and justify the range.</div>

<h3>Negative exponential (CARA)</h3>
<div class="formula"><span class="lbl">Derivation</span>
\[u(w)=1-e^{-\rho w}\ \ (\text{or }-e^{-\rho w}),\quad u'=\rho e^{-\rho w},\quad u''=-\rho^2e^{-\rho w},\quad r(w)=\rho.\]</div>
<div class="prof"><span class="lbl">Trick question (Oct 5)</span>He first wrote \(e^{-\rho w}\): its first derivative is negative, so it violates "more is better." You need the minus sign or \(1-e^{-\rho w}\).</div>
<div class="formula"><span class="lbl">CARA certainty equivalent (Oct 21)</span>
\[-e^{-rCE}=E[-e^{-rW}]\ \Rightarrow\ CE=-\frac1r\ln E\big[e^{-rW}\big]=-\frac1r\ln\sum_jp_je^{-rw_j}.\]
At \(r=0\) use the limit \(CE=E(W)\); never divide by zero. If \(W\sim N(\mu,\sigma^2)\): \(CE=\mu-\tfrac{r}{2}\sigma^2\) exactly.</div>

<h3>Power (CRRA) and log utility</h3>
<div class="formula"><span class="lbl">Normalized power utility</span>
\[u(w)=\frac{w^{1-\rho}}{1-\rho},\quad u'=w^{-\rho},\quad u''=-\rho w^{-\rho-1},\quad A=\frac{\rho}{w},\quad R=\rho,\quad w&gt;0.\]
At \(\rho=1\): \(u=\ln w\), \(A=1/w\), \(R=1\) (DARA). CE for log: \(\exp(E\ln W)\). For \(u=w^a/a\): \(CE=(a\,EU)^{1/a}\).</div>
<div class="clarify"><span class="lbl">Clarifying</span>The notebook sometimes drops the \(1-\rho\) denominator; then check the sign of \(u'\) carefully. For a small zero-mean risk, \(RP\approx\tfrac12A(w)\sigma^2\). CARA is convenient because the ranking does not depend on starting wealth.</div>
<div class="prof"><span class="lbl">Behavior and reality (Oct 5)</span>Without risk seeking, theories struggle to explain casinos and lottery tickets (a 93% payout slot machine loses 7 cents per dollar); gambling can be a consumption good. Behavioral economics shows individuals violate the axioms (overweighting small probabilities), but in aggregate expected utility works well. "All models are wrong. But some are useful." Risk should really be judged for the whole farm, though people keep mental "pockets of money."</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Show that \(u=1-e^{-\rho w}\) has constant absolute risk aversion.</summary><div class="body"><p>\(-u''/u'=\rho^2e^{-\rho w}/(\rho e^{-\rho w})=\)<span class="ans">ρ</span>, independent of \(w\).</p></div></details>
<details class="sol"><summary>Find A(w) and R(w) for \(u=\ln w\).</summary><div class="body"><p>\(u'=1/w\), \(u''=-1/w^2\): \(A=1/w\) (decreasing: DARA), \(R=1\).</p></div></details>
<details class="sol"><summary>CARA with r = 0.05 per $1,000, income 30 or 70 ($1,000) with equal probability. CE?</summary><div class="body"><p>\(CE=-\frac{1}{0.05}\ln\big(0.5e^{-1.5}+0.5e^{-3.5}\big)=-20\ln(0.1116+0.0151)=-20\ln(0.1267)=\)<span class="ans">41.3</span> ($41,300) vs mean 50.</p></div></details>
<details class="sol"><summary>Unfamiliar utility \(U=w^{1/3}\): outcomes 8 and 64, p = 0.5. CE?</summary><div class="body"><p>\(EU=(2+4)/2=3\); \(CE^{1/3}=3\Rightarrow CE=\)<span class="ans">27</span>; mean 36, RP 9.</p></div></details>
</section>

<template data-lesson="c7l1" data-ch="7" data-title="Mean–variance efficiency" data-src="Oct 5 lecture · IMG_2660–2662 · Assignment 7 Q2" data-yt="mean variance efficiency dominance decision under risk">
<section data-s="learn">
<h3>Why efficiency criteria?</h3>
<p>We rarely know ρ even for one person, and we want conclusions for a group with different risk aversion. Efficiency criteria split alternatives into an <b>efficient set</b> (not dominated) and an <b>inefficient set</b>.</p>
<div class="formula"><span class="lbl">E-V dominance</span>
F dominates G if \(E_F\ge E_G\) and \(V_F\le V_G\), with at least one strict inequality.
<br>Assumptions: risk aversion, plus normal outcomes <b>or</b> quadratic utility.</div>
<div class="exam"><span class="lbl">Test item (IMG_2661 "Test*")</span>Draw CDFs: a lower mean for G puts more of G's CDF to the left; a higher variance makes G's CDF flatter. "This is something that you're gonna have to know ... that's gonna be on the test."</div>

<h3>The A/B/C example (Oct 5 notebook, five outcomes, p = 0.2 each)</h3>
<div class="scrollx"><table class="t"><thead><tr><th>Outcome</th><th>A</th><th>B</th><th>C</th></tr></thead><tbody>
<tr><td>1</td><td>−4,000</td><td>−5,000</td><td>−5,000</td></tr><tr><td>2</td><td>−4,000</td><td>5,000</td><td>5,000</td></tr><tr><td>3</td><td>−4,000</td><td>15,000</td><td>5,000</td></tr><tr><td>4</td><td>25,000</td><td>25,000</td><td>5,000</td></tr><tr><td>5</td><td>25,000</td><td>35,000</td><td>36,000</td></tr>
<tr><td>Mean</td><td>7,600</td><td>15,000</td><td>9,200</td></tr><tr><td>SD</td><td>14,207</td><td>14,142</td><td>13,948</td></tr></tbody></table></div>
<ul class="pts"><li>B has the highest mean; C the lowest SD: both efficient. A has a lower mean and higher SD than both: inefficient. <b>E-V efficient set {B, C}.</b></li>
<li>A safety-first person looking only at the worst outcome picks A (−4,000); the extreme risk seeker looks only at the best (C). Neither is the E-V criterion.</li>
<li>Standard abbreviations (E, SD, var) need not be defined in a paper.</li></ul>

<h3>Weaknesses of E-V</h3>
<ol class="pts"><li>The efficient set can be large: domination must be by a single alternative, not a convex combination.</li>
<li>If outcomes are not normal, the E-V efficient set can differ from the SSD set.</li>
<li>If F has a higher mean <i>and</i> higher variance than G, both are E-V efficient even when F pays more in every state and nobody would pick G.</li></ol>
<div class="clarify"><span class="lbl">Clarifying: check it in the lab</span>Load "A, B, C" in the risk-ranking lab: SSD says B dominates C even though E-V keeps C (C's lower SD comes from a long right tail at 36,000 and a lump at 5,000). That is weakness 2 in action.</div>
<div data-tool="rank" data-preset="abc"></div>
</section>

<section data-s="examples">
<details class="sol"><summary>Assignment 7/9 cotton: means 52.910, 53.575, 52.590; variances 462.977, 284.740, 61.577 ($1,000). Expected-profit choice and E-V efficient set?</summary><div class="body"><p>Expected profit: <span class="ans">A2</span> (highest mean). A2 dominates A1 (higher mean, lower variance). A2 vs A3: A2 higher mean, A3 lower variance → both efficient. <span class="ans">E-V efficient set {A2, A3}</span>.</p></div></details>
<details class="sol"><summary>How do you compute an E-V efficient set in a spreadsheet?</summary><div class="body"><p>For each alternative compute \(\sum p_ix_i\) and \(\sum p_i(x_i-\bar x)^2\); remove any alternative beaten on both. The highest-mean and the lowest-variance alternatives are always efficient.</p></div></details>
</section>

<template data-lesson="c7l2" data-ch="7" data-title="First- and second-degree stochastic dominance" data-src="Oct 5 · Oct 7 lectures · IMG_2663 · Oct 10 binder worksheet IMG_2697" data-yt="first order second order stochastic dominance CDF">
<section data-s="learn">
<h3>FSD</h3>
<div class="formula"><span class="lbl">First-degree stochastic dominance</span>Assumption: \(u'(\pi)&gt;0\) only.
\[F\ \text{dominates}\ G\ \text{by FSD if}\ F(\pi)\le G(\pi)\ \text{for all }\pi\ (\text{strict somewhere}).\]
F's CDF lies at or to the right of G's: the CDFs do not cross.</div>
<ul class="pts"><li>If FSD holds, "that is something very strong": everyone who prefers more to less prefers F.</li><li>Test: subtract the CDFs at many points or plot them; in practice people plot.</li><li>Advantage: very weak preference assumption. Disadvantage: not discriminating; the efficient set can be large. In the A/B/C example, B and C cannot be ranked by FSD because their CDFs cross.</li></ul>

<h3>SSD</h3>
<div class="formula"><span class="lbl">Second-degree stochastic dominance</span>Assumptions: \(u'&gt;0\) and \(u''&lt;0\).
\[\int_{-\infty}^{\pi}F(t)\,dt\le\int_{-\infty}^{\pi}G(t)\,dt\quad\text{for all }\pi\ (\text{strict somewhere}).\]</div>
<ul class="pts"><li>The CDFs may cross, but the <b>integrated</b> CDFs (areas from the left) do not.</li><li>F must have the higher (or equal) mean; G's lowest outcome comes first (G starts to the left); more of G is to the left of F than to the right.</li><li>Check cumulative areas at every breakpoint from the left, not just the total area.</li><li>Weaknesses: risk aversion does not always hold; the efficient set can still be large.</li><li><b>Third-degree</b> dominance adds an assumption on \(u'''\) (skewness preference). People think they like positive skewness, but safety-first concerns can make them prefer negative skewness; near-certain bankruptcy can make a decision maker risk seeking (the trader story).</li></ul>
<div class="formula"><span class="lbl">Relationships (binder worksheet)</span>FSD ⇒ SSD (so "FSD but not SSD" is <b>impossible</b>). Not-FSD does not imply not-SSD. FSD does not imply lower variance (so "A FSD B but not E-V" is possible). SSD does not imply E-V dominance when means differ.</div>
<div class="prof"><span class="lbl">Writing note (Oct 7)</span>"Second-Degree Stochastic Dominance" in title case: "second" is a word, not a prefix (compare "Pre-multiply"), so both parts are capitalized. The hyphen is needed because "second" modifies "degree" and together they modify "dominance."</div>
<div data-tool="rank" data-preset="cotton"></div>
</section>

<section data-s="examples">
<details class="sol"><summary>Draw CDFs where A dominates B by FSD but not by E-V.</summary><div class="body"><p>A: 10 or 100 with p = 0.5. B: 9 or 11 with p = 0.5. A's CDF is everywhere at or below B's (FSD), but A's variance is far larger, so A does not E-V dominate B.</p></div></details>
<details class="sol"><summary>Can A dominate B by FSD but not SSD?</summary><div class="body"><p><span class="ans">Impossible.</span> FSD implies SSD: if \(F\le G\) everywhere then the integrals are also ordered.</p></div></details>
<details class="sol"><summary>A/B/C: does B dominate C by SSD?</summary><div class="body"><p>Both CDFs equal 0.2 on [−5k, 5k). From 5k to 25k, C's CDF (0.8) is above B's (0.4, 0.6), building an area gap of 0.4·10,000 + 0.2·10,000 = 6,000 in B's favor. From 35k to 36k B's CDF is higher by 0.2, giving back only 200. Integrated CDF of B is never above C's → <span class="ans">B SSD-dominates C</span>, though E-V keeps C.</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="FSD" data-by="(10-4) Math" href="https://www.youtube.com/watch?v=xGEIoicxmWo">Intro to FOSD Made Easy</a>
<a class="vid" data-tag="SSD" data-by="(10-4) Math" href="https://www.youtube.com/watch?v=q0fOJ9vC3iQ">Clearest Explanation of Second-Order Stochastic Dominance</a>
</section>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">F dominates G by FSD if:</div><ol><li>\(F(\pi)\ge G(\pi)\) for all π</li><li>\(F(\pi)\le G(\pi)\) for all π, strict somewhere</li><li>\(E_F&gt;E_G\)</li><li>\(V_F&lt;V_G\)</li></ol><div class="why">F's CDF is lower: less probability of low outcomes.</div></div>
<div class="q" data-a="3"><div class="stem">SSD requires which assumptions?</div><ol><li>\(u'&gt;0\) only</li><li>Normality</li><li>CARA utility</li><li>\(u'&gt;0\) and \(u''&lt;0\)</li></ol><div class="why">More is better and risk aversion.</div></div>
<div class="q" data-a="0"><div class="stem">"A dominates B by FSD but not by SSD" is:</div><ol><li>Impossible</li><li>Common</li><li>Possible only with normal outcomes</li><li>Possible only with risk seekers</li></ol><div class="why">FSD ⇒ SSD.</div></div>
<div class="q" data-a="2"><div class="stem">Under SSD, CDFs …</div><ol><li>Can never cross</li><li>Must be identical</li><li>May cross, but integrated CDFs do not</li><li>Must have equal variances</li></ol><div class="why">That is the difference from FSD.</div></div>
<div class="q" data-a="1"><div class="stem">Which is true for SSD dominance of F over G with finite means?</div><ol><li>F has the lower mean</li><li>F has the higher (or equal) mean</li><li>F has lower variance</li><li>F is normal</li></ol><div class="why">Even a risk-neutral person must not prefer G.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">FSD condition</div><div class="b">\(F(\pi)\le G(\pi)\ \forall\pi\): CDFs do not cross</div></div>
<div class="fc"><div class="f">SSD condition</div><div class="b">\(\int^{\pi}F\le\int^{\pi}G\ \forall\pi\): integrated CDFs do not cross</div></div>
<div class="fc"><div class="f">FSD vs SSD assumptions</div><div class="b">FSD: u′ &gt; 0. SSD: u′ &gt; 0 and u″ &lt; 0.</div></div>
<div class="fc"><div class="f">FSD but not SSD?</div><div class="b">Impossible: FSD ⇒ SSD</div></div>
<div class="fc"><div class="f">Third-degree SD</div><div class="b">Adds an assumption on u‴ (skewness preference)</div></div>

<template data-lesson="c7l3" data-ch="7" data-title="SDRF, SERF and convex-set dominance" data-src="Oct 9 binder notes IMG_2696 · Oct 19 · Oct 30 review · Assignment 9" data-yt="stochastic efficiency with respect to a function SERF certainty equivalent">
<section data-s="learn">
<h3>SDRF (stochastic dominance with respect to a function)</h3>
<p>Due to Jack Meyer (the professor's risk teacher). Computes efficient sets for a <b>range</b> of Arrow–Pratt absolute risk aversion.</p>
<div class="formula"><span class="lbl">Assumptions and rule</span>(1) \(u'(x)&gt;0\); (2) \(r_L(x)\le-u''(x)/u'(x)\le r_U(x)\) for all \(x\).
\[F\ \text{dominates}\ G\ \text{if}\ \min_{r(x)\in[r_L,r_U]}\int\big[G(x)-F(x)\big]u'(x)\,dx&gt;0.\]
FSD is the special case \(r_L=-\infty,\ r_U=+\infty\); SSD is \(r_L=0,\ r_U=+\infty\). Narrower bounds → more discriminating. Bounds can be negative (risk seekers).</div>

<h3>SERF (stochastic efficiency with respect to a function)</h3>
<p>Due to James Richardson (on the professor's dissertation committee). Popular because software is easier; SDRF is a programming problem (Claude can now write it).</p>
<ol class="pts"><li>Pick a utility family (commonly negative exponential) and a risk-aversion range.</li><li>Compute the CE of every alternative at each coefficient.</li><li>Plot CE against r. At each r, the highest curve is preferred; where curves cross, the preferred action switches.</li><li>The efficient set over the range = alternatives on the upper envelope somewhere in the range.</li></ol>
<ul class="pts"><li>A certain payoff has a horizontal CE curve. A risky payoff's CARA CE falls with r and starts at its mean at \(r=0\).</li><li>Under normality each CARA CE curve is a straight line with slope \(-\sigma^2/2\); otherwise the shape depends on the whole distribution.</li></ul>
<div class="exam"><span class="lbl">Good test question (Oct 30)</span>SDRF vs SERF: both restrict risk aversion; <b>SDRF leaves the utility form unspecified</b> within the bounds, <b>SERF picks a utility family</b>. A preference valid for every utility in the SDRF class also holds for a SERF function in that class.</div>

<h3>Convex-set stochastic dominance (Oct 19)</h3>
<p>An alternative can be dominated by a feasible <b>mixture</b> of other alternatives even when no single one dominates it, shrinking the efficient set. Whether a mixture means random selection or a portfolio (part of the land in each) must be modeled, and feasibility and dependence matter. Discussed briefly, not computed.</p>
<div data-tool="rank" data-preset="cotton"></div>
</section>

<template data-lesson="c8l1" data-ch="8" data-title="One formula, three methods: empirical, Monte Carlo, Gaussian quadrature" data-src="Oct 21 · Oct 23 · Oct 26 lectures · IMG_2810–2812 · Oct 30 review" data-yt="Gaussian quadrature Monte Carlo integration expected value">
<section data-s="learn">
<h3>Why integrate numerically?</h3>
<p>Expected utility with a continuous outcome is an integral, and most integrals cannot be solved analytically. You already used numerical integration: PROC NLMIXED integrates random effects out of the likelihood with Gaussian quadrature (QPOINTS).</p>
<div class="formula"><span class="lbl">The weighted-sum template</span>
\[E[g(X)]=\int g(x)f(x)\,dx\ \approx\ \sum_{j=1}^{K}p_j\,g(x_j),\qquad \sum_jp_j=1.\]</div>
<div class="scrollx"><table class="t"><thead><tr><th>Method</th><th>Points \(x_j\)</th><th>Weights \(p_j\)</th></tr></thead><tbody>
<tr><td>Empirical distribution</td><td>The observed outcomes</td><td>Usually \(1/n\); repeated values aggregate</td></tr>
<tr><td>Monte Carlo</td><td>Random draws from the assumed or fitted distribution</td><td>Usually \(1/K\)</td></tr>
<tr><td>Gaussian quadrature</td><td>Chosen nodes that match moments</td><td>Chosen weights, generally unequal</td></tr></tbody></table></div>
<div class="exam"><span class="lbl">Oct 30 review</span>Be able to identify the nodes and weights for each method, explain moment matching, and evaluate a supplied weighted sum. Reconstructing the whole quadrature algorithm under exam conditions was downplayed.</div>
<ul class="pts">
<li>Historical weights need not be equal if another weighting is justified; keep paired observations together to preserve dependence.</li>
<li>Drawing from a fitted normal is a modeling assumption, not the same as using the empirical distribution.</li>
<li>Monte Carlo needs enough draws (error shrinks like \(1/\sqrt K\)); fix a seed for reproducibility.</li>
<li>Accuracy depends on the integrand, the rule and the effort. Trapezoidal and Simpson rules are other options. Check stability when integration sits inside an optimization.</li>
</ul>

<h3>Gaussian quadrature: matching moments</h3>
<div class="formula"><span class="lbl">K nodes match raw moments through degree 2K − 1</span>
\[\sum_{j=1}^{K}p_jx_j^m=E[X^m],\qquad m=0,1,\dots,2K-1.\]
\(m=0\) is \(\sum p_j=1\): \(2K\) equations including normalization (\(2K-1\) positive-order moments). Five nodes match through the 9th moment.</div>
<p>Construction taught Oct 26: (1) get the target raw moments; (2) solve moment equations for the coefficients of a degree-\(K\) orthogonal polynomial; (3) its roots are the nodes; (4) solve linear equations for the weights; (5) verify the moments.</p>
<div class="formula"><span class="lbl">Two-node example (mean 10, variance 200, normal)</span>
\(m_1=10\), \(m_2=10^2+200=300\), \(m_3=10^3+3(10)(200)=7000\). For \(q(x)=x^2+c_1x+c_0\): \(m_2+c_1m_1+c_0=0\) and \(m_3+c_1m_2+c_0m_1=0\) give \(c_1=-20\), \(c_0=-100\).
\[q(x)=x^2-20x-100,\qquad x_{1,2}=10\pm\sqrt{200}=-4.142,\ 24.142,\qquad p_1=p_2=\tfrac12.\]
Do not confuse variance 200 with SD 200.</div>
<div class="formula"><span class="lbl">Normal shortcuts</span>2 nodes: \(\mu\pm\sigma\), weights ½. 3 nodes: \(\mu+\sigma\{-\sqrt3,0,\sqrt3\}\), weights \(1/6,2/3,1/6\). Normal raw moments: \(E X=\mu\), \(EX^2=\mu^2+\sigma^2\), \(EX^3=\mu^3+3\mu\sigma^2\).</div>
<div class="warn"><span class="lbl">Matching moments ≠ exact for everything</span>Exactness holds for polynomials up to degree \(2K-1\). A nonlinear utility like \(-e^{-rx}\) is only approximated (try K = 1, 2, 3 in the lab).</div>
<div data-tool="quad"></div>
<div class="clarify"><span class="lbl">Clarifying: many random variables</span>Tensor-product quadrature in \(d\) dimensions needs \(K^d\) points; Monte Carlo avoids that grid growth by simulating the dependent vector directly. Correct dependence matters.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Points and weights (0.4, 3), (0.6, 5). Approximate E(X²).</summary><div class="body"><p>\(0.4(9)+0.6(25)=\)<span class="ans">18.6</span>. Do not square the weighted mean (4.2² = 17.64).</p></div></details>
<details class="sol"><summary>Monte Carlo draws 3, 0, 3. Approximate E(X²).</summary><div class="body"><p>\((9+0+9)/3=\)<span class="ans">6</span>.</p></div></details>
<details class="sol"><summary>How many moments does a 3-node Gaussian rule match?</summary><div class="body"><p>Through degree 5 (m = 0,…,5): six equations including normalization.</p></div></details>
<details class="sol"><summary>SAS Monte Carlo template for E[g(X)].</summary><div class="body"><pre class="code">data draws;
  call streaminit(2026);
  do j = 1 to 100000;
    x = rand('normal', mu, sd);   /* SD, not variance */
    value = g_of_x;               /* the integrand */
    output;                       /* forgetting this loses draws */
  end;
run;
proc means data=draws mean stderr; var value; run;</pre></div></details>
</section>

<div class="q" data-a="2"><div class="stem">In Monte Carlo integration, the weights are usually:</div><ol><li>Chosen to match moments</li><li>The observed frequencies</li><li>\(1/K\) for each draw</li><li>Proportional to the integrand</li></ol><div class="why">Each random draw gets equal weight.</div></div>
<div class="q" data-a="1"><div class="stem">A K-node Gaussian quadrature rule matches raw moments through degree:</div><ol><li>K</li><li>2K − 1</li><li>K − 1</li><li>2K + 1</li></ol><div class="why">2K equations including normalization.</div></div>
<div class="q" data-a="0"><div class="stem">Two-node rule for N(10, 200):</div><ol><li>\(10\pm\sqrt{200}\), weights ½</li><li>\(10\pm200\), weights ½</li><li>0 and 20, weights ½</li><li>\(10\pm\sqrt{200}\), weights ⅓ and ⅔</li></ol><div class="why">Nodes μ ± σ, σ = √200 ≈ 14.14.</div></div>

<template data-lesson="c8l2" data-ch="8" data-title="Direct expected-utility maximization and dependence" data-src="Oct 21 · Oct 23 (bull vs steer) · Oct 26 (log-yield model) · Oct 30 (copulas)" data-yt="direct expected utility maximization fertilizer risk aversion copula">
<section data-s="learn">
<h3>Put the integral inside the decision</h3>
<div class="formula"><span class="lbl">Direct expected-utility maximization</span>
\[\max_{a\in A}\int U\big(\pi(a,x)\big)f(x)\,dx\ \approx\ \max_{a\in A}\sum_jp_j\,U\big(\pi(a,x_j)\big).\]
Average the evaluated utilities. Do not put the weighted mean profit inside the nonlinear utility.</div>
<p>This is the "continuous choice, not normal" box of the flowchart (associated with Bruce McCarl). It is part of the class; quadratic programming is not.</p>

<h3>Log-yield nitrogen decision (Oct 26)</h3>
<div class="formula"><span class="lbl">Model and objective with CARA utility</span>
\[\log Y=\alpha_0+\alpha_1\log N+\alpha_2(\log N)^2+\varepsilon,\]
\[\max_{N&gt;0}\ \sum_jp_j\Big[-\exp\Big\{-r\big(P\,e^{\alpha_0+\alpha_1\log N+\alpha_2(\log N)^2+x_j}-cN\big)\Big\}\Big],\]
with \((x_j,p_j)\) the nodes and weights for \(\varepsilon\).</div>
<ul class="pts"><li>Require \(N&gt;0\) for the logs. Keep any random coefficients and dependence in the real model.</li>
<li>The lognormal mean correction \(\sigma^2/2\) gives the <i>mean yield</i>; it does not replace integrating the nonlinear utility over yield risk.</li></ul>

<h3>Define the action correctly: bull vs steer (Oct 23)</h3>
<p>Castration changes both the payoff (weight loss, different price) and the comparison. Comparing observed weights alone does not specify the counterfactual decision. Write the payoff under each action, then integrate.</p>
<div class="prof"><span class="lbl">In class (Oct 21)</span>Three economic principles: incentives matter, resources are scarce, decisions require marginal analysis. Communicate methods clearly within the paper's page limits.</div>

<h3>Dependence and copulas (Oct 30, brief)</h3>
<div class="formula"><span class="lbl">Sklar's idea</span>\(H(x,y)=C\big(F_X(x),F_Y(y)\big)\): a copula \(C\) links marginal CDFs into a joint distribution, separating marginal behavior from dependence. Gaussian copula: \(C_\rho(u,v)=\Phi_\rho(\Phi^{-1}(u),\Phi^{-1}(v))\).</div>
<ul class="pts"><li>Copulas can capture <b>tail dependence</b> (prices or yields crashing together) that ordinary correlation misses; useful for non-normal correlated prices or yields.</li>
<li>Simulation: draw dependent uniforms from the copula → transform with inverse marginal CDFs → evaluate the payoff → average.</li>
<li>Formal IFM estimation (marginals first, then dependence) is an extension beyond class.</li></ul>
<div class="clarify"><span class="lbl">Clarifying: old-exam payoff trap</span>\(\min(\min(P_1,P_2)-K,0)\) is never positive; it is not the usual \(\max(\cdot,0)\) option payoff. Preserve the question's payoff exactly.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Two-node quadrature for ε ~ N(0, 0.04) in the log-yield model. What are the nodes and weights?</summary><div class="body"><p>σ = 0.2: nodes ±0.2, weights ½ each. Expected utility at a given N = ½U(π at ε = −0.2) + ½U(π at ε = +0.2). Repeat over a grid of N and pick the maximum.</p></div></details>
<details class="sol"><summary>A student writes \(\max_N U\big(\sum_jp_j\pi(N,x_j)\big)\). What is wrong?</summary><div class="body"><p>That is utility of expected profit. For nonlinear U the correct objective is \(\sum_jp_jU(\pi(N,x_j))\): probabilities go outside each utility evaluation.</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="0"><div class="stem">Direct expected-utility maximization approximates the objective by:</div><ol><li>\(\sum_jp_jU(\pi(a,x_j))\)</li><li>\(U(\sum_jp_j\pi(a,x_j))\)</li><li>\(\sum_jU(p_j)\pi\)</li><li>\(E(\pi)-\lambda\operatorname{var}(\pi)\) always</li></ol><div class="why">Average utilities at the nodes.</div></div>
<div class="q" data-a="2"><div class="stem">The lognormal mean correction σ²/2:</div><ol><li>Replaces numerical integration of utility</li><li>Is only for Bayesian models</li><li>Gives mean yield but does not integrate utility over yield risk</li><li>Is the CARA risk premium</li></ol><div class="why">Mean yield and expected utility are different objects.</div></div>
<div class="q" data-a="1"><div class="stem">A copula:</div><ol><li>Is a marginal distribution</li><li>Links marginal CDFs into a joint distribution</li><li>Is a quadrature rule</li><li>Measures risk aversion</li></ol><div class="why">It separates dependence from the marginals.</div></div>
</section>

<div class="ol"><div class="oq">How do you simulate with a copula?</div><div class="oa">Dependent uniforms → inverse marginal CDFs → payoff → average.</div></div>
</template>

<template data-lesson="c9l1" data-ch="9" data-title="Figures and tables in the class style" data-src="Aug 31 (Diebold, figures) · Sep 2 · Sep 4 · Sep 18 · table handout IMG_2527–2528" data-yt="data ink ratio chart junk Tufte">
<section data-s="learn">
<h3>Figures</h3>
<div class="prof"><span class="lbl">In class (Aug 31)</span>"This is not really my personal preference. This is actually good science." Default figures from Claude and Excel are poor; Claude's faint gridlines with no axes are "essentially a watermark" of AI.</div>
<ul class="pts">
<li>High information-to-ink ratio: no ink on anything that communicates nothing. Remove gridlines, shading, boxes around the plot, decorations, unnecessary point markers. Keep the axes ("we need axes"); a zero line counts as an axis.</li>
<li>Label both axes with variables and <b>units</b>; scale axes to show movement but avoid the "gee-whiz graph" that makes a small change look huge.</li>
<li>Label lines directly instead of a legend; avoid undefined abbreviations (WTI, VWAP).</li>
<li>As a general rule, <b>no more than five things on a figure</b>.</li>
<li>Readable font sizes (Claude's are often too small); save at <b>600 dpi</b>.</li>
<li>Don't rely on color alone: about 8% of U.S. males are color-blind and many journals print in grayscale.</li>
<li>Title <b>below</b> the figure, starting "Figure 1." and typed in Word, not drawn by R. No double titles. Say what is in the figure, not what it shows ("shows a cycle" is not appropriate). Source below the title; notes after. Interpretation goes in the text.</li>
<li>Need exact values like 4.83? "Do a table."</li>
</ul>

<h3>Tables</h3>
<ul class="pts">
<li>Title <b>above</b> the table in bold, in title case, describing what is in the table.</li>
<li>Three horizontal rules, no vertical rules (Word Insert Table).</li>
<li>Column titles in title case and bottom-aligned; first-column title left-aligned, other column titles centered; row items in sentence case.</li>
<li>Decimal points aligned; units identified (first column or an extra column, not the title).</li>
<li>Define abbreviations (LS means, CF, letters a, b), define asterisks, and put the asterisk on the parameter estimate, not the p-value.</li>
<li>Every table is referred to in the text. "I like 'significance tests,' not 'significant tests.'"</li>
</ul>
<div class="exam"><span class="lbl">Exam pattern</span>"List two (or three) changes to make this figure conform to good graphical style" and "find the problems in this table" appear on the old exams. The hog-inventory figure had dual y-axes, shaded background, gridlines, a legend box with markers, rotated labels, a misspelling ("Oklahaoma"), a title inside the plot and a border.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Old exam: "Figure 7. Producer price of wheat is between 2000 and 2008." List changes.</summary><div class="body"><ul class="pts"><li>Remove gridlines; label the y-axis with units ($/tonne).</li><li>Reword the title to say what is in the figure (wheat producer prices for seven countries, 2000–2008).</li><li>Don't italicize "Figure 7"; align tick marks with year labels.</li><li>Seven series is too many: more than five things on a figure.</li></ul></div></details>
<details class="sol"><summary>Name four things wrong with a typical Claude R figure.</summary><div class="body"><p>Faint gridlines and no axes; legend box instead of direct labels; title drawn inside the plot (double title with the Word caption); small fonts; low resolution.</p></div></details>
</section>

<template data-lesson="c9l2" data-ch="9" data-title="Writing the paper: question, abstract, introduction, theory, data, procedure" data-src="Sep 2 · Sep 9 · Sep 18 · Sep 25 · Sep 30 · Oct 2 · Oct 12 lectures · Assignments 2–6" data-yt="how to write introduction research paper economics contribution">
<section data-s="learn">
<h3>Research question vs objective</h3>
<ul class="pts"><li>"The research question really is relating more to the problem than the objective." Most students just rewrote their objective as a question.</li><li>The objective is narrower and more exact about what you will accomplish, close to the methods but with no procedures in it.</li><li>Assignment 2 rule: one sentence, phrased as a question, not yes/no, with an answer that is not already known.</li></ul>

<h3>Abstract</h3>
<ul class="pts"><li>One sentence each on problem, objective and methods; a couple on results; one on implications. In tight limits, combine problem and purpose. "In AgEcon it's important to have results in your abstract."</li><li>No empty "this has important policy implications" sentence (an editor complained; AI always adds it). Say the specific implication or leave it out.</li></ul>

<h3>Introduction: "the most important part of the paper"</h3>
<ul class="pts"><li>Editors desk-reject about half of submissions after reading the abstract and first page: "if you don't sell the editor that you've done something useful in that amount of time, you're out."</li><li>Purpose statement in the first or second paragraph, then broaden to the literature, the contribution and what the paper does. He often deletes students' opening background paragraph.</li><li>A reader should finish knowing: why am I doing this, who cares, what's new, what's known, how exactly. "Our style is going to be simple ... We're not trying to impress people with a lot of fancy words."</li><li>Synthesize literature ("this set of papers used these methods ... we go beyond it"), not one sentence per paper. A typical paper has 20–30 citations.</li><li>Em dashes are read as a sign of AI. The "research gap" formula's list of three has become an AI tell.</li></ul>
<div class="formula"><span class="lbl">A contribution must be</span>(1) <b>original</b> (argued with literature), (2) <b>important</b> (argue people care), (3) <b>correct</b> (even his accepted papers had text numbers that did not match tables).</div>

<h3>Theory section (term paper requirement)</h3>
<div class="prof"><span class="lbl">In class (Sep 25)</span>"I want the theory section to include an optimization model. I also want you to state hypotheses as part of your theory section, which you usually won't see in journal articles." Not random utility theory copied from a book, not a description of methods: "we're talking about theory." About two double-spaced pages. On Oct 2: many hypotheses "didn't really flow from the theoretical model," and there were too many.</div>
<p>Why theory: statistics gives correlations; arguing causality needs economic theory, which also tells you how to specify and interpret the econometric model. Theory need not be fancy math.</p>

<h3>Data and procedure sections</h3>
<ul class="pts"><li><b>Data</b> (about a page): sources in the references, with website and date accessed when relevant.</li><li><b>Procedure</b> (two to five pages): "Methodology, to me, is a study of methods ... I want it entitled procedure." Write DGPs and equations following Chapter 1.</li></ul>

<h3>Titles, keywords, outlets and AI</h3>
<ul class="pts"><li>Avoid empty title words ("analysis," "evaluation"). Journal titles carry the key phrases people search; keywords should not repeat title words. "The game in academics is still to get citations."</li><li>Name a target journal (AJAE, AEPP, JARE, Food Policy) and an alternative: rejections are normal. "I'm really big on submitting stuff." SAEA meets in Oklahoma City around Feb 1 (250-word abstract, ~80% accepted).</li><li>Claude's priority order: what is in the prompt, then positive instructions, then negative ones. Store long prompts. Proofread with AI selectively so the text does not get "reinfected." Orwell's essay on political language: big words hide a lack of substance.</li><li>Machine learning targets prediction of y; econometrics targets parameters. For optimal N, ML does not work well even if it predicts better.</li></ul>
</section>

<section data-s="examples">
<details class="sol"><summary>Turn "Objective: estimate financial ratios for U.S. agriculture from 1980 to 2025" into a research question.</summary><div class="body"><p>"What measures of financial health should we be looking at for agriculture today?" (relates to the problem; not yes/no; answer unknown).</p></div></details>
<details class="sol"><summary>Rewrite: "This research has important implications for the futures industry."</summary><div class="body"><p>Something specific, e.g., "This research confirms the value of basis and futures markets in allocating grain over time." Or delete it.</p></div></details>
</section>

<section data-s="watch">
<a class="vid" data-tag="Introductions" data-by="Research Masterminds" href="https://www.youtube.com/watch?v=2nGORZo2ZAU">How to write an introduction to a research paper</a>
</section>

<section data-s="quiz">
<div class="q" data-a="2"><div class="stem">What must the term paper's theory section include?</div><ol><li>A literature review</li><li>The regression output</li><li>An optimization model and stated hypotheses</li><li>Random utility theory from a textbook</li></ol><div class="why">His explicit requirement.</div></div>
<div class="q" data-a="0"><div class="stem">What should the methods section be titled?</div><ol><li>Procedure</li><li>Methodology</li><li>Methods and Materials</li><li>Analysis</li></ol><div class="why">"Methodology is a study of methods."</div></div>
<div class="q" data-a="1"><div class="stem">A contribution must be:</div><ol><li>Long, technical, novel</li><li>Original, important, correct</li><li>Funded, published, cited</li><li>Simple, short, catchy</li></ol><div class="why">The three requirements from Oct 12.</div></div>
<div class="q" data-a="3"><div class="stem">Where does the purpose statement go in a modern introduction?</div><ol><li>The last paragraph</li><li>After the literature review</li><li>In the conclusion</li><li>The first or second paragraph</li></ol><div class="why">The old style built slowly; now state the purpose early.</div></div>
</section>
