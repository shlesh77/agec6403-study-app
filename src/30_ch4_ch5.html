<template data-lesson="c4l1" data-ch="4" data-title="Likelihood, LR, Wald and LM tests" data-src="Sep 14, Sep 18 and Sep 25 lectures · laying-hens worksheet · Assignment 5" data-yt="likelihood ratio test Wald test Lagrange multiplier test">
<section data-s="learn">
<h3>The likelihood function</h3>
<p>A <b>likelihood function</b> is the multivariate pdf of the data viewed as a function of the parameters. Maximum likelihood picks the parameters that maximize it. Proof of an optimum needs first- and second-order conditions; software usually checks only the first.</p>

<h3>Five parts of a hypothesis test (Assignment 2, Q8)</h3>
<ol class="pts"><li>Null hypothesis in terms of parameters.</li><li>Alternative hypothesis.</li><li>Test statistic.</li><li>p-value or critical value.</li><li>Conclusion in words.</li></ol>

<h3>The three classical tests</h3>
<div class="formula"><span class="lbl">Likelihood ratio (the course's workhorse)</span>
\[LR=-2\big(\ln L(\tilde\theta)-\ln L(\hat\theta)\big)\ \xrightarrow{d}\ \chi^2_q,\]
\(\tilde\theta\) restricted, \(\hat\theta\) unrestricted, \(q\) = number of restrictions. Needs both models.</div>
<ul class="pts">
<li><b>Wald</b>: uses only the unrestricted estimate and its covariance (the printed t-value). Behaves badly for nonlinear hypotheses and for variance parameters.</li>
<li><b>Lagrange multiplier (score)</b>: uses only the restricted fit. Heteroskedasticity version: regress squared residuals on the variance predictors and use \(nR^2\sim\chi^2\).</li>
</ul>
<div class="prof"><span class="lbl">In class (Sep 14)</span>The class has mostly used likelihood-ratio tests, fewer Wald tests and few LM tests; "think about what the tests mean."</div>

<h3>Testing a variance = 0: the boundary problem</h3>
<p>Deterministic vs stochastic plateau: \(H_0:\sigma_\delta^2=0\) vs \(H_A:\sigma_\delta^2&gt;0\). The null value is on the <b>boundary</b> of the parameter space (a variance cannot be negative).</p>
<div class="formula"><span class="lbl">Boundary result</span>Under \(H_0\), \(LR\sim\tfrac12\chi^2_0+\tfrac12\chi^2_1\). For a 5% test use the \(\chi^2_1\) <b>10%</b> critical value, <b>2.71</b>, not 3.84.</div>
<div class="prof"><span class="lbl">In class (Sep 25)</span>If you simulated data with a zero random effect, about half the estimates would be exactly 0 and half positive. "To do the test at the 5% level, you need to use the ... I believe it's the 10% critical value." People often forget this. The Wald t-value for a variance "is not a good test. But it'll still be printed."</div>

<h3>Nested and non-nested hypotheses</h3>
<ul class="pts">
<li><b>Nested</b>: restricting the larger model gives the smaller one (stochastic → deterministic plateau; skew-normal → normal). Use LR.</li>
<li><b>Non-nested</b>: neither is a restriction of the other (quadratic vs linear plateau, both 3 parameters). With the same dependent variable and the same number of parameters, the model with the higher likelihood fits better (AIC just compares likelihoods). Different numbers of parameters: Cox test (complicated) or Vuong test ("a little bit shaky"); a J test is another option.</li>
<li>R² has little meaning outside OLS.</li>
</ul>
<div class="exam"><span class="lbl">Exam 1 study guide item 9</span>Non-nested hypotheses are more likely to appear as a vocabulary term than as a calculation.</div>

<h3>The Hausman test (as presented in class)</h3>
<p>\(y=\min(\beta_0+\beta_1N,P)+\lambda_t\); \(H_0:\lambda_t\sim N(0,\sigma_\lambda^2)\) (random) vs \(H_A\): \(\lambda_t\) fixed. Estimate both (RANDOM statement vs year in CLASS and MODEL). Compare the statistic with its distribution under the null. "That's all the Hausman test is ... just standard hypothesis testing."</p>
<div class="clarify"><span class="lbl">Clarifying: textbook Hausman</span>Hausman (1978) compares coefficient estimates: \(H=(b_{FE}-b_{RE})'[V_{FE}-V_{RE}]^{-1}(b_{FE}-b_{RE})\sim\chi^2\). The null is that the random effects are uncorrelated with the regressors, so RE is consistent and efficient. Rejecting favors fixed effects.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Laying hens: test homoskedasticity against variance varying with hens per cage by Wald, LR and LM.</summary><div class="body">
<p>Model the variance as \(\sigma_a^2=\exp(\alpha_0+\sum_k\alpha_kD_{ak})\). \(H_0:\alpha_2=\dots=\alpha_5=0\).</p>
<ul class="pts"><li><b>Wald</b>: fit the heteroskedastic model only; test \(\hat\alpha=0\) using its covariance matrix.</li><li><b>LR</b>: fit both; \(-2(\ln L_R-\ln L_U)\sim\chi^2_4\).</li><li><b>LM</b>: fit the homoskedastic model only; regress squared residuals on the dummies; \(nR^2\sim\chi^2_4\).</li></ul></div></details>
<details class="sol"><summary>Assignment 5: restricted log L = −612.4, unrestricted = −610.9. Test deterministic vs stochastic plateau at 5%.</summary><div class="body"><p>\(LR=-2(-612.4+610.9)=3.0\). Boundary critical value 2.71 → <span class="ans">reject the deterministic plateau</span>. (With the naive 3.84 you would wrongly fail to reject.) Numbers are illustrative.</p></div></details>
<details class="sol"><summary>Is skew-normal vs normal nested or non-nested?</summary><div class="body"><p>Nested: setting the skewness parameter to zero gives the normal.</p></div></details>
</section>

</section>

<template data-lesson="c4l2" data-ch="4" data-title="Reading SAS programs and output" data-src="Sep 18 old-exam review · Sep 25 · Exam 1 study guide" data-yt="SAS PROC NLMIXED tutorial">
<section data-s="learn">
<h3>What the exam asks</h3>
<p>"The objective changed from writing SAS statements to interpreting them." Expect a SAS question on PROC MIXED or PROC NLMIXED statements and output.</p>
<h3>PROC MIXED pieces</h3>
<pre class="code">proc mixed data=trial method=reml;
  class variety year;
  model yield = variety / solution;
  random year;
  lsmeans variety / pdiff;
run;</pre>
<ul class="pts"><li><b>CLASS</b>: discrete variables. <b>MODEL</b>: fixed effects. <b>RANDOM</b>: random effects. <b>LSMEANS</b>: adjusted treatment means.</li><li>Year in CLASS + MODEL = fixed year effects; year in RANDOM = random year effects (that switch is the Hausman comparison).</li></ul>

<h3>PROC NLMIXED pieces</h3>
<pre class="code">proc nlmixed data=lahoma qpoints=20;
  parms b0=25 b1=0.3 pbar=45 s2u=0.2 s2e=30;
  s2u_actual = s2u*100;              /* scaling: estimate s2u in units of 100 */
  plateau = pbar + u;
  mean = min(b0 + b1*n, plateau);
  model yield ~ normal(mean, s2e);   /* NLMIXED normal() takes a VARIANCE */
  random u ~ normal(0, s2u_actual) subject=year;
run;</pre>
<ul class="pts">
<li><b>PARMS</b>: starting values. <b>RANDOM ... subject=year</b>: one random effect per year. A random effect inside min changes the plateau; outside it shifts the curve.</li>
<li><b>QPOINTS</b>: Gaussian quadrature points used to integrate the random effect out of the likelihood (numerical integration; most integrals cannot be solved analytically).</li>
<li><b>Scaling</b> (\(s2u\times100\)) changes the Hessian and makes estimation more stable; estimates must be rescaled when reported. On the exam, pointing with arrows to the scaling line is fine.</li>
<li>Judge convergence from the <b>Gradient</b> column, not from the "converged" message.</li>
<li>SAS macros and global variables loop over procedures (needed for a profile likelihood); data steps and procedures behave like subroutines with local variables.</li>
</ul>
<div class="warn"><span class="lbl">Units trap</span>SAS <code>rand('normal', mean, sd)</code> takes a standard deviation; NLMIXED <code>normal(mean, variance)</code> takes a variance; Stan <code>normal(mean, sd)</code> takes an SD.</div>
<div class="prof"><span class="lbl">In class (Sep 25)</span>"That's a very big deal to us that you always put the import of the data in the program." Never import data by point-and-click; a former student could not reproduce which data he had used.</div>
<div class="clarify"><span class="lbl">Clarifying: Assignment 5 estimation ladder</span>(i) Linear model in PROC MIXED; (ii) nonstochastic plateau in NLMIXED; (iii) stochastic plateau with METHOD=FIRO; (iv) without FIRO and with NOAD; if still stuck, print the Hessian (HESS) to find rescaling; always try alternative starting values. Urea at $650/ton is 46% N, so N costs \(650/(2000\times0.46)=\$0.71\) per lb.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Where in the NLMIXED program above is the plateau random?</summary><div class="body"><p><code>plateau = pbar + u;</code> with <code>random u ~ normal(0, s2u_actual) subject=year;</code> The year effect sits inside the min.</p></div></details>
<details class="sol"><summary>Convert urea at $650/ton to $/lb N.</summary><div class="body"><p>One ton = 2,000 lb urea × 0.46 = 920 lb N. \(650/920=\)<span class="ans">$0.707/lb N</span>.</p></div></details>
</section>

<a class="vid" data-tag="Likelihood" data-by="StatQuest with Josh Starmer" href="https://www.youtube.com/watch?v=XepXtl9YKwc">Maximum Likelihood, clearly explained</a>
</section>

<section data-s="quiz">
<div class="q" data-a="2"><div class="stem">In PROC NLMIXED, <code>normal(mean, s2e)</code> uses s2e as:</div><ol><li>A standard deviation</li><li>A precision</li><li>A variance</li><li>A coefficient of variation</li></ol><div class="why">NLMIXED takes a variance; SAS rand() and Stan take an SD.</div></div>
<div class="q" data-a="0"><div class="stem">What does QPOINTS control?</div><ol><li>Number of Gaussian quadrature points to integrate out random effects</li><li>Number of iterations</li><li>Number of chains</li><li>Number of LS means</li></ol><div class="why">Quadrature = numerical integration.</div></div>

</section>

</section>

<template data-chapter="5" data-part="III. Bayesian methods (taught Sep 21–30)" data-title="Bayesian estimation" data-dates="Sep 21 · Sep 25 · Sep 28 · Sep 30 · Oct 30 review · Assignment 6" data-color="5"></template>

<template data-lesson="c5l1" data-ch="5" data-title="Bayes' rule, priors and credible intervals" data-src="Sep 21, Sep 25 and Sep 28 lectures · notebook 2026-09-27 pages · IMG_2649–2653" data-yt="Bayesian inference prior likelihood posterior normal normal conjugate">
<section data-s="learn">
<h3>Why Bayesian (and why it is capitalized)</h3>
<p>Named after Thomas Bayes (1700s), so "Bayesian" is capitalized. Usual statistics is <b>frequentist</b> (Pearson; Fisher at Rothamsted — much of statistics came out of agronomy). In frequentist statistics the interval is random and the parameter is constant, so you cannot say a parameter has a 95% probability of being in an interval. Bayesian methods let you say exactly that.</p>
<p>Why use it for the stochastic plateau:</p>
<ol class="pts"><li>Better convergence.</li><li>You have prior information (corn switch point ≈150 lb N; higher in Nebraska, lower in Oklahoma). "The principle of econometrics is you have information, you ought to use it."</li><li>Avoids theoretical issues from the non-differentiability.</li><li>A random-effect variance is constrained positive, which complicates frequentist tests (the boundary problem).</li></ol>

<div class="formula"><span class="lbl">Bayes' rule</span>
\[P(\theta\mid y)=\frac{P(y\mid\theta)\,P(\theta)}{P(y)}\ \propto\ P(y\mid\theta)\,P(\theta).\]
Posterior ∝ likelihood × prior. \(P(y)=\int P(y\mid\theta)P(\theta)\,d\theta\) is the normalizing constant (marginal likelihood).</div>
<ul class="pts"><li><b>Posterior</b> \(P(\theta\mid y)\): distribution of the parameter given the data.</li><li><b>Likelihood</b> \(P(y\mid\theta)\): probability of the data given the parameters.</li><li><b>Prior</b> \(P(\theta)\): what you knew before these data.</li></ul>

<h3>Kinds of priors</h3>
<ul class="pts">
<li><b>Informative</b>: \(\mu_T\sim N(150,40^2)\) for the corn threshold. "This is for the plateau threshold, not the optimum level."</li>
<li><b>Weakly informative</b>: same mean, large SD (\(N(150,1000^2)\)); rules out absurd values (−5,000 or a million) but lets the data speak. Imposing positivity "is more of a restriction than you want."</li>
<li><b>Diffuse / uninformative / Jeffreys</b>: improper uniform on \((-\infty,\infty)\). With a fully diffuse prior on OLS "you'll get the exact same model, because the prior is doing absolutely nothing."</li>
<li>Already-used <b>certain</b> prior information: leaving sunspots out of a meat demand equation imposes an exact zero.</li>
</ul>
<div class="prof"><span class="lbl">In class (Sep 28)</span>Corn intercept ≈ 70 (somewhere between 40 and 110): a normal prior with mean 70 and SD 100 or 10,000 is weakly informative; SD 20 is informative ("more exact than I probably even am"). "If weakly informative σ = 1000; if informative σ = 20." Normal priors are common for α, β, μ<sub>T</sub>; gamma (or half-normal) for SDs. A normal prior for an SD "is still not a terrible thing," since sign restrictions increase bias.</div>

<h3>Normal–normal updating</h3>
<div class="formula"><span class="lbl">Prior μ ~ N(μ₀, σ₀²), likelihood of the sample mean ~ N(μ, σ²/n)</span>
\[\mu_b=\frac{\sigma_0^2}{\sigma_0^2+\sigma^2/n}\,\tilde\mu+\frac{\sigma^2/n}{\sigma_0^2+\sigma^2/n}\,\mu_0,\qquad \sigma_b^2=\frac{\sigma_0^2\sigma^2}{n\sigma_0^2+\sigma^2}.\]
Equivalently precisions add: \(1/\sigma_b^2=1/\sigma_0^2+n/\sigma^2\).</div>
<ul class="pts"><li>A weighted average with weights summing to one; each weight is proportional to the <i>other</i> source's variance (more weight on the more precise source).</li><li>\(n\) affects only the likelihood. As \(n\to\infty\), the prior's weight → 0 and you get the likelihood back (consistency).</li></ul>
<div data-tool="bayes"></div>

<h3>Credible vs confidence intervals</h3>
<ul class="pts">
<li><b>Confidence (frequentist)</b>: the interval is random, the parameter fixed; "you can be 95% confident that this interval contains the true value" (95% of such intervals cover it).</li>
<li><b>Credible (Bayesian)</b>: "given this, and this, and this, there's a 95% probability that the parameter lies inside this interval." From 10,000 posterior draws, drop 250 from each tail.</li>
<li>"We're not talking about hypothesis tests anymore when we're in this Bayesian world." Intervals are what we ought to report.</li>
</ul>
<div class="exam"><span class="lbl">Oct 30 exam review</span>Know prior, likelihood, posterior and posterior predictive distribution. Know why Bayesian and classical point estimates can agree: (i) the prior is weak, (ii) informative data dominate the prior, or (iii) the prior is centered on the classical estimate. Agreement of point estimates is not the same as equal uncertainty.</div>
</section>

<section data-s="examples">
<h3>Class worksheet (Sep 28)</h3>
<details class="sol"><summary>Prior variance 10⁴, likelihood mean 5 with variance 2. Posterior?</summary><div class="body"><p>Weight on data \(=10^4/(10^4+2)\approx1\). Posterior mean ≈ 5; variance \(=2\cdot10^4/10002\approx\)<span class="ans">2</span>. You get the likelihood back.</p></div></details>
<details class="sol"><summary>Prior mean 10 variance 2, likelihood mean 5 variance 2. Posterior?</summary><div class="body"><p>Equal precision → equal weights. Mean \(=(10+5)/2=\)<span class="ans">7.5</span>, variance \(=2\cdot2/(2+2)=\)<span class="ans">1</span>.</p></div></details>
<details class="sol"><summary>Very tight prior (variance 0.01) at 10, likelihood mean 5 variance 2.</summary><div class="body"><p>Weight on data \(=0.01/2.01\approx0.005\): posterior ≈ <span class="ans">the prior (≈ 10)</span>.</p></div></details>
<details class="sol"><summary>Prior N(60, 25), sample mean 50 with variance 25. Posterior?</summary><div class="body"><p>Equal precision: mean 55, variance 12.5.</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="0"><div class="stem">The posterior is proportional to:</div><ol><li>Likelihood × prior</li><li>Prior ÷ likelihood</li><li>Likelihood + prior</li><li>The marginal likelihood</li></ol><div class="why">\(P(\theta\mid y)\propto P(y\mid\theta)P(\theta)\).</div></div>
<div class="q" data-a="2"><div class="stem">What happens to the prior's influence as n grows?</div><ol><li>It grows</li><li>It stays constant</li><li>It goes to zero</li><li>It becomes the likelihood</li></ol><div class="why">n enters only the likelihood precision n/σ².</div></div>
<div class="q" data-a="1"><div class="stem">Which statement is a Bayesian credible interval?</div><ol><li>95% of such intervals cover the fixed true value</li><li>Given the data and model, there is a 95% probability the parameter is in the interval</li><li>The parameter is in the interval with certainty</li><li>The p-value is below 0.05</li></ol><div class="why">Bayesian intervals make direct probability statements about parameters.</div></div>
<div class="q" data-a="3"><div class="stem">Equal prior and likelihood variances of 2, means 10 and 5. Posterior variance?</div><ol><li>2</li><li>4</li><li>0.5</li><li>1</li></ol><div class="why">\(2\cdot2/(2+2)=1\).</div></div>
<div class="q" data-a="0"><div class="stem">The informative prior \(N(150,40^2)\) is for the corn …</div><ol><li>Threshold (switch point), not the optimum</li><li>Optimal N rate</li><li>Yield intercept</li><li>Price of N</li></ol><div class="why">The optimum is higher (~180) because N is applied to where it is needed one year in six to ten.</div></div>
</section>

<section data-s="cards">
<div class="fc"><div class="f">Bayes' rule</div><div class="b">\(P(\theta\mid y)=P(y\mid\theta)P(\theta)/P(y)\)</div></div>
<div class="fc"><div class="f">Informative vs weakly informative prior</div><div class="b">Same mean; small SD (e.g., 20) vs large SD (e.g., 1,000)</div></div>
<div class="fc"><div class="f">Normal–normal posterior variance</div><div class="b">\(\sigma_0^2\sigma^2/(n\sigma_0^2+\sigma^2)\)</div></div>
<div class="fc"><div class="f">Posterior mean weights</div><div class="b">Each source's weight ∝ the other source's variance</div></div>
<div class="fc"><div class="f">When do Bayesian and ML estimates agree?</div><div class="b">Weak prior, data dominate, or prior centered on the classical estimate</div></div>
</section>

<template data-lesson="c5l2" data-ch="5" data-title="MCMC, Stan and reading the output" data-src="Sep 21, Sep 28 and Sep 30 lectures · Assignment 6 · IMG_2650–2655" data-yt="MCMC explained Stan R-hat effective sample size">
<section data-s="learn">
<h3>Why MCMC</h3>
<p>Computing \(P(y)\) needs heavy numerical integration; Bayesian methods were avoided for a long time because of it. <b>Markov chain Monte Carlo</b> gets around the integral ("a very clever way of doing it") and returns many draws from the posterior.</p>
<ul class="pts">
<li><b>Monte Carlo</b> = random number generation. <b>Markov</b> = only the current state matters (like a random walk). "Markov ... it's Russian."</li>
<li>Output: \(\theta^{(1)},\dots,\theta^{(10{,}000)}\), each \(\theta^{(s)}=(\alpha^s,\beta^s,\mu_T^s,\sigma_T^s,\sigma^s)\). Posterior mean = average of draws; median = between the 5,000th and 5,001st sorted draws; 95% credible interval = cut 2.5% from each tail.</li>
<li><b>Warm-up / burn-in</b>: starting values are drawn randomly from the priors; throw away the first ~1,000 draws so retained draws are from the posterior. (Specifying your own starting values is considered bad practice.)</li>
<li><b>Convergence differs from ML.</b> ML parameters converge to a <i>point</i> (gradients → 0). MCMC should converge to a <i>distribution</i>: check R-hat and other diagnostics.</li>
<li>Failure causes: too few iterations, poorly specified models ("funnels"), poor scaling, many tuning parameters.</li>
<li>Algorithms: Metropolis–Hastings and Gibbs (JAGS, BUGS, SAS PROC MCMC); Hamiltonian Monte Carlo (Stan); INLA (R-INLA). MCMC is a rejection method: tighter acceptance is more accurate but slower.</li>
</ul>

<h3>Posterior predictive distribution</h3>
<div class="formula"><span class="lbl">New site or year</span>\(T_{new}^{(s)}\sim N\big(\mu_T^{(s)},[\sigma_T^{(s)}]^2\big)\): one draw of the threshold for each posterior draw. Uses: filling missing values (NASS gaps, deleted yield-monitor points), predicting thresholds where no trial was run.</div>

<h3>Assignment 6 in RStan</h3>
<ul class="pts">
<li>Install <b>Rtools first, then RStan</b>. "It's very important that you do this first and then that." R writes the Stan program, which compiles to C++.</li>
<li>Program blocks: <b>data</b>, <b>parameters</b> (intercept, slope, plateau mean, plateau trend, variances), <b>transformed parameters</b> (year effects, like BLUPs), <b>model</b> (priors and likelihood), <b>generated quantities</b> (e.g., optimal N for each draw).</li>
<li>Stan's <code>normal(mean, sd)</code> uses an SD. Variance parameters had half-normal priors centered on ML estimates with large variances: a form of <b>empirical Bayes</b> ("cheating a bit," acceptable because the variances are wide).</li>
<li>Year effects drawn as standard normals and rescaled (non-centered): equivalent, faster.</li>
<li><b>Hierarchical</b>: the likelihood is conditional on unobserved year effects, a middle layer between the prior and the data; those effects are <b>latent</b>.</li>
<li>"I like this because it's the way I think. I can write the data generating process down. I don't have to write the likelihood down."</li>
</ul>
<div class="formula"><span class="lbl">The stan() call</span>chains = 4 (four random starts; if all end in the same place, evidence of convergence), iter = 4000 per chain, warmup = 2000, seed (repeatable results), adapt_delta = 0.95, max_treedepth = 12. Retained draws: 2,000 × 4 = 8,000. Thinning = 1.</div>

<h3>Reading the output</h3>
<ul class="pts">
<li>25.663 = posterior mean of α; 22.959 to 28.442 = <b>credible</b> interval.</li>
<li><b>n_eff</b> &lt; 8,000 because draws are autocorrelated (the plateau parameter is most autocorrelated).</li>
<li><b>R-hat</b> above about 1.01 signals non-convergence. Divergent transitions = 0 and max-treedepth hits = 0 are good.</li>
<li>Plateau trend: posterior probability positive = 0.9818: statistically marginal, economically large.</li>
<li>If R-hat is bad: model design matters more than starting values. <b>Center the time trend</b> (subtract 2000) and rescale (÷10).</li>
</ul>
<div class="clarify"><span class="lbl">Clarifying: why 2027 optimal N differs from Assignment 5</span>With a plateau trend, the expected plateau in 2027 is higher than the sample average, so \(N^*\) for 2027 is higher than an optimum computed from a trendless plateau. Compute \(N^*\) for each posterior draw to get its posterior distribution.</div>
</section>

<section data-s="examples">
<details class="sol"><summary>Why is the Assignment 6 model called hierarchical?</summary><div class="body"><p>Because there are layers: priors on the hyperparameters (\(\mu,\sigma\) of year effects), latent year effects drawn from that distribution, and the data conditional on the year effects.</p></div></details>
<details class="sol"><summary>How do you check convergence in Assignment 6?</summary><div class="body"><p>R-hat &lt; 1.01 for every parameter; adequate n_eff; zero divergent transitions; no max-treedepth hits; trace plots of the four chains overlap.</p></div></details>
<details class="sol"><summary>How do you choose between the plateau with and without trend?</summary><div class="body"><p>Credible interval for the trend (does it exclude 0? posterior probability positive = 0.98) and a criterion such as LOO-CV or WAIC (or DIC).</p></div></details>
</section>

<section data-s="quiz">
<div class="q" data-a="1"><div class="stem">What does MCMC produce?</div><ol><li>A single point estimate</li><li>Many (autocorrelated) draws from the posterior</li><li>The prior</li><li>The normalizing constant P(y)</li></ol><div class="why">You summarize the draws (mean, median, credible intervals).</div></div>
<div class="q" data-a="2"><div class="stem">An R-hat of 1.08 means:</div><ol><li>Excellent convergence</li><li>The prior is too strong</li><li>The chains have not converged</li><li>The model has no random effects</li></ol><div class="why">R-hat above ~1.01 is a convergence problem.</div></div>
<div class="q" data-a="0"><div class="stem">Why is n_eff smaller than the number of retained draws?</div><ol><li>The draws are autocorrelated</li><li>Warm-up draws are included</li><li>Stan drops divergent draws</li><li>Chains run in parallel</li></ol><div class="why">Dependent draws carry less information than independent ones.</div></div>
<div class="q" data-a="3"><div class="stem">Which install order works for RStan?</div><ol><li>RStan, then Rtools</li><li>Either order</li><li>Only RStan</li><li>Rtools first, then RStan</li></ol><div class="why">"It's very important that you do this first and then that."</div></div>
<div class="q" data-a="1"><div class="stem">What is burn-in (warm-up)?</div><ol><li>The final draws kept for inference</li><li>Initial draws discarded so retained draws come from the posterior</li><li>The prior distribution</li><li>Thinning the chain</li></ol><div class="why">Starting values are arbitrary random draws from the priors.</div></div>
<div class="q" data-a="2"><div class="stem">A fix the professor recommended for bad R-hat with a time trend:</div><ol><li>Use more informative priors only</li><li>Remove the year effects</li><li>Center and rescale the time trend</li><li>Reduce iterations</li></ol><div class="why">Subtract 2000 and divide by 10 to fix scaling.</div></div>
</section>

<section data-s="cards">
