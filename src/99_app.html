
<!-- ===================== APP SHELL (no need to edit below to add content) ===================== -->
<div class="shell">
  <div class="topbar" id="topbar">
    <button class="iconbtn" id="backbtn" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="toptitle">AGEC 6403 Study App</h1>
    <button class="iconbtn" id="themebtn" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button>
  </div>
  <main id="view"></main>
</div>
<div class="tabbar"><nav id="tabs">
  <a href="#home" data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0A2 2 0 0 0 6 22h13"/><path d="M9 7h6M9 11h6"/></svg>Learn</a>
  <a href="#practice" data-t="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.5a3 3 0 0 1 5.6 1c0 2-3 2.5-3 4.5M12 17.5h.01"/></svg>Practice</a>
  <a href="#cards" data-t="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Cards</a>
  <a href="#tools" data-t="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Labs</a>
  <a href="#more" data-t="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</a>
</nav></div>

<script>
(function () {
"use strict";
/* ---------- state (saved only in this browser) ---------- */
const KEY = 'agec6403-study-v1';
let S = { done: {}, quiz: {}, notes: {}, cards: [], last: null, got: {}, check: {}, theme: '' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const view = $('#view');

/* ---------- read the content templates ---------- */
const CH = $$('template[data-chapter]').map(t => ({ n: t.dataset.chapter, title: t.dataset.title, blurb: t.dataset.blurb || '', dates: t.dataset.dates || '', part: t.dataset.part || '', color: t.dataset.color || '1', preview: t.hasAttribute('data-preview') }));
const LES = $$('template[data-lesson]').map(t => ({ id: t.dataset.lesson, ch: t.dataset.ch, title: t.dataset.title, src: t.dataset.src || '', yt: t.dataset.yt || '', t }));
const REV = {}; $$('template[data-review]').forEach(t => { REV[t.dataset.review] = t; });
const PAGES = {}; $$('template[data-page]').forEach(t => { PAGES[t.dataset.page] = t; });
const chOf = n => CH.find(c => c.n === n);
const lesOf = n => LES.filter(l => l.ch === n);
const chc = n => 'var(--c' + ((chOf(n) || {}).color || 1) + ')';
const sec = (l, s) => l.t.content.querySelector('section[data-s="' + s + '"]');

/* collect quiz questions and flashcards from every lesson */
const QUIZ = [], CARDS = [];
LES.forEach(l => {
  const q = sec(l, 'quiz');
  if (q) $$('.q', q).forEach((el, i) => QUIZ.push({ lesson: l.id, ch: l.ch, i, a: +el.dataset.a, stem: $('.stem', el).innerHTML, opts: $$('ol > li', el).map(x => x.innerHTML), why: ($('.why', el) || { innerHTML: '' }).innerHTML }));
  const c = sec(l, 'cards');
  if (c) $$('.fc', c).forEach(el => CARDS.push({ lesson: l.id, ch: l.ch, f: $('.f', el).innerHTML, b: $('.b', el).innerHTML }));
});
const revItems = n => REV[n] ? $$('.ol', REV[n].content) : [];

/* ---------- MathJax ---------- */
const pendingTypeset = [];
function typeset(el) {
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
  else pendingTypeset.push(el);
}
const mjWait = setInterval(() => {
  if (window.MathJax && MathJax.typesetPromise) { clearInterval(mjWait); pendingTypeset.splice(0).forEach(el => { if (el.isConnected) typeset(el); }); }
}, 150);

/* ---------- small helpers ---------- */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 1700); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function copyText(txt, btn) {
  const done = () => toast('Copied');
  try { navigator.clipboard.writeText(txt).then(done, () => fallback()); } catch (e) { fallback(); }
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Select the text and copy it'); } ta.remove(); }
}
function setTop(title, back) { $('#toptitle').textContent = title; $('#backbtn').hidden = !back; }
$('#backbtn').onclick = () => { if (history.length > 1) history.back(); else location.hash = '#home'; };
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

/* theme: system -> light -> dark */
function applyTheme() { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); redrawAll(); }
$('#themebtn').onclick = () => { S.theme = S.theme === '' ? 'light' : S.theme === 'light' ? 'dark' : ''; save(); applyTheme(); toast(S.theme ? (S.theme === 'dark' ? 'Dark theme' : 'Light theme') : 'Theme follows your device'); };

/* ---------- quiz widget ---------- */
function quizCard(q, num, onAnswer) {
  const el = document.createElement('div'); el.className = 'q';
  el.innerHTML = '<div class="qn">Question ' + num + (q.lesson ? ' · ' + esc(lessonTitle(q.lesson)) : '') + '</div><div class="stem">' + q.stem + '</div><div class="opts"></div>';
  const box = $('.opts', el);
  q.opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="k">' + 'ABCDEF'[i] + '</span><span class="v">' + o + '</span>';
    b.onclick = () => {
      $$('.opt', box).forEach((x, j) => { x.disabled = true; if (j === q.a) x.classList.add('right'); });
      const ok = i === q.a; if (!ok) b.classList.add('wrong');
      const w = document.createElement('div'); w.className = 'why' + (ok ? '' : ' no');
      w.innerHTML = '<b>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + 'ABCDEF'[q.a] + '.') + '</b> ' + q.why;
      el.appendChild(w); typeset(w); onAnswer && onAnswer(ok);
    };
    box.appendChild(b);
  });
  return el;
}
const lessonTitle = id => (LES.find(l => l.id === id) || {}).title || '';

/* ---------- pages ---------- */
function home() {
  setTop('AGEC 6403 Study App', false);
  const total = LES.length, done = LES.filter(l => S.done[l.id]).length;
  let qc = 0, qt = 0; Object.values(S.quiz).forEach(v => { qc += v.c; qt += v.t; });
  const allRev = CH.reduce((a, c) => a + revItems(c.n).length, 0);
  const gotRev = Object.values(S.got).filter(v => v === 1).length;
  const last = LES.find(l => l.id === S.last) || LES.find(l => !S.done[l.id]) || LES[0];
  let h = '<div class="hero"><div class="eyebrow">AGEC 6403 · Advanced Production · Fall 2026</div>' +
    '<h2 class="display">From the experiment to the decision.</h2>' +
    '<p class="muted">Every topic from the syllabus and the lectures (Aug 31 to Oct 30): data generating processes, expected-profit maximization, plateau functions, Bayesian estimation, risk, stochastic dominance and numerical integration. Each chapter ends with one-line review questions.</p></div>';
  if (last) h += '<a class="continue" href="#' + last.id + '"><div><div class="eyebrow">' + (S.last ? 'Continue' : 'Start here') + ' · Chapter ' + last.ch + '</div><strong>' + last.title + '</strong></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></a>';
  h += '<div class="overall"><div class="stat"><b>' + done + '/' + total + '</b><span>lessons done</span></div><div class="stat"><b>' + (qt ? Math.round(100 * qc / qt) + '%' : '–') + '</b><span>quiz accuracy</span></div><div class="stat"><b>' + gotRev + '/' + allRev + '</b><span>one-liners known</span></div></div>';
  let part = '';
  CH.forEach(c => {
    if (c.part && c.part !== part) { part = c.part; h += '<div class="part"><div class="eyebrow">Syllabus part</div><h3>' + c.part + '</h3></div>'; }
    const ls = lesOf(c.n), dn = ls.filter(l => S.done[l.id]).length;
    const ri = revItems(c.n).length, rg = revItems(c.n).filter((_, i) => S.got[c.n + ':' + i] === 1).length;
    h += '<section class="chapter" style="--chc:' + chc(c.n) + '"><header><div class="chnum">' + c.n + '</div><h3>' + c.title + (c.preview ? ' <span class="preview">Preview</span>' : '') + '</h3><div class="src">' + c.dates + '</div></header>' +
      '<div class="meter"><i style="width:' + (ls.length ? 100 * dn / ls.length : 0) + '%"></i></div><ul class="lessons">';
    ls.forEach(l => {
      const qs = S.quiz[l.id];
      h += '<li><a href="#' + l.id + '"><span class="ldot' + (S.done[l.id] ? ' done' : '') + '"></span><span class="lt"><b>' + l.title + '</b><span>' + l.src + '</span></span>' + (qs ? '<span class="qbadge">' + qs.c + '/' + qs.t + '</span>' : '') + '</a></li>';
    });
    if (ri) h += '<li><a href="#review-' + c.n + '"><span class="ldot rev' + (rg === ri ? ' done' : '') + '"></span><span class="lt"><b>Chapter review: one-line questions</b><span>' + ri + ' questions on everything in this chapter</span></span>' + (rg ? '<span class="qbadge">' + rg + '/' + ri + '</span>' : '') + '</a></li>';
    h += '</ul></section>';
  });
  view.innerHTML = h; typeset(view);
}

let lessonTab = 'learn';
function lesson(l) {
  S.last = l.id; save();
  const c = chOf(l.ch) || { title: '' };
  setTop('Chapter ' + l.ch + ' · ' + c.title, true);
  const tabs = [['learn', 'Learn'], ['examples', 'Examples'], ['watch', 'Watch'], ['quiz', 'Quiz'], ['cards', 'Cards'], ['notes', 'My notes']].filter(([k]) => k === 'notes' || sec(l, k));
  if (!tabs.find(t => t[0] === lessonTab)) lessonTab = tabs[0][0];
  const count = k => { const s = sec(l, k); if (!s) return ''; const n = k === 'quiz' ? $$('.q', s).length : k === 'cards' ? $$('.fc', s).length : k === 'examples' ? $$('details', s).length : k === 'watch' ? $$('a.vid', s).length : 0; return n ? '<span class="n">' + n + '</span>' : ''; };
  view.innerHTML = '<div class="lhead" style="--chc:' + chc(l.ch) + '"><a class="chip" href="#home">Chapter ' + l.ch + ' · ' + c.title + '</a><h2 class="display">' + l.title + '</h2><div class="muted">' + l.src + '</div></div>' +
    '<div class="seg" role="tablist">' + tabs.map(([k, n]) => '<button type="button" data-k="' + k + '" class="' + (k === lessonTab ? 'on' : '') + '">' + n + count(k) + '</button>').join('') + '</div><div class="pane" id="pane"></div><div id="foot"></div>';
  $$('.seg button', view).forEach(b => b.onclick = () => { lessonTab = b.dataset.k; $$('.seg button', view).forEach(x => x.classList.toggle('on', x === b)); renderPane(l); });
  renderPane(l); renderFoot(l);
}
function renderPane(l) {
  stopTools();
  const pane = $('#pane'); pane.innerHTML = '';
  const k = lessonTab;
  if (k === 'notes') {
    pane.innerHTML = '<h3>My notes for this lesson</h3><p class="muted">Type anything you want to remember: what the professor stressed, your own examples, questions to ask. Notes are saved in this browser only; use Copy to keep a backup.</p><textarea class="notes" id="note-' + l.id + '" placeholder="Your notes…"></textarea><div class="row"><button class="btn sm" type="button" id="copynote">Copy notes</button><span class="muted" id="notestate"></span></div>';
    const ta = $('textarea', pane); ta.value = S.notes[l.id] || '';
    let tm; ta.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { S.notes[l.id] = ta.value; if (!ta.value) delete S.notes[l.id]; save(); $('#notestate').textContent = 'Saved'; }, 300); };
    $('#copynote').onclick = () => copyText(ta.value);
    return;
  }
  const s = sec(l, k); if (!s) return;
  const node = s.cloneNode(true);
  if (k === 'watch') {
    $$('a.vid', node).forEach(a => {
      const title = a.textContent.trim();
      a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = '<span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><div>' + (a.dataset.tag ? '<div class="tag">' + esc(a.dataset.tag) + '</div>' : '') + '<b>' + esc(title) + '</b><small>' + esc(a.dataset.by || 'YouTube') + '</small></div>';
    });
    const q = l.yt || l.title;
    const more = document.createElement('a'); more.className = 'ytsearch'; more.target = '_blank'; more.rel = 'noopener';
    more.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    more.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search YouTube for more: “' + esc(q) + '”';
    node.appendChild(more);
    pane.appendChild(node);
  } else if (k === 'quiz') {
    const qs = QUIZ.filter(q => q.lesson === l.id);
    let c = 0, t = 0;
    const bar = document.createElement('div'); bar.className = 'scorebar'; bar.hidden = true;
    qs.forEach((q, i) => pane.appendChild(quizCard(Object.assign({}, q, { lesson: null }), i + 1, ok => {
      t++; if (ok) c++;
      if (t === qs.length) {
        const prev = S.quiz[l.id]; if (!prev || c >= prev.c) S.quiz[l.id] = { c, t }; save();
        bar.hidden = false; bar.innerHTML = '<b>' + c + '/' + t + '</b><span>' + (c === t ? 'All correct.' : 'Review the explanations, then try again.') + '</span><button class="btn sm" type="button">Try again</button>';
        $('button', bar).onclick = () => renderPane(l);
      }
    })));
    pane.appendChild(bar);
  } else if (k === 'cards') {
    const wrap = document.createElement('div'); wrap.className = 'mini-flash';
    $$('.fc', node).forEach(fc => {
      const d = document.createElement('div'); d.className = 'fc';
      d.innerHTML = '<button type="button">' + $('.f', fc).innerHTML + '</button><div class="bk">' + $('.b', fc).innerHTML + '</div>';
      $('button', d).onclick = () => d.classList.toggle('open');
      wrap.appendChild(d);
    });
    pane.innerHTML = '<p class="muted">Tap a card to see the answer. All cards also appear in the Cards tab.</p>'; pane.appendChild(wrap);
  } else {
    pane.appendChild(node);
    $$('[data-tool]', pane).forEach(el => mountTool(el, el.dataset.tool, el.dataset.preset));
  }
  typeset(pane);
}
function renderFoot(l) {
  const ls = LES, i = ls.indexOf(l), prev = ls[i - 1], next = ls[i + 1];
  const chLs = lesOf(l.ch), lastInCh = chLs[chLs.length - 1] === l;
  let h = '';
  if (lastInCh && REV[l.ch]) h += '<a class="reviewcta" style="--chc:' + chc(l.ch) + '" href="#review-' + l.ch + '"><span class="ldot rev"></span><span><b>Finish Chapter ' + l.ch + ' with the one-line review</b><span class="muted">' + revItems(l.ch).length + ' quick questions covering the whole chapter</span></span></a>';
  h += '<div class="lessonfoot">' + (prev ? '<a class="btn" href="#' + prev.id + '">← Previous</a>' : '<span></span>') +
    '<button class="btn ' + (S.done[l.id] ? 'good' : 'primary') + '" id="donebtn" type="button">' + (S.done[l.id] ? 'Done ✓' : 'Mark done') + '</button>' +
    (next ? '<a class="btn" href="#' + next.id + '">Next →</a>' : '<span></span>') + '</div>';
  $('#foot').innerHTML = h;
  $('#donebtn').onclick = () => { S.done[l.id] = !S.done[l.id]; if (!S.done[l.id]) delete S.done[l.id]; save(); renderFoot(l); if (S.done[l.id]) toast('Lesson marked done'); };
}

function review(n) {
  stopTools();
  const c = chOf(n); if (!c || !REV[n]) return home();
  setTop('Chapter ' + n + ' review', true);
  const items = revItems(n);
  view.innerHTML = '<div class="lhead" style="--chc:' + chc(n) + '"><a class="chip" href="#home">Chapter ' + n + ' · ' + c.title + '</a><h2 class="display">One-line review</h2><p class="muted">One short question for every idea in this chapter. Answer it in your head, tap Show, then mark whether you knew it.</p></div>' +
    '<div class="row"><button class="btn sm" id="showall" type="button">Show all answers</button><button class="btn sm" id="hideall" type="button">Hide all</button><button class="btn sm" id="onlymiss" type="button">Only ones I missed</button><span class="muted" id="revcount"></span></div><div id="ollist"></div>' +
    '<div class="lessonfoot"><a class="btn" href="#' + (lesOf(n)[0] || {}).id + '">Back to lessons</a><span></span>' + (chOf(String(+n + 1)) ? '<a class="btn primary" href="#' + ((lesOf(String(+n + 1))[0]) || {}).id + '">Next chapter →</a>' : '<span></span>') + '</div>';
  const list = $('#ollist');
  const count = () => { const g = items.filter((_, i) => S.got[n + ':' + i] === 1).length; $('#revcount').textContent = g + ' of ' + items.length + ' known'; };
  items.forEach((it, i) => {
    const k = n + ':' + i;
    const d = document.createElement('div'); d.className = 'ol' + (S.got[k] === 1 ? ' got' : '');
    d.innerHTML = '<span class="no">' + (i + 1) + '</span><div class="oq">' + $('.oq', it).innerHTML + '</div><button class="show" type="button">Show</button><div class="oa">' + $('.oa', it).innerHTML + '</div><div class="gotit"><button class="btn sm good" type="button" data-v="1">I knew it</button><button class="btn sm" type="button" data-v="0">Review again</button></div>';
    $('.show', d).onclick = () => { d.classList.toggle('open'); $('.show', d).textContent = d.classList.contains('open') ? 'Hide' : 'Show'; };
    $$('.gotit button', d).forEach(b => b.onclick = () => { S.got[k] = +b.dataset.v; save(); d.classList.toggle('got', S.got[k] === 1); d.classList.remove('open'); $('.show', d).textContent = 'Show'; count(); });
    list.appendChild(d);
  });
  $('#showall').onclick = () => $$('.ol', list).forEach(d => { d.classList.add('open'); $('.show', d).textContent = 'Hide'; });
  $('#hideall').onclick = () => $$('.ol', list).forEach(d => { d.classList.remove('open'); d.hidden = false; $('.show', d).textContent = 'Show'; });
  $('#onlymiss').onclick = () => $$('.ol', list).forEach((d, i) => { d.hidden = S.got[n + ':' + i] === 1; });
  count(); typeset(view);
}

let pFilter = 'all';
function practice() {
  stopTools();
  setTop('Practice', false);
  const pool = QUIZ.filter(q => pFilter === 'all' || q.ch === pFilter);
  const set = shuffle(pool).slice(0, 10);
  view.innerHTML = '<h2 class="display">Practice quiz</h2><p class="muted">Ten random questions from the lesson quizzes (' + QUIZ.length + ' in the bank). Pick a chapter or mix them all.</p>' +
    '<div class="filter">' + [['all', 'All chapters']].concat(CH.filter(c => QUIZ.some(q => q.ch === c.n)).map(c => [c.n, 'Ch ' + c.n])).map(([k, n]) => '<button type="button" data-k="' + k + '" class="' + (k === pFilter ? 'on' : '') + '">' + n + '</button>').join('') + '</div>' +
    '<div class="pbar"><i id="pb" style="width:0"></i></div><div id="plist"></div><div class="scorebar" id="pscore" hidden></div>';
  $$('.filter button', view).forEach(b => b.onclick = () => { pFilter = b.dataset.k; practice(); });
  let c = 0, t = 0;
  set.forEach((q, i) => $('#plist').appendChild(quizCard(q, i + 1, ok => {
    t++; if (ok) c++; $('#pb').style.width = (100 * t / set.length) + '%';
    if (t === set.length) { const sb = $('#pscore'); sb.hidden = false; sb.innerHTML = '<b>' + c + '/' + t + '</b><span>' + (c >= 8 ? 'Strong work.' : 'Open the lessons for the ones you missed.') + '</span><button class="btn sm primary" type="button">New set</button>'; $('button', sb).onclick = () => { practice(); window.scrollTo(0, 0); }; }
  })));
  if (!set.length) $('#plist').innerHTML = '<div class="empty">No questions in this chapter yet.</div>';
  typeset(view);
}

let cFilter = 'all', cIdx = 0, cOrder = null;
function deck() {
  const mine = S.cards.map((c, i) => ({ ch: c.ch || 'mine', f: esc(c.f), b: esc(c.b), mine: true, i }));
  if (cFilter === 'mine') return mine;
  const base = CARDS.concat(mine.map(m => Object.assign({}, m, { ch: m.ch === 'mine' ? '' : m.ch })));
  return cFilter === 'all' ? base : base.filter(c => c.ch === cFilter);
}
function cardsPage() {
  stopTools();
  setTop('Flashcards', false);
  let d = deck(); if (cOrder && cOrder.length === d.length) d = cOrder.map(i => d[i]); else cOrder = null;
  if (cIdx >= d.length) cIdx = 0;
  const chips = [['all', 'All']].concat(CH.filter(c => CARDS.some(x => x.ch === c.n)).map(c => [c.n, 'Ch ' + c.n]), [['mine', 'My cards']]);
  let h = '<h2 class="display">Flashcards</h2><p class="muted">' + CARDS.length + ' cards from the lessons, plus any you add below. Tap the card to flip.</p>' +
    '<div class="filter">' + chips.map(([k, n]) => '<button type="button" data-k="' + k + '" class="' + (k === cFilter ? 'on' : '') + '">' + n + '</button>').join('') + '</div>';
  if (d.length) {
    const c = d[cIdx];

function plot(cv, o) {

  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H);

  niceTicks(o.y0, o.y1, 5).forEach(v => { const y = Y(v); c.beginPath(); c.moveTo(m.l - 4, y); c.lineTo(m.l, y); c.stroke(); c.fillText(o.yf ? o.yf(v) : String(+v.toFixed(4)).replace('-', '−'), m.l - 6, y); });

const TOOLS = {};

/* ---- 1. Stochastic plateau optimizer ---- */
TOOLS.plateau = {
  title: 'Stochastic plateau: optimal nitrogen', ch: '3', ico: 'N', desc: 'Linear response with a random plateau. See why the expected-profit optimum is above the average kink.',
  init(root, preset, uid) {
    let draw = () => {};
    const C = ctrls(root, uid, [
      ['b0', 'Intercept β₀ (bu/ac)', 0, 60, 1, 25, v => v],
      ['b1', 'Slope β₁ (bu per lb N)', 0.05, 1, 0.01, 0.35, v => v.toFixed(2)],
      ['mu', 'Mean plateau μ (bu/ac)', 20, 90, 1, 45, v => v],
      ['sd', 'Plateau SD σ (bu/ac)', 0, 20, 0.5, 6, v => v],
      ['p', 'Crop price p ($/bu)', 2, 12, 0.1, 6, v => '$' + v.toFixed(2)],
      ['r', 'N price r ($/lb)', 0.1, 2, 0.01, 0.7, v => '$' + v.toFixed(2)]], () => draw());
    const cv1 = canvas(root), lg = legend(root), cv2 = canvas(root), ro = readout(root);
    note(root, 'Expected yield: E(y) = a[1 − Φ(z)] + μΦ(z) − σφ(z), with a = β₀ + β₁N and z = (a − μ)/σ. Optimum: 1 − Φ(z*) = r/(pβ₁), so N* = (μ + σZ<sub>α</sub> − β₀)/β₁.');
    draw = () => {
      const v = C.get(), { b0, b1, mu, sd, p, r } = v;
      const Ey = N => { const a = b0 + b1 * N; if (sd <= 0) return Math.min(a, mu); const z = (a - mu) / sd; return a * (1 - Phi(z)) + mu * Phi(z) - sd * phi(z); };
      const Epi = N => p * Ey(N) - r * N;
      const knot = Math.max(0, (mu - b0) / b1), alpha = r / (p * b1);
      let Ns; if (sd <= 0) Ns = p * b1 > r ? knot : 0; else if (alpha >= 1) Ns = 0; else Ns = Math.max(0, (mu - b0 + sd * invPhi(1 - alpha)) / b1);
      if (Epi(0) > Epi(Ns)) Ns = 0;
      const xmax = Math.max(40, (knot + 3 * sd / b1) * 1.25, Ns * 1.2);
      const ymax = Math.max(mu + 3 * sd, b0) * 1.1;
      const P = plot(cv1, { x0: 0, x1: xmax, y0: 0, y1: ymax, h: 250, xl: 'Nitrogen rate (lb N/acre)', yl: 'Yield (bu/acre)' });
      const mutedC = css('--muted'), acc = css('--accent'), wh = css('--wheat'), sky = css('--sky');
      [0.1, 0.3, 0.5, 0.7, 0.9].forEach(q => { const Pq = mu + sd * invPhi(q); P.line([[0, Math.min(b0, Pq)], [Math.max(0, (Pq - b0) / b1), Pq], [xmax, Pq]], sky, 1, [2, 3]); });
      P.line([[0, Math.min(b0, mu)], [knot, mu], [xmax, mu]], mutedC, 1.5, [6, 4]);
      const pts = []; for (let i = 0; i <= 120; i++) { const N = xmax * i / 120; pts.push([N, Ey(N)]); } P.line(pts, acc, 2.5);
      P.vline(knot, mutedC); P.vline(Ns, wh, [], 2); P.dot(Ns, Ey(Ns), wh);
      P.text('N* = ' + fmt(Ns, 0), Ns, ymax * 0.06, wh, 'left', 'bottom', 5);
      const far = knot > xmax * 0.55; P.text('kink at mean plateau', knot, ymax * 0.97, mutedC, far ? 'right' : 'left', 'top', far ? -5 : 5);
      lg([[sky, 'Realized responses in five different years', 1], [mutedC, 'Plateau fixed at its mean', 1], [acc, 'Expected yield'], [wh, 'Optimal N']]);
      const pp = []; let lo = Infinity, hi = -Infinity; for (let i = 0; i <= 120; i++) { const N = xmax * i / 120, y = Epi(N); pp.push([N, y]); lo = Math.min(lo, y); hi = Math.max(hi, y); }

    note(root, 'E(π) = p·E[min(q, D)] − c·q. With normal demand the optimum sets F(q*) = 1 − c/p (the critical ratio). Value of information = E(π*) with the better forecast − E(π*) with the original forecast.');

      series.forEach((s, i) => Q.line(s, alts[i].col, 2.2, i % 2 ? [7, 4] : []));
      const best = r => alts.reduce((b, a) => CE(a, r) > CE(b, r) ? a : b, alts[0]).name.split(' ')[0];
      const sw = []; let prev = best(r0); for (let i = 1; i <= 400; i++) { const r = r0 + (r1 - r0) * i / 400, b = best(r); if (b !== prev) { sw.push('switches to ' + b + ' near r = ' + fmt(r, 4)); prev = b; } }
      lg2(alts.map((a, i) => [a.col, esc(a.name.split(' ')[0]) + ' (CE at r=' + fmt(r1, 3) + ': ' + fmt(CE(a, r1), 2) + ')', i % 2]).concat([[css('--muted'), 'Preferred at r=' + fmt(r0, 3) + ': ' + best(r0) + (sw.length ? '; ' + sw.join('; ') : '; no switch in this range')]]));
    };
    use(p0);
    return () => draw();
  }
};

/* ---- 6. Gaussian quadrature vs Monte Carlo ---- */
function gaussHermite(K) {
  /* probabilists' Hermite (standard normal weight) via Golub–Welsch with Jacobi eigenvalue iterations */
  const A = Array.from({ length: K }, (_, i) => Array.from({ length: K }, (_, j) => (Math.abs(i - j) === 1 ? Math.sqrt(Math.max(i, j)) : 0)));
  const V = Array.from({ length: K }, (_, i) => Array.from({ length: K }, (_, j) => (i === j ? 1 : 0)));
  for (let sweep = 0; sweep < 100; sweep++) {
    let off = 0; for (let i = 0; i < K; i++) for (let j = i + 1; j < K; j++) off += A[i][j] ** 2;
    if (off < 1e-22) break;
    for (let p = 0; p < K; p++) for (let q = p + 1; q < K; q++) {
      if (Math.abs(A[p][q]) < 1e-300) continue;
      const th = (A[q][q] - A[p][p]) / (2 * A[p][q]); const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)); const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < K; k++) { const akp = A[k][p], akq = A[k][q]; A[k][p] = c * akp - s * akq; A[k][q] = s * akp + c * akq; }
      for (let k = 0; k < K; k++) { const apk = A[p][k], aqk = A[q][k]; A[p][k] = c * apk - s * aqk; A[q][k] = s * apk + c * aqk; }
      for (let k = 0; k < K; k++) { const vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; }
    }
  }
  return Array.from({ length: K }, (_, i) => ({ x: A[i][i], w: V[0][i] ** 2 })).sort((a, b) => a.x - b.x);
}
TOOLS.quad = {
  title: 'Numerical integration: quadrature vs Monte Carlo', ch: '8', ico: '∫', desc: 'Nodes and weights for a normal variable, the moments they match, and E[U] accuracy against Monte Carlo.',
  init(root, preset, uid) {
    let draw = () => {};
    const C = ctrls(root, uid, [
      ['mu', 'Mean μ', -50, 100, 1, 10, v => v],
      ['sd', 'SD σ', 0.5, 40, 0.5, 14.1421, v => (+v).toFixed(2)],
      ['K', 'Quadrature nodes K', 1, 8, 1, 2, v => v],
      ['r', 'CARA r for the test integrand', 0.005, 0.2, 0.005, 0.05, v => (+v).toFixed(3)],
      ['n', 'Monte Carlo draws', 10, 5000, 10, 100, v => v]], () => draw());
    const cv = canvas(root), lg = legend(root), out = document.createElement('div'); root.appendChild(out);
    note(root, 'All three methods use E[g(X)] ≈ Σ pⱼ g(xⱼ). Empirical: the observed data, pⱼ = 1/n. Monte Carlo: random draws, pⱼ = 1/K. Gaussian quadrature: chosen nodes and weights that match raw moments through degree 2K − 1. Defaults reproduce the class example: mean 10, variance 200, two nodes at 10 ± √200.');
    draw = () => {
      const { mu, sd, K, r, n } = C.get();
      const nodes = gaussHermite(K).map(o => ({ x: mu + sd * o.x, w: o.w }));
      const raw = m => { const a = [1, mu]; for (let k = 2; k <= m; k++) a.push(mu * a[k - 1] + (k - 1) * sd * sd * a[k - 2]); return a[m]; };
      let rows = ''; for (let m = 0; m <= 2 * K + 1; m++) { const ex = raw(m), qd = nodes.reduce((s, o) => s + o.w * o.x ** m, 0); const ok = Math.abs(qd - ex) <= 1e-7 * Math.max(1, Math.abs(ex)); rows += '<tr><td>' + m + '</td><td>' + fmt(ex, 3) + '</td><td>' + fmt(qd, 3) + '</td><td>' + (ok ? '✓ match' : '✗ differs') + '</td></tr>'; }
      const ceExact = mu - r * sd * sd / 2;
      const ceQ = -Math.log(nodes.reduce((s, o) => s + o.w * Math.exp(-r * (o.x - mu)), 0)) / r + mu;
      const rnd = mulberry(2026); let acc = 0; for (let i = 0; i < n; i++) { const u1 = rnd() || 1e-12, u2 = rnd(); const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); acc += Math.exp(-r * sd * z); }
      const ceMC = mu - Math.log(acc / n) / r;
      out.innerHTML = '<h4>Nodes and weights</h4><div class="scrollx"><table class="t"><thead><tr><th>Node j</th><th>xⱼ</th><th>pⱼ</th></tr></thead><tbody>' + nodes.map((o, j) => '<tr><td>' + (j + 1) + '</td><td>' + fmt(o.x, 4) + '</td><td>' + fmt(o.w, 5) + '</td></tr>').join('') + '</tbody></table></div>' +
        '<h4>Raw moments E(X<sup>m</sup>)</h4><div class="scrollx"><table class="t"><thead><tr><th>m</th><th>Exact (normal)</th><th>Quadrature Σpⱼxⱼ<sup>m</sup></th><th>Check</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h4>Test: certainty equivalent with U = −e^(−rX)</h4><div class="readout"><div class="hl"><span>Exact CE = μ − rσ²/2</span><b>' + fmt(ceExact, 4) + '</b></div><div><span>Quadrature (K = ' + K + ')</span><b>' + fmt(ceQ, 4) + '</b></div><div><span>Quadrature error</span><b>' + fmt(ceQ - ceExact, 4) + '</b></div><div><span>Monte Carlo (n = ' + n + ', seed 2026)</span><b>' + fmt(ceMC, 4) + '</b></div><div><span>Monte Carlo error</span><b>' + fmt(ceMC - ceExact, 4) + '</b></div></div>';
      const x0 = mu - 4 * sd, x1 = mu + 4 * sd, ymax = Math.max(phi(0) / sd, ...nodes.map(o => o.w)) * 1.12;
      const P = plot(cv, { x0, x1, y0: 0, y1: ymax, h: 220, xl: 'x', yl: 'Density / weight', yf: v => fmt(v, 3) });
      const pts = []; for (let i = 0; i <= 200; i++) { const x = x0 + (x1 - x0) * i / 200; pts.push([x, phi((x - mu) / sd) / sd]); }
      P.line(pts, css('--accent'), 2.5); nodes.forEach(o => P.bar(o.x, o.w, css('--wheat'), 7));
      lg([[css('--accent'), 'Normal density f(x)'], [css('--wheat'), 'Quadrature weights pⱼ at nodes xⱼ']]);
    };
    return () => draw();
  }
};

/* ---- 7. Quadratic production function optimum ---- */
TOOLS.quadopt = {
  title: 'Quadratic response: optimal input', ch: '2', ico: 'Q', desc: 'y = β₀ + β₁N + β₂N². Expected-profit optimum N* = (r/p − β₁)/(2β₂).',
  init(root, preset, uid) {
    let draw = () => {};
    const C = ctrls(root, uid, [['b0', 'β₀ (bu/ac)', 0, 60, 1, 20, v => v], ['b1', 'β₁', 0.05, 1.5, 0.01, 0.6, v => (+v).toFixed(2)], ['b2', 'β₂ (must be negative)', -0.02, -0.0005, 0.0005, -0.003, v => (+v).toFixed(4)], ['p', 'Price p ($/bu)', 2, 12, 0.1, 6, v => '$' + (+v).toFixed(2)], ['r', 'N price r ($/lb)', 0.1, 2, 0.01, 0.7, v => '$' + (+v).toFixed(2)]], () => draw());
    const cv = canvas(root), lg = legend(root), ro = readout(root);
    draw = () => {
      const { b0, b1, b2, p, r } = C.get();
      const y = N => b0 + b1 * N + b2 * N * N, pi = N => p * y(N) - r * N;
      const Nmax = -b1 / (2 * b2); let Ns = (r / p - b1) / (2 * b2); Ns = Math.max(0, Ns);
      const x1 = Math.max(Nmax * 1.3, 20);
      const pts = [], pp = []; for (let i = 0; i <= 120; i++) { const N = x1 * i / 120; pts.push([N, y(N)]); }
      const P = plot(cv, { x0: 0, x1, y0: Math.min(0, y(x1)), y1: y(Nmax) * 1.12, h: 230, xl: 'Nitrogen rate (lb N/acre)', yl: 'Yield (bu/acre)' });
      P.line(pts, css('--accent'), 2.5); P.vline(Nmax, css('--muted')); P.vline(Ns, css('--wheat'), [], 2); P.dot(Ns, y(Ns), css('--wheat'));
      lg([[css('--accent'), 'Expected yield'], [css('--muted'), 'Yield-maximizing N', 1], [css('--wheat'), 'Profit-maximizing N*']]);
      ro([['Yield-max N = −β₁/(2β₂)', fmt(Nmax, 1)], ['Price ratio r/p', fmt(r / p, 4)], ['N* (profit max)', fmt(Ns, 1) + ' lb', 1], ['E(yield) at N*', fmt(y(Ns), 1)], ['E(profit) at N*', '$' + fmt(pi(Ns), 2), 1]]);
    };
    return () => draw();
  }
};

/* ---- 8. Expected revenue and variance of a product ---- */
TOOLS.revenue = {
  title: 'E(PY) and var(PY): price × yield', ch: '2', ico: 'R', desc: 'Why expected revenue is not E(P)E(Y) when price and yield are correlated.',
  init(root, preset, uid) {
    let draw = () => {};
    const C = ctrls(root, uid, [['mp', 'Mean price E(P) ($/bu)', 2, 12, 0.1, 6, v => '$' + (+v).toFixed(2)], ['sp', 'SD of price', 0, 3, 0.05, 1, v => (+v).toFixed(2)], ['my', 'Mean yield E(Y) (bu/ac)', 10, 200, 1, 45, v => v], ['sy', 'SD of yield', 0, 40, 0.5, 10, v => v], ['rho', 'Correlation ρ(P, Y)', -0.95, 0.95, 0.05, -0.3, v => (+v).toFixed(2)]], () => draw());
    const ro = readout(root);
    note(root, 'E(PY) = E(P)E(Y) + cov(P, Y). For bivariate normal P and Y: var(PY) = E(P)²var(Y) + E(Y)²var(P) + 2E(P)E(Y)cov + var(P)var(Y) + cov². With ρ = 0 the cov terms drop out.');
    draw = () => {
      const { mp, sp, my, sy, rho } = C.get(); const cv = rho * sp * sy;
      const er = mp * my + cv, vr = mp * mp * sy * sy + my * my * sp * sp + 2 * mp * my * cv + sp * sp * sy * sy + cv * cv;
      ro([['E(P)E(Y)', '$' + fmt(mp * my, 2)], ['cov(P, Y)', fmt(cv, 3)], ['E(PY) true expected revenue', '$' + fmt(er, 2), 1], ['Error from E(P)E(Y)', '$' + fmt(mp * my - er, 2)], ['SD of revenue', '$' + fmt(Math.sqrt(vr), 2), 1], ['SD if ρ were 0', '$' + fmt(Math.sqrt(mp * mp * sy * sy + my * my * sp * sp + sp * sp * sy * sy), 2)]]);
    };
    return () => draw();
  }
};
